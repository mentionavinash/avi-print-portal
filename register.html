<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Create your AviPrint Portal account">

    <title>Create Account | AviPrint Portal</title>

    <link rel="stylesheet"
          href="css/style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- AviPrint Config -->
    <script src="config.js"></script>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="navbar">

    <div class="container nav-container">

        <a href="index.html"
           class="logo">

            <span class="logo-icon">
                A
            </span>

            <span>
                Avi<span>Print</span>
            </span>

        </a>

    </div>

</header>



<!-- =========================
     REGISTER PAGE
========================= -->

<main class="auth-page">

    <div class="auth-card">


        <!-- LOGO -->

        <div class="auth-logo">

            <a href="index.html"
               class="logo">

                <span class="logo-icon">
                    A
                </span>

                <span>
                    Avi<span>Print</span>
                </span>

            </a>

        </div>


        <!-- TITLE -->

        <h1 class="auth-title">
            Create Account
        </h1>


        <p class="auth-subtitle">
            Join AviPrint and manage your
            printing easily.
        </p>


        <!-- REGISTER FORM -->

        <form id="registerForm">


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required>

            </div>


            <!-- MOBILE -->

            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    placeholder="Enter your mobile number"
                    inputmode="numeric"
                    maxlength="10"
                    autocomplete="tel"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="8"
                    required>

                <small
                    style="
                    display:block;
                    margin-top:6px;
                    color:#9ca3af;
                    font-size:11px;
                    ">

                    Minimum 8 characters

                </small>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    minlength="8"
                    required>

            </div>


            <!-- TERMS -->

            <div
                style="
                display:flex;
                align-items:flex-start;
                gap:9px;
                margin-bottom:20px;
                ">

                <input
                    type="checkbox"
                    id="terms"
                    required
                    style="margin-top:4px;">

                <label
                    for="terms"
                    style="
                    font-size:12px;
                    color:#6b7280;
                    cursor:pointer;
                    ">

                    I agree to the

                    <a
                        href="#"
                        style="
                        color:#2563eb;
                        font-weight:700;
                        ">

                        Terms & Privacy Policy

                    </a>

                </label>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="primary-btn auth-submit"
                id="registerButton">

                Create Account

                <span>
                    →
                </span>

            </button>


        </form>


        <!-- DIVIDER -->

        <div class="auth-divider">
            OR
        </div>


        <!-- LOGIN -->

        <p class="register-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <!-- BACK HOME -->

        <a
            href="index.html"
            class="back-home">

            ← Back to Home

        </a>


    </div>

</main>



<!-- =========================
     REGISTRATION SCRIPT
========================= -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


    /* =========================
       ELEMENTS
    ========================= */

    const registerForm =
        document.getElementById(
            "registerForm"
        );


    const registerButton =
        document.getElementById(
            "registerButton"
        );


    /* =========================
       SUPABASE CHECK
    ========================= */

    if (
        typeof window.supabase ===
        "undefined"
    ) {

        alert(
            "Supabase library could not be loaded."
        );

        return;

    }


    if (
        typeof supabaseClient ===
        "undefined" ||
        !supabaseClient
    ) {

        alert(
            "Supabase configuration could not be loaded."
        );

        return;

    }


    /* =========================
       REGISTER
    ========================= */

    registerForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            /* =========================
               GET VALUES
            ========================= */

            const name =
                document
                .getElementById("name")
                .value
                .trim();


            const mobile =
                document
                .getElementById("mobile")
                .value
                .trim();


            const email =
                document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


            const password =
                document
                .getElementById("password")
                .value;


            const confirmPassword =
                document
                .getElementById("confirmPassword")
                .value;


            const terms =
                document
                .getElementById("terms")
                .checked;


            /* =========================
               VALIDATION
            ========================= */

            if (!name) {

                alert(
                    "Please enter your full name."
                );

                return;

            }


            if (
                !/^[0-9]{10}$/.test(mobile)
            ) {

                alert(
                    "Please enter a valid 10-digit mobile number."
                );

                return;

            }


            if (!email) {

                alert(
                    "Please enter your email address."
                );

                return;

            }


            if (password.length < 8) {

                alert(
                    "Password must be at least 8 characters."
                );

                return;

            }


            if (
                password !==
                confirmPassword
            ) {

                alert(
                    "Passwords do not match."
                );

                return;

            }


            if (!terms) {

                alert(
                    "Please accept the Terms & Privacy Policy."
                );

                return;

            }


            /* =========================
               BUTTON
            ========================= */

            registerButton.disabled =
                true;

            registerButton.innerHTML =
                "Creating Account...";


            /* =========================
               SUPABASE SIGN UP
            ========================= */

            try {

                const {
                    data,
                    error
                } =
                await supabaseClient
                .auth
                .signUp({

                    email:
                        email,

                    password:
                        password,

                    options: {

                        data: {

                            full_name:
                                name,

                            mobile:
                                mobile

                        }

                    }

                });


                /* =========================
                   ERROR
                ========================= */

                if (error) {

                    throw error;

                }


                console.log(
                    "Registration successful:",
                    data
                );


                /* =========================
                   USER CHECK
                ========================= */

                if (
                    !data ||
                    !data.user
                ) {

                    throw new Error(
                        "Account could not be created."
                    );

                }


                /* =========================
                   PROFILE CHECK
                   
                   The database trigger
                   automatically creates
                   profiles row.
                ========================= */

                console.log(
                    "User ID:",
                    data.user.id
                );


                console.log(
                    "Full Name:",
                    name
                );


                console.log(
                    "Email:",
                    email
                );


                /* =========================
                   SUCCESS
                ========================= */

                alert(
                    "Account created successfully!\n\n" +
                    "Your name has been saved to your profile.\n\n" +
                    "Please check your email to verify your account."
                );


                window.location.href =
                    "login.html";


            }


            catch (error) {

                console.error(
                    "Registration Error:",
                    error
                );


                let message =
                    "Registration failed.";


                if (
                    error &&
                    error.message
                ) {

                    message =
                        error.message;

                }


                alert(
                    "Registration failed:\n\n" +
                    message
                );

            }


            finally {

                registerButton.disabled =
                    false;


                registerButton.innerHTML = `
                    Create Account
                    <span>→</span>
                `;

            }

        }
    );

});

</script>


</body>

</html>
