<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Create your AviPrint Portal account">

    <title>Create Account | AviPrint Portal</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="navbar">

    <div class="container nav-container">

        <a href="index.html"
           class="logo">

            <span class="logo-icon">
                A
            </span>

            <span>
                Avi<span>Print</span>
            </span>

        </a>

    </div>

</header>



<!-- =========================
     REGISTER PAGE
========================= -->

<main class="auth-page">


    <div class="auth-card">


        <div class="auth-logo">

            <a href="index.html"
               class="logo">

                <span class="logo-icon">
                    A
                </span>

                <span>
                    Avi<span>Print</span>
                </span>

            </a>

        </div>



        <h1 class="auth-title">

            Create Account

        </h1>



        <p class="auth-subtitle">

            Join AviPrint and manage your
            printing easily.

        </p>



        <form id="registerForm">


            <!-- NAME -->

            <div class="form-group">

                <label for="name">

                    Full Name

                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required>

            </div>



            <!-- MOBILE -->

            <div class="form-group">

                <label for="mobile">

                    Mobile Number

                </label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    placeholder="Enter your mobile number"
                    inputmode="numeric"
                    maxlength="10"
                    required>

            </div>



            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">

                    Email Address

                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">

                    Password

                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="8"
                    required>

                <small
                    style="
                    display:block;
                    margin-top:6px;
                    color:#9ca3af;
                    font-size:11px;
                    ">

                    Minimum 8 characters

                </small>

            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">

                    Confirm Password

                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    minlength="8"
                    required>

            </div>



            <!-- TERMS -->

            <div
                style="
                display:flex;
                align-items:flex-start;
                gap:9px;
                margin-bottom:20px;
                ">

                <input
                    type="checkbox"
                    id="terms"
                    required
                    style="margin-top:4px;">

                <label
                    for="terms"
                    style="
                    font-size:12px;
                    color:#6b7280;
                    cursor:pointer;
                    ">

                    I agree to the
                    <a
                        href="#"
                        style="
                        color:#2563eb;
                        font-weight:700;
                        ">

                        Terms & Privacy Policy

                    </a>

                </label>

            </div>



            <!-- SUBMIT -->

            <button
                type="submit"
                class="primary-btn auth-submit">

                Create Account

                <span>
                    →
                </span>

            </button>


        </form>



        <!-- DIVIDER -->

        <div class="auth-divider">

            OR

        </div>



        <!-- LOGIN -->

        <p class="register-text">

            Already have an account?

            <a href="login.html">

                Login

            </a>

        </p>



        <a
            href="index.html"
            class="back-home">

            ← Back to Home

        </a>


    </div>


</main>



<!-- =========================
     TEMPORARY FORM SCRIPT
========================= -->

<script>

const registerForm =
    document.getElementById("registerForm");


registerForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const password =
            document.getElementById(
                "password"
            ).value;


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        if (password !== confirmPassword) {

            alert(
                "Passwords do not match."
            );

            return;

        }


        alert(
            "Registration system will be connected to the secure backend in the next phase."
        );

    }
);

</script>


</body>

</html>
