<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | AviPrint</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>

.profile-container{
    max-width:800px;
    margin:40px auto;
    padding:20px;
}

.profile-card{
    background:#fff;
    border-radius:15px;
    padding:30px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.profile-title{
    margin-bottom:25px;
}

.profile-title h1{
    margin-bottom:7px;
}

.profile-title p{
    color:#6b7280;
}

.profile-avatar{
    width:80px;
    height:80px;
    border-radius:50%;
    background:#2563eb;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:bold;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
    font-size:14px;
}

.form-group input{
    width:100%;
    height:45px;
    border:1px solid #d1d5db;
    border-radius:8px;
    padding:0 12px;
    font-size:14px;
}

.form-group input:focus{
    outline:none;
    border-color:#2563eb;
}

.form-group input:disabled{
    background:#f3f4f6;
}

.save-btn{
    background:#2563eb;
    color:white;
    border:0;
    padding:12px 22px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.save-btn:disabled{
    opacity:.6;
}

.message{
    display:none;
    padding:12px;
    border-radius:8px;
    margin-bottom:20px;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.back-link{
    display:inline-block;
    margin-top:20px;
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

</style>

</head>

<body>


<header class="navbar">

<div class="container nav-container">

<a href="dashboard.html" class="logo">

<span class="logo-icon">A</span>

<span>
Avi<span>Print</span>
</span>

</a>

<nav class="nav-menu">

<a href="dashboard.html">
Dashboard
</a>

<a href="services.html">
Services
</a>

<a href="orders.html">
My Orders
</a>

<a href="profile.html">
Profile
</a>

</nav>

</div>

</header>


<main class="profile-container">

<div class="profile-title">

<h1>👤 My Profile</h1>

<p>
Manage your AviPrint account information.
</p>

</div>


<div id="successMessage" class="message success"></div>

<div id="errorMessage" class="message error"></div>


<div class="profile-card">


<div id="avatar" class="profile-avatar">
A
</div>


<form id="profileForm">


<div class="form-group">

<label>
Full Name
</label>

<input
type="text"
id="fullName"
placeholder="Enter your full name"
required>

</div>


<div class="form-group">

<label>
Mobile Number
</label>

<input
type="tel"
id="mobile"
maxlength="10"
placeholder="Enter mobile number">

</div>


<div class="form-group">

<label>
Email Address
</label>

<input
type="email"
id="email"
disabled>

</div>


<div class="form-group">

<label>
Account Role
</label>

<input
type="text"
id="role"
disabled>

</div>


<button
type="submit"
id="saveButton"
class="save-btn">

Save Changes

</button>

</form>


</div>


<a
href="dashboard.html"
class="back-link">

← Back to Dashboard

</a>

</main>


<script>

document.addEventListener("DOMContentLoaded", async function(){

    console.log("PROFILE PAGE LOADED");

    /* =========================
       CHECK SUPABASE
    ========================= */

    if(typeof supabaseClient === "undefined"){

        showError(
            "Supabase configuration not loaded. Check config.js."
        );

        return;

    }


    /* =========================
       GET SESSION
    ========================= */

    try{

        const result =
        await supabaseClient.auth.getSession();

        console.log(
            "Session result:",
            result
        );


        if(result.error){

            throw result.error;

        }


        const session =
        result.data.session;


        if(!session){

            window.location.href =
            "login.html";

            return;

        }


        const user =
        session.user;


        console.log(
            "Logged in user:",
            user
        );


        const userId =
        user.id;


        const userEmail =
        user.email || "";


        /* =========================
           AUTH METADATA
        ========================= */

        let name =
        user.user_metadata?.full_name || "";


        let mobile =
        user.user_metadata?.mobile || "";


        /* =========================
           LOAD PROFILE
        ========================= */

        const profileResult =
        await supabaseClient
        .from("profiles")
        .select(
            "id,email,full_name,mobile,role,created_at"
        )
        .eq(
            "id",
            userId
        )
        .maybeSingle();


        console.log(
            "Profile result:",
            profileResult
        );


        if(
            profileResult.error
        ){

            console.warn(
                "Profile table error:",
                profileResult.error
            );

        }


        const profile =
        profileResult.data;


        /* =========================
           PRIORITY
        ========================= */

        if(
            profile &&
            profile.full_name
        ){

            name =
            profile.full_name;

        }


        if(
            profile &&
            profile.mobile
        ){

            mobile =
            profile.mobile;

        }


        if(!name){

            name =
            userEmail
            .split("@")[0];

        }


        /* =========================
           DISPLAY
        ========================= */

        document.getElementById(
            "fullName"
        ).value =
        name;


        document.getElementById(
            "mobile"
        ).value =
        mobile;


        document.getElementById(
            "email"
        ).value =
        userEmail;


        document.getElementById(
            "role"
        ).value =
        profile?.role ||
        "customer";


        document.getElementById(
            "avatar"
        ).textContent =
        name
        .charAt(0)
        .toUpperCase();


        /* =========================
           SAVE
        ========================= */

        document.getElementById(
            "profileForm"
        ).addEventListener(
        "submit",
        async function(event){

            event.preventDefault();


            const newName =
            document.getElementById(
                "fullName"
            ).value.trim();


            const newMobile =
            document.getElementById(
                "mobile"
            ).value.trim();


            if(!newName){

                showError(
                    "Please enter your full name."
                );

                return;

            }


            if(
                newMobile &&
                !/^[0-9]{10}$/.test(
                    newMobile
                )
            ){

                showError(
                    "Enter a valid 10-digit mobile number."
                );

                return;

            }


            const button =
            document.getElementById(
                "saveButton"
            );


            button.disabled =
            true;

            button.textContent =
            "Saving...";


            hideMessages();


            try{

                /* =========================
                   UPDATE AUTH USER
                ========================= */

                const authUpdate =
                await supabaseClient
                .auth
                .updateUser({

                    data:{

                        full_name:
                        newName,

                        mobile:
                        newMobile

                    }

                });


                if(authUpdate.error){

                    throw authUpdate.error;

                }


                /* =========================
                   UPDATE PROFILE
                ========================= */

                const profileUpdate =
                await supabaseClient
                .from("profiles")
                .upsert({

                    id:userId,

                    email:userEmail,

                    full_name:newName,

                    mobile:newMobile,

                    role:
                    profile?.role ||
                    "customer"

                });


                if(profileUpdate.error){

                    throw profileUpdate.error;

                }


                document.getElementById(
                    "avatar"
                ).textContent =
                newName
                .charAt(0)
                .toUpperCase();


                showSuccess(
                    "Profile updated successfully."
                );

            }


            catch(error){

                console.error(
                    "SAVE PROFILE ERROR:",
                    error
                );


                showError(
                    "Profile update failed: " +
                    error.message
                );

            }


            finally{

                button.disabled =
                false;

                button.textContent =
                "Save Changes";

            }

        });


    }


    catch(error){

        console.error(
            "PROFILE ERROR:",
            error
        );


        showError(
            "Unable to load profile: " +
            error.message
        );

    }


});


function showSuccess(message){

    const box =
    document.getElementById(
        "successMessage"
    );

    box.textContent =
    message;

    box.style.display =
    "block";

}


function showError(message){

    const box =
    document.getElementById(
        "errorMessage"
    );

    box.textContent =
    message;

    box.style.display =
    "block";

}


function hideMessages(){

    document.getElementById(
        "successMessage"
    ).style.display =
    "none";

    document.getElementById(
        "errorMessage"
    ).style.display =
    "none";

}

</script>

</body>

</html>
