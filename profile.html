<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Manage your AviPrint Portal profile">

    <title>My Profile | AviPrint Portal</title>

    <link rel="stylesheet"
          href="css/style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- AviPrint Supabase Config -->
    <script src="config.js"></script>

    <style>

        .profile-page {
            padding: 50px 20px;
            min-height: calc(100vh - 80px);
            background: #f4f6f9;
        }

        .profile-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .profile-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 1px solid #e5e7eb;
        }

        .profile-avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .profile-header h1 {
            margin: 0 0 5px;
            font-size: 25px;
            color: #111827;
        }

        .profile-header p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }

        .profile-message {
            display: none;
            padding: 13px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .profile-success {
            background: #dcfce7;
            color: #166534;
        }

        .profile-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .profile-field {
            margin-bottom: 5px;
        }

        .profile-field.full {
            grid-column: 1 / -1;
        }

        .profile-field label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #374151;
        }

        .profile-field input {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            background: white;
        }

        .profile-field input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,.10);
        }

        .profile-field input:disabled {
            background: #f3f4f6;
            color: #6b7280;
            cursor: not-allowed;
        }

        .field-note {
            display: block;
            margin-top: 6px;
            font-size: 11px;
            color: #9ca3af;
        }

        .profile-actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .save-btn {
            border: 0;
            background: #2563eb;
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .save-btn:disabled {
            opacity: .6;
            cursor: wait;
        }

        .logout-profile-btn {
            border: 0;
            background: #ef4444;
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
        }

        .logout-profile-btn:hover {
            background: #dc2626;
        }

        .back-btn {
            display: inline-block;
            margin-top: 22px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }

        .loading-profile {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        @media(max-width:700px) {

            .profile-page {
                padding: 25px 15px;
            }

            .profile-card {
                padding: 20px;
            }

            .profile-grid {
                grid-template-columns: 1fr;
            }

            .profile-field.full {
                grid-column: auto;
            }

            .profile-header {
                align-items: flex-start;
            }

            .profile-avatar {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }

            .profile-header h1 {
                font-size: 21px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

    <div class="container nav-container">

        <a href="index.html"
           class="logo">

            <span class="logo-icon">
                A
            </span>

            <span>
                Avi<span>Print</span>
            </span>

        </a>

    </div>

</header>



<!-- =========================
     PROFILE
========================= -->

<main class="profile-page">

    <div class="profile-container">

        <div class="profile-card">


            <!-- HEADER -->

            <div class="profile-header">

                <div
                    class="profile-avatar"
                    id="profileAvatar">

                    A

                </div>


                <div>

                    <h1>
                        My Profile
                    </h1>

                    <p id="profileEmailText">
                        Loading profile...
                    </p>

                </div>

            </div>


            <!-- MESSAGES -->

            <div
                id="successMessage"
                class="profile-message profile-success">
            </div>


            <div
                id="errorMessage"
                class="profile-message profile-error">
            </div>


            <!-- FORM -->

            <form id="profileForm">

                <div class="profile-grid">


                    <!-- FULL NAME -->

                    <div class="profile-field">

                        <label for="fullName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required>

                    </div>


                    <!-- MOBILE -->

                    <div class="profile-field">

                        <label for="mobile">
                            Mobile Number
                        </label>

                        <input
                            type="tel"
                            id="mobile"
                            placeholder="Enter your 10-digit mobile number"
                            inputmode="numeric"
                            maxlength="10"
                            autocomplete="tel">

                    </div>


                    <!-- EMAIL -->

                    <div class="profile-field full">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            disabled>

                        <small class="field-note">
                            Email is connected to your login account and cannot be changed here.
                        </small>

                    </div>


                </div>


                <!-- ACTIONS -->

                <div class="profile-actions">

                    <button
                        type="submit"
                        class="save-btn"
                        id="saveButton">

                        💾 Save Changes

                    </button>


                    <button
                        type="button"
                        class="logout-profile-btn"
                        id="logoutButton">

                        🚪 Logout

                    </button>

                </div>

            </form>


            <a
                href="dashboard.html"
                class="back-btn">

                ← Back to Dashboard

            </a>


        </div>

    </div>

</main>



<script>

/* =========================================================
   SUPABASE CHECK
========================================================= */

if (
    typeof window.supabase === "undefined"
) {

    alert(
        "Supabase library could not be loaded."
    );

}


if (
    typeof supabaseClient === "undefined" ||
    !supabaseClient
) {

    alert(
        "Supabase configuration could not be loaded."
    );

}


/* =========================================================
   ELEMENTS
========================================================= */

const profileForm =
    document.getElementById(
        "profileForm"
    );


const saveButton =
    document.getElementById(
        "saveButton"
    );


const logoutButton =
    document.getElementById(
        "logoutButton"
    );


const fullNameInput =
    document.getElementById(
        "fullName"
    );


const mobileInput =
    document.getElementById(
        "mobile"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const profileAvatar =
    document.getElementById(
        "profileAvatar"
    );


const profileEmailText =
    document.getElementById(
        "profileEmailText"
    );


/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    loadProfile
);


/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile() {

    try {

        const {
            data,
            error
        } =
        await supabaseClient
        .auth
        .getSession();


        if (error) {

            throw error;

        }


        const session =
            data.session;


        /* =========================
           NOT LOGGED IN
        ========================= */

        if (
            !session ||
            !session.user
        ) {

            window.location.href =
                "login.html";

            return;

        }


        const user =
            session.user;


        const userId =
            user.id;


        const userEmail =
            user.email || "";


        /* =========================
           EMAIL
        ========================= */

        emailInput.value =
            userEmail;


        profileEmailText.textContent =
            userEmail;


        /* =========================
           PROFILE
        ========================= */

        const {
            data:profile,
            error:profileError
        } =
        await supabaseClient
        .from("profiles")
        .select(
            "id,email,full_name,role,created_at"
        )
        .eq(
            "id",
            userId
        )
        .maybeSingle();


        if (profileError) {

            throw profileError;

        }


        /* =========================
           NAME
        ========================= */

        let name = "";


        if (
            profile &&
            profile.full_name
        ) {

            name =
                profile.full_name;

        }


        /* =========================
           FALLBACK TO AUTH
        ========================= */

        if (!name) {

            name =
                user.user_metadata?.full_name ||
                "";

        }


        fullNameInput.value =
            name;


        /* =========================
           AVATAR
        ========================= */

        updateAvatar(name);


        /* =========================
           MOBILE
           
           If your profiles table
           does not yet have mobile,
           this remains blank.
        ========================= */

        try {

            const {
                data:mobileProfile
            } =
            await supabaseClient
            .from("profiles")
            .select("mobile")
            .eq(
                "id",
                userId
            )
            .maybeSingle();


            if (
                mobileProfile &&
                mobileProfile.mobile
            ) {

                mobileInput.value =
                    mobileProfile.mobile;

            }
            else if (
                user.user_metadata?.mobile
            ) {

                mobileInput.value =
                    user.user_metadata.mobile;

            }

        }

        catch(mobileError) {

            console.log(
                "Mobile field not available yet:",
                mobileError
            );

        }


    }

    catch(error) {

        console.error(
            "Profile loading error:",
            error
        );


        showError(
            "Unable to load profile: " +
            (
                error.message ||
                "Unknown error"
            )
        );

    }

}


/* =========================================================
   SAVE PROFILE
========================================================= */

profileForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        hideMessages();


        const name =
            fullNameInput.value
            .trim();


        const mobile =
            mobileInput.value
            .trim();


        /* =========================
           VALIDATION
        ========================= */

        if (!name) {

            showError(
                "Please enter your full name."
            );

            return;

        }


        if (
            mobile &&
            !/^[0-9]{10}$/.test(mobile)
        ) {

            showError(
                "Please enter a valid 10-digit mobile number."
            );

            return;

        }


        saveButton.disabled =
            true;


        saveButton.textContent =
            "Saving...";


        try {

            /* =========================
               GET SESSION
            ========================= */

            const {
                data,
                error
            } =
            await supabaseClient
            .auth
            .getSession();


            if (error) {

                throw error;

            }


            const session =
                data.session;


            if (
                !session ||
                !session.user
            ) {

                window.location.href =
                    "login.html";

                return;

            }


            const user =
                session.user;


            /* =========================
               UPDATE AUTH METADATA
            ========================= */

            const {
                error:authError
            } =
            await supabaseClient
            .auth
            .updateUser({

                data: {

                    full_name:
                        name,

                    mobile:
                        mobile

                }

            });


            if (authError) {

                console.warn(
                    "Auth metadata update warning:",
                    authError
                );

            }


            /* =========================
               UPDATE PROFILE
            ========================= */

            const {
                data:profileData,
                error:profileError
            } =
            await supabaseClient
            .from("profiles")
            .upsert(

                {

                    id:
                        user.id,

                    email:
                        user.email,

                    full_name:
                        name,

                    mobile:
                        mobile,

                    role:
                        "user"

                },

                {

                    onConflict:
                        "id"

                }

            );


            if (profileError) {

                throw profileError;

            }


            /* =========================
               UPDATE AVATAR
            ========================= */

            updateAvatar(name);


            /* =========================
               SUCCESS
            ========================= */

            showSuccess(
                "Profile updated successfully."
            );


        }

        catch(error) {

            console.error(
                "Profile update error:",
                error
            );


            showError(
                "Failed to update profile: " +
                (
                    error.message ||
                    "Unknown error"
                )
            );

        }

        finally {

            saveButton.disabled =
                false;

            saveButton.textContent =
                "💾 Save Changes";

        }

    }
);


/* =========================================================
   UPDATE AVATAR
========================================================= */

function updateAvatar(name) {

    const cleanName =
        String(name || "").trim();


    if (!cleanName) {

        profileAvatar.textContent =
            "A";

        return;

    }


    const firstLetter =
        cleanName
        .charAt(0)
        .toUpperCase();


    profileAvatar.textContent =
        firstLetter;

}


/* =========================================================
   LOGOUT
========================================================= */

logoutButton.addEventListener(
    "click",
    async function() {

        logoutButton.disabled =
            true;

        logoutButton.textContent =
            "Logging out...";


        try {

            await supabaseClient
                .auth
                .signOut();

        }

        catch(error) {

            console.error(
                "Logout error:",
                error
            );

        }


        window.location.href =
            "login.html";

    }
);


/* =========================================================
   AUTH LISTENER
========================================================= */

supabaseClient
.auth
.onAuthStateChange(
    function(event) {

        if (
            event === "SIGNED_OUT"
        ) {

            window.location.href =
                "login.html";

        }

    }
);


/* =========================================================
   SUCCESS MESSAGE
========================================================= */

function showSuccess(message) {

    const box =
        document.getElementById(
            "successMessage"
        );


    box.textContent =
        message;


    box.style.display =
        "block";


    setTimeout(
        function() {

            box.style.display =
                "none";

        },
        4000
    );

}


/* =========================================================
   ERROR MESSAGE
========================================================= */

function showError(message) {

    const box =
        document.getElementById(
            "errorMessage"
        );


    box.textContent =
        message;


    box.style.display =
        "block";

}


/* =========================================================
   HIDE MESSAGES
========================================================= */

function hideMessages() {

    document.getElementById(
        "successMessage"
    ).style.display =
        "none";


    document.getElementById(
        "errorMessage"
    ).style.display =
        "none";

}

</script>


</body>

</html>
