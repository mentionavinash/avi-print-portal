<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="AviPrint Customer Profile">

<title>My Profile | AviPrint</title>

<link rel="stylesheet"
      href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>


<style>

*{
    box-sizing:border-box;
}

body{
    background:#f4f6f9;
}


/* =========================
   PROFILE CONTAINER
========================= */

.profile-container{

    width:94%;
    max-width:850px;

    margin:40px auto;

}


/* =========================
   TOP ACTIONS
========================= */

.profile-actions{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

    gap:12px;

    flex-wrap:wrap;

}


.dashboard-btn{

    display:inline-flex;

    align-items:center;

    gap:7px;

    background:#2563eb;

    color:white;

    text-decoration:none;

    padding:10px 16px;

    border-radius:8px;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

    border:0;

}


.dashboard-btn:hover{

    background:#1d4ed8;

}


.logout-btn{

    background:#ef4444;

    color:white;

    border:0;

    padding:10px 16px;

    border-radius:8px;

    font-weight:700;

    cursor:pointer;

}


.logout-btn:hover{

    background:#dc2626;

}


/* =========================
   TITLE
========================= */

.profile-title{

    margin-bottom:20px;

}


.profile-title h1{

    margin:0 0 6px 0;

    font-size:28px;

}


.profile-title p{

    margin:0;

    color:#6b7280;

    font-size:14px;

}


/* =========================
   MESSAGE
========================= */

.message{

    display:none;

    padding:13px 16px;

    border-radius:8px;

    margin-bottom:18px;

    font-size:14px;

    font-weight:600;

}


.success{

    background:#dcfce7;

    color:#166534;

}


.error{

    background:#fee2e2;

    color:#991b1b;

}


/* =========================
   PROFILE CARD
========================= */

.profile-card{

    background:#ffffff;

    border-radius:15px;

    padding:30px;

    box-shadow:0 4px 20px rgba(0,0,0,.08);

}


/* =========================
   AVATAR
========================= */

.profile-top{

    display:flex;

    align-items:center;

    gap:18px;

    margin-bottom:30px;

    padding-bottom:25px;

    border-bottom:1px solid #e5e7eb;

}


.profile-avatar{

    width:80px;

    height:80px;

    min-width:80px;

    border-radius:50%;

    background:#2563eb;

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:32px;

    font-weight:bold;

}


.profile-user-info h2{

    margin:0 0 5px 0;

    font-size:20px;

}


.profile-user-info p{

    margin:0;

    color:#6b7280;

    font-size:13px;

}


/* =========================
   FORM
========================= */

.form-group{

    margin-bottom:20px;

}


.form-group label{

    display:block;

    margin-bottom:7px;

    font-size:14px;

    font-weight:700;

    color:#111827;

}


.form-group input{

    width:100%;

    height:46px;

    border:1px solid #d1d5db;

    border-radius:8px;

    padding:0 13px;

    font-size:14px;

    background:white;

}


.form-group input:focus{

    outline:none;

    border-color:#2563eb;

    box-shadow:0 0 0 3px rgba(37,99,235,.1);

}


.form-group input:disabled{

    background:#f3f4f6;

    color:#6b7280;

    cursor:not-allowed;

}


/* =========================
   SAVE BUTTON
========================= */

.save-btn{

    width:100%;

    height:48px;

    background:#2563eb;

    color:white;

    border:0;

    border-radius:8px;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

}


.save-btn:hover{

    background:#1d4ed8;

}


.save-btn:disabled{

    opacity:.6;

    cursor:wait;

}


/* =========================
   FOOTER BACK
========================= */

.back-dashboard{

    display:block;

    text-align:center;

    margin-top:20px;

    color:#2563eb;

    text-decoration:none;

    font-weight:700;

    font-size:14px;

}


.back-dashboard:hover{

    text-decoration:underline;

}


/* =========================
   LOADING
========================= */

.loading-box{

    text-align:center;

    padding:30px;

    color:#6b7280;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .profile-container{

        width:92%;

        margin:25px auto;

    }


    .profile-card{

        padding:20px;

    }


    .profile-top{

        align-items:flex-start;

    }


    .profile-title h1{

        font-size:24px;

    }


    .profile-actions{

        flex-direction:column;

        align-items:stretch;

    }


    .dashboard-btn,
    .logout-btn{

        justify-content:center;

        width:100%;

    }

}

</style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

<div class="container nav-container">


<a href="dashboard.html"
   class="logo">

<span class="logo-icon">
A
</span>

<span>
Avi<span>Print</span>
</span>

</a>


<nav class="nav-menu">

<a href="dashboard.html">
Dashboard
</a>

<a href="services.html">
Services
</a>

<a href="orders.html">
My Orders
</a>

<a href="profile.html"
   style="color:#2563eb;">
Profile
</a>

</nav>


</div>

</header>



<!-- =========================
     PROFILE
========================= -->

<main class="profile-container">


<!-- ACTION BUTTONS -->

<div class="profile-actions">


<button
type="button"
class="dashboard-btn"
id="dashboardButton">

← Dashboard

</button>


<button
type="button"
class="logout-btn"
id="logoutButton">

Logout

</button>


</div>



<!-- TITLE -->

<div class="profile-title">

<h1>
👤 My Profile
</h1>

<p>
Manage your AviPrint account information.
</p>

</div>



<!-- SUCCESS -->

<div
id="successMessage"
class="message success">
</div>



<!-- ERROR -->

<div
id="errorMessage"
class="message error">
</div>



<!-- PROFILE CARD -->

<div class="profile-card">


<!-- PROFILE TOP -->

<div class="profile-top">


<div
id="avatar"
class="profile-avatar">

A

</div>


<div class="profile-user-info">

<h2 id="displayName">
Loading...
</h2>

<p id="displayEmail">
Loading account...
</p>

</div>


</div>



<!-- FORM -->

<form id="profileForm">


<!-- FULL NAME -->

<div class="form-group">

<label for="fullName">
Full Name
</label>

<input
type="text"
id="fullName"
placeholder="Enter your full name"
autocomplete="name"
required>

</div>



<!-- MOBILE -->

<div class="form-group">

<label for="mobile">
Mobile Number
</label>

<input
type="tel"
id="mobile"
placeholder="Enter your 10-digit mobile number"
maxlength="10"
inputmode="numeric"
autocomplete="tel">

</div>



<!-- EMAIL -->

<div class="form-group">

<label for="email">
Email Address
</label>

<input
type="email"
id="email"
disabled>

</div>



<!-- ROLE -->

<div class="form-group">

<label for="role">
Account Role
</label>

<input
type="text"
id="role"
disabled>

</div>



<!-- SAVE -->

<button
type="submit"
class="save-btn"
id="saveButton">

Save Changes

</button>


</form>


</div>



<!-- BACK -->

<a
href="dashboard.html"
class="back-dashboard">

← Back to Dashboard

</a>


</main>



<script>


/* =========================================================
   AVIPrint PROFILE
========================================================= */


document.addEventListener(
"DOMContentLoaded",
async function(){


console.log(
"=============================="
);

console.log(
"AVIPrint PROFILE PAGE"
);

console.log(
"=============================="
);



/* =========================================================
   SUPABASE CHECK
========================================================= */

if(
typeof window.supabase === "undefined"
){

showError(
"Supabase library failed to load."
);

return;

}


if(
typeof supabaseClient === "undefined" ||
!supabaseClient
){

showError(
"Supabase configuration not loaded. Check config.js."
);

return;

}



/* =========================================================
   BUTTONS
========================================================= */

const dashboardButton =
document.getElementById(
"dashboardButton"
);


const logoutButton =
document.getElementById(
"logoutButton"
);


const profileForm =
document.getElementById(
"profileForm"
);


const saveButton =
document.getElementById(
"saveButton"
);



/* =========================================================
   DASHBOARD BUTTON
========================================================= */

dashboardButton.addEventListener(
"click",
function(){

console.log(
"Dashboard button clicked"
);


/*
   IMPORTANT:
   Direct navigation.
*/

window.location.assign(
"dashboard.html"
);

}
);



/* =========================================================
   LOGOUT
========================================================= */

logoutButton.addEventListener(
"click",
async function(){

logoutButton.disabled =
true;

logoutButton.textContent =
"Logging out...";


try{

const {
error
} =
await supabaseClient
.auth
.signOut();


if(error){

throw error;

}


window.location.replace(
"login.html"
);

}

catch(error){

console.error(
"Logout error:",
error
);

alert(
"Logout failed. Please try again."
);

logoutButton.disabled =
false;

logoutButton.textContent =
"Logout";

}

}
);



/* =========================================================
   GET SESSION
========================================================= */

let currentUser =
null;

let currentProfile =
null;


try{


const {
data,
error
} =
await supabaseClient
.auth
.getSession();


if(error){

throw error;

}


const session =
data.session;


console.log(
"Current session:",
session
);



/*
   NO SESSION
*/

if(
!session ||
!session.user
){

console.log(
"No active session. Redirecting to login."
);


window.location.replace(
"login.html"
);

return;

}



currentUser =
session.user;



console.log(
"Logged in user:",
currentUser
);



/* =========================================================
   USER EMAIL
========================================================= */

const userEmail =
currentUser.email ||
"";


document.getElementById(
"email"
).value =
userEmail;


document.getElementById(
"displayEmail"
).textContent =
userEmail;



/* =========================================================
   GET AUTH METADATA
========================================================= */

let userName =
currentUser.user_metadata?.full_name ||
"";


let userMobile =
currentUser.user_metadata?.mobile ||
"";



/* =========================================================
   LOAD PROFILE
========================================================= */

const profileResult =
await supabaseClient
.from("profiles")
.select(
"id,email,full_name,mobile,role,created_at"
)
.eq(
"id",
currentUser.id
)
.maybeSingle();


console.log(
"Profile query result:",
profileResult
);



if(
profileResult.error
){

console.warn(
"Could not read profile:",
profileResult.error
);

}


currentProfile =
profileResult.data;



/* =========================================================
   PROFILE PRIORITY
========================================================= */

if(
currentProfile &&
currentProfile.full_name
){

userName =
currentProfile.full_name;

}


if(
currentProfile &&
currentProfile.mobile
){

userMobile =
currentProfile.mobile;

}



/* =========================================================
   FALLBACK NAME
========================================================= */

if(!userName){

userName =
userEmail
.split("@")[0];

}



/* =========================================================
   ROLE
========================================================= */

const userRole =
currentProfile?.role ||
"customer";



/* =========================================================
   DISPLAY
========================================================= */

document.getElementById(
"fullName"
).value =
userName;


document.getElementById(
"mobile"
).value =
userMobile;


document.getElementById(
"role"
).value =
userRole;


document.getElementById(
"displayName"
).textContent =
userName;


document.getElementById(
"displayEmail"
).textContent =
userEmail;


document.getElementById(
"avatar"
).textContent =
userName
.charAt(0)
.toUpperCase();



/* =========================================================
   SAVE PROFILE
========================================================= */

profileForm.addEventListener(
"submit",
async function(event){

event.preventDefault();


hideMessages();



const newName =
document.getElementById(
"fullName"
)
.value
.trim();


const newMobile =
document.getElementById(
"mobile"
)
.value
.trim();



/* VALIDATE NAME */

if(!newName){

showError(
"Please enter your full name."
);

return;

}



/* VALIDATE MOBILE */

if(
newMobile &&
! /^[0-9]{10}$/.test(
newMobile
)
){

showError(
"Please enter a valid 10-digit mobile number."
);

return;

}



/* BUTTON */

saveButton.disabled =
true;

saveButton.textContent =
"Saving...";



try{


/* =====================================================
   STEP 1
   UPDATE AUTH METADATA
===================================================== */

const authUpdate =
await supabaseClient
.auth
.updateUser({

data:{

full_name:
newName,

mobile:
newMobile

}

});


if(
authUpdate.error
){

throw authUpdate.error;

}



/* =====================================================
   STEP 2
   UPDATE EXISTING PROFILE
===================================================== */

let profileSaveError =
null;



if(currentProfile){

console.log(
"Existing profile found. Updating..."
);


const updateResult =
await supabaseClient
.from("profiles")
.update({

email:
userEmail,

full_name:
newName,

mobile:
newMobile

})
.eq(
"id",
currentUser.id
);



if(
updateResult.error
){

profileSaveError =
updateResult.error;

}

}


/* =====================================================
   STEP 3
   IF PROFILE DOES NOT EXIST
   INSERT IT
===================================================== */

else{

console.log(
"No profile found. Creating profile..."
);


const insertResult =
await supabaseClient
.from("profiles")
.insert({

id:
currentUser.id,

email:
userEmail,

full_name:
newName,

mobile:
newMobile,

role:
"customer"

});


if(
insertResult.error
){

profileSaveError =
insertResult.error;

}

}



/* =====================================================
   PROFILE ERROR
===================================================== */

if(
profileSaveError
){

console.error(
"Profile database error:",
profileSaveError
);


/*
   Auth metadata has already been updated.
*/

throw profileSaveError;

}



/* =====================================================
   UPDATE UI
===================================================== */

document.getElementById(
"displayName"
).textContent =
newName;


document.getElementById(
"avatar"
).textContent =
newName
.charAt(0)
.toUpperCase();


currentProfile = {

id:
currentUser.id,

email:
userEmail,

full_name:
newName,

mobile:
newMobile,

role:
currentProfile?.role ||
"customer"

};



/* =====================================================
   SUCCESS
===================================================== */

showSuccess(
"Profile updated successfully."
);


console.log(
"Profile update successful."
);


}

catch(error){

console.error(
"PROFILE UPDATE ERROR:",
error
);


showError(
"Profile update failed: " +
(
error.message ||
"Unknown error"
)
);

}


finally{

saveButton.disabled =
false;

saveButton.textContent =
"Save Changes";

}

}
);


}

catch(error){

console.error(
"PROFILE PAGE ERROR:",
error
);


showError(
"Unable to load profile: " +
(
error.message ||
"Unknown error"
)
);

}



});



/* =========================================================
   SUCCESS MESSAGE
========================================================= */

function showSuccess(
message
){

const box =
document.getElementById(
"successMessage"
);


box.textContent =
message;


box.style.display =
"block";


setTimeout(
function(){

box.style.display =
"none";

},
5000
);

}



/* =========================================================
   ERROR MESSAGE
========================================================= */

function showError(
message
){

const box =
document.getElementById(
"errorMessage"
);


box.textContent =
message;


box.style.display =
"block";

}



/* =========================================================
   HIDE MESSAGES
========================================================= */

function hideMessages(){

document.getElementById(
"successMessage"
).style.display =
"none";


document.getElementById(
"errorMessage"
).style.display =
"none";

}


</script>


</body>

</html>
