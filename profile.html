<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="AviPrint Customer Profile">

<title>My Profile | AviPrint</title>

<link rel="stylesheet"
      href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>


<style>

/* =========================
   PROFILE PAGE
========================= */

.profile-page{
    min-height:calc(100vh - 80px);
    background:#f4f6f9;
    padding:40px 20px;
}

.profile-container{
    width:100%;
    max-width:850px;
    margin:0 auto;
}

.profile-title{
    margin-bottom:25px;
}

.profile-title h1{
    margin:0 0 8px;
    color:#111827;
}

.profile-title p{
    margin:0;
    color:#6b7280;
}


/* =========================
   CARD
========================= */

.profile-card{
    background:#ffffff;
    border-radius:16px;
    padding:30px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}


/* =========================
   AVATAR
========================= */

.profile-top{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:30px;
    padding-bottom:25px;
    border-bottom:1px solid #e5e7eb;
}

.profile-avatar{
    width:82px;
    height:82px;
    min-width:82px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:bold;
}

.profile-user-info h2{
    margin:0 0 5px;
    font-size:20px;
    color:#111827;
}

.profile-user-info p{
    margin:0;
    color:#6b7280;
    font-size:13px;
}


/* =========================
   FORM
========================= */

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    color:#374151;
    font-size:14px;
    font-weight:700;
}

.form-group input{
    width:100%;
    height:46px;
    padding:0 13px;
    border:1px solid #d1d5db;
    border-radius:8px;
    background:#ffffff;
    color:#111827;
    font-size:14px;
    outline:none;
}

.form-group input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

.form-group input:disabled{
    background:#f3f4f6;
    color:#6b7280;
    cursor:not-allowed;
}


/* =========================
   BUTTONS
========================= */

.profile-actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:25px;
}

.save-btn{
    border:0;
    background:#2563eb;
    color:white;
    padding:12px 22px;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
}

.save-btn:hover{
    background:#1d4ed8;
}

.save-btn:disabled{
    opacity:.6;
    cursor:wait;
}

.dashboard-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:12px 20px;
    border-radius:8px;
    background:#f3f4f6;
    color:#374151;
    text-decoration:none;
    font-weight:700;
}

.dashboard-btn:hover{
    background:#e5e7eb;
}


/* =========================
   MESSAGES
========================= */

.message{
    display:none;
    padding:13px 15px;
    border-radius:8px;
    margin-bottom:20px;
    font-size:14px;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}


/* =========================
   LOADING
========================= */

.profile-loading{
    text-align:center;
    padding:60px 20px;
    color:#6b7280;
}


/* =========================
   NAVBAR
========================= */

.profile-nav{
    display:flex;
    align-items:center;
    gap:25px;
    flex-wrap:wrap;
}

.profile-nav a{
    text-decoration:none;
    color:#374151;
    font-weight:600;
    font-size:14px;
}

.profile-nav a:hover{
    color:#2563eb;
}

.profile-nav a.active{
    color:#2563eb;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .profile-page{
        padding:25px 15px;
    }

    .profile-card{
        padding:22px;
    }

    .profile-top{
        align-items:flex-start;
    }

    .profile-avatar{
        width:65px;
        height:65px;
        min-width:65px;
        font-size:25px;
    }

    .profile-user-info h2{
        font-size:17px;
    }

    .profile-nav{
        gap:12px;
    }

}

</style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

<div class="container nav-container">


<a href="dashboard.html"
   class="logo">

<span class="logo-icon">
A
</span>

<span>
Avi<span>Print</span>
</span>

</a>


<nav class="profile-nav">

<a href="dashboard.html">
Dashboard
</a>

<a href="services.html">
Services
</a>

<a href="orders.html">
My Orders
</a>

<a href="profile.html"
   class="active">
Profile
</a>

</nav>


</div>

</header>



<!-- =========================
     PROFILE PAGE
========================= -->

<main class="profile-page">

<div class="profile-container">


<div class="profile-title">

<h1>
👤 My Profile
</h1>

<p>
Manage your AviPrint account information.
</p>

</div>



<div id="successMessage"
     class="message success">
</div>


<div id="errorMessage"
     class="message error">
</div>



<!-- =========================
     PROFILE CARD
========================= -->

<div class="profile-card"
     id="profileCard"
     style="display:none;">


<div class="profile-top">


<div id="avatar"
     class="profile-avatar">

A

</div>


<div class="profile-user-info">

<h2 id="profileName">
Customer
</h2>

<p id="profileEmailText">
Loading...
</p>

</div>


</div>



<form id="profileForm">


<!-- FULL NAME -->

<div class="form-group">

<label for="fullName">
Full Name
</label>

<input
type="text"
id="fullName"
placeholder="Enter your full name"
autocomplete="name"
required>

</div>



<!-- MOBILE -->

<div class="form-group">

<label for="mobile">
Mobile Number
</label>

<input
type="tel"
id="mobile"
placeholder="Enter 10-digit mobile number"
maxlength="10"
inputmode="numeric"
autocomplete="tel">

</div>



<!-- EMAIL -->

<div class="form-group">

<label for="email">
Email Address
</label>

<input
type="email"
id="email"
disabled>

</div>



<!-- ROLE -->

<div class="form-group">

<label for="role">
Account Role
</label>

<input
type="text"
id="role"
disabled>

</div>



<!-- BUTTONS -->

<div class="profile-actions">

<button
type="submit"
id="saveButton"
class="save-btn">

Save Changes

</button>


<a
href="dashboard.html"
class="dashboard-btn">

← Back to Dashboard

</a>

</div>


</form>


</div>



<!-- LOADING -->

<div
id="loadingBox"
class="profile-loading">

Loading your profile...

</div>


</div>

</main>



<!-- =========================
     PROFILE SCRIPT
========================= -->

<script>

document.addEventListener(
"DOMContentLoaded",
async function(){

    console.log(
        "AviPrint Profile Page Loaded"
    );


    /* =====================================
       CHECK SUPABASE
    ===================================== */

    if(
        typeof window.supabase === "undefined"
    ){

        showError(
            "Supabase library could not be loaded."
        );

        return;

    }


    if(
        typeof supabaseClient === "undefined" ||
        !supabaseClient
    ){

        showError(
            "Supabase configuration could not be loaded. Check config.js."
        );

        return;

    }



    /* =====================================
       ELEMENTS
    ===================================== */

    const profileCard =
    document.getElementById(
        "profileCard"
    );


    const loadingBox =
    document.getElementById(
        "loadingBox"
    );


    const profileForm =
    document.getElementById(
        "profileForm"
    );


    const fullNameInput =
    document.getElementById(
        "fullName"
    );


    const mobileInput =
    document.getElementById(
        "mobile"
    );


    const emailInput =
    document.getElementById(
        "email"
    );


    const roleInput =
    document.getElementById(
        "role"
    );


    const avatar =
    document.getElementById(
        "avatar"
    );


    const profileName =
    document.getElementById(
        "profileName"
    );


    const profileEmailText =
    document.getElementById(
        "profileEmailText"
    );


    const saveButton =
    document.getElementById(
        "saveButton"
    );



    /* =====================================
       LOAD PROFILE
    ===================================== */

    let currentUser = null;

    let currentProfile = null;


    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .auth
        .getSession();


        if(error){

            throw error;

        }


        const session =
        data.session;


        /* =================================
           NOT LOGGED IN
        ================================= */

        if(
            !session ||
            !session.user
        ){

            window.location.href =
            "login.html";

            return;

        }


        currentUser =
        session.user;


        console.log(
            "Current user:",
            currentUser.id
        );


        const userId =
        currentUser.id;


        const userEmail =
        currentUser.email || "";



        /* =================================
           AUTH METADATA
        ================================= */

        let authName =
        currentUser.user_metadata &&
        currentUser.user_metadata.full_name
        ? currentUser.user_metadata.full_name
        : "";


        let authMobile =
        currentUser.user_metadata &&
        currentUser.user_metadata.mobile
        ? currentUser.user_metadata.mobile
        : "";



        /* =================================
           GET PROFILE
        ================================= */

        const {
            data:profileData,
            error:profileError
        } =
        await supabaseClient
        .from("profiles")
        .select(
            "id,email,full_name,mobile,role,created_at"
        )
        .eq(
            "id",
            userId
        )
        .maybeSingle();


        console.log(
            "Profile:",
            profileData,
            profileError
        );


        /*
         * SELECT error is not fatal here.
         * Auth metadata can still be used.
         */

        if(
            profileError
        ){

            console.warn(
                "Profile SELECT warning:",
                profileError
            );

        }


        currentProfile =
        profileData || null;



        /* =================================
           NAME PRIORITY
        ================================= */

        let finalName = "";


        if(
            currentProfile &&
            currentProfile.full_name
        ){

            finalName =
            currentProfile.full_name;

        }

        else if(
            authName
        ){

            finalName =
            authName;

        }

        else{

            finalName =
            userEmail
            .split("@")[0];

        }



        /* =================================
           MOBILE PRIORITY
        ================================= */

        let finalMobile = "";


        if(
            currentProfile &&
            currentProfile.mobile
        ){

            finalMobile =
            currentProfile.mobile;

        }

        else if(
            authMobile
        ){

            finalMobile =
            authMobile;

        }



        /* =================================
           ROLE
        ================================= */

        const finalRole =
        currentProfile &&
        currentProfile.role
        ? currentProfile.role
        : "customer";



        /* =================================
           DISPLAY
        ================================= */

        fullNameInput.value =
        finalName;


        mobileInput.value =
        finalMobile;


        emailInput.value =
        userEmail;


        roleInput.value =
        finalRole;


        profileName.textContent =
        finalName;


        profileEmailText.textContent =
        userEmail;


        avatar.textContent =
        finalName
        .charAt(0)
        .toUpperCase();



        /* =================================
           SHOW PROFILE
        ================================= */

        loadingBox.style.display =
        "none";


        profileCard.style.display =
        "block";



    }

    catch(error){

        console.error(
            "Profile loading error:",
            error
        );


        loadingBox.style.display =
        "none";


        showError(
            "Unable to load profile: " +
            (
                error.message ||
                "Unknown error"
            )
        );


        return;

    }



    /* =====================================
       SAVE PROFILE
    ===================================== */

    profileForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        if(!currentUser){

            showError(
                "Login session not found."
            );

            return;

        }


        const newName =
        fullNameInput.value
        .trim();


        const newMobile =
        mobileInput.value
        .trim();


        const userEmail =
        currentUser.email || "";


        if(!newName){

            showError(
                "Please enter your full name."
            );

            return;

        }


        if(
            newMobile &&
            !/^[0-9]{10}$/.test(
                newMobile
            )
        ){

            showError(
                "Please enter a valid 10-digit mobile number."
            );

            return;

        }



        saveButton.disabled =
        true;


        saveButton.textContent =
        "Saving...";


        hideMessages();



        try{

            /* =================================
               UPDATE AUTH USER METADATA
            ================================= */

            const {
                error:authError
            } =
            await supabaseClient
            .auth
            .updateUser({

                data:{

                    full_name:
                    newName,

                    mobile:
                    newMobile

                }

            });


            if(authError){

                throw authError;

            }



            /* =================================
               SAVE PROFILE
            ================================= */

            const profilePayload = {

                id:
                currentUser.id,

                email:
                userEmail,

                full_name:
                newName,

                mobile:
                newMobile,

                role:
                currentProfile &&
                currentProfile.role
                ? currentProfile.role
                : "customer"

            };


            const {
                data:savedProfile,
                error:saveError
            } =
            await supabaseClient
            .from("profiles")
            .upsert(
                profilePayload,
                {
                    onConflict:"id"
                }
            )
            .select()
            .single();


            if(saveError){

                throw saveError;

            }


            console.log(
                "Profile saved:",
                savedProfile
            );


            currentProfile =
            savedProfile;



            /* =================================
               UPDATE SCREEN
            ================================= */

            profileName.textContent =
            newName;


            profileEmailText.textContent =
            userEmail;


            avatar.textContent =
            newName
            .charAt(0)
            .toUpperCase();


            showSuccess(
                "Profile updated successfully."
            );



        }

        catch(error){

            console.error(
                "PROFILE SAVE ERROR:",
                error
            );


            showError(
                "Profile update failed: " +
                (
                    error.message ||
                    "Unable to save profile."
                )
            );

        }


        finally{

            saveButton.disabled =
            false;


            saveButton.textContent =
            "Save Changes";

        }

    });


});



/* =====================================
   SUCCESS MESSAGE
===================================== */

function showSuccess(message){

    const box =
    document.getElementById(
        "successMessage"
    );


    const errorBox =
    document.getElementById(
        "errorMessage"
    );


    errorBox.style.display =
    "none";


    box.textContent =
    message;


    box.style.display =
    "block";


    setTimeout(
        function(){

            box.style.display =
            "none";

        },
        5000
    );

}



/* =====================================
   ERROR MESSAGE
===================================== */

function showError(message){

    const box =
    document.getElementById(
        "errorMessage"
    );


    const successBox =
    document.getElementById(
        "successMessage"
    );


    successBox.style.display =
    "none";


    box.textContent =
    message;


    box.style.display =
    "block";

}



/* =====================================
   HIDE MESSAGES
===================================== */

function hideMessages(){

    document.getElementById(
        "successMessage"
    ).style.display =
    "none";


    document.getElementById(
        "errorMessage"
    ).style.display =
    "none";

}

</script>


</body>

</html>
