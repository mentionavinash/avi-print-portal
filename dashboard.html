<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Profile | AviPrint Portal</title>

<link rel="stylesheet"
      href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<style>

.profile-page{
    max-width:900px;
    margin:40px auto;
    padding:0 20px;
}

.profile-header{
    margin-bottom:25px;
}

.profile-header h1{
    font-size:28px;
    margin-bottom:8px;
    color:#111827;
}

.profile-header p{
    color:#6b7280;
}

.profile-card{
    background:#ffffff;
    border-radius:16px;
    padding:30px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
    margin-bottom:25px;
}

.profile-top{
    display:flex;
    align-items:center;
    gap:18px;
    padding-bottom:25px;
    border-bottom:1px solid #e5e7eb;
    margin-bottom:25px;
}

.profile-avatar{
    width:75px;
    height:75px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:bold;
}

.profile-top h2{
    margin:0 0 5px;
    color:#111827;
}

.profile-top p{
    margin:0;
    color:#6b7280;
    font-size:14px;
}

.profile-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
    color:#374151;
}

.form-group input{
    width:100%;
    height:46px;
    border:1px solid #d1d5db;
    border-radius:8px;
    padding:0 13px;
    font-size:14px;
    outline:none;
}

.form-group input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

.form-group input:disabled{
    background:#f3f4f6;
    color:#6b7280;
}

.info-box{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:15px;
    margin-top:5px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:10px 0;
    border-bottom:1px solid #e5e7eb;
}

.info-row:last-child{
    border-bottom:none;
}

.info-label{
    color:#6b7280;
    font-size:13px;
}

.info-value{
    font-weight:600;
    color:#111827;
    text-align:right;
}

.save-btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 22px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    font-size:14px;
}

.save-btn:hover{
    background:#1d4ed8;
}

.save-btn:disabled{
    opacity:.6;
    cursor:wait;
}

.back-btn{
    display:inline-block;
    margin-top:5px;
    color:#2563eb;
    text-decoration:none;
    font-weight:600;
    font-size:14px;
}

.message{
    display:none;
    padding:13px 15px;
    border-radius:8px;
    margin-bottom:20px;
    font-size:14px;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

@media(max-width:650px){

    .profile-grid{
        grid-template-columns:1fr;
    }

    .profile-card{
        padding:20px;
    }

    .profile-top{
        align-items:flex-start;
    }

    .profile-avatar{
        width:60px;
        height:60px;
        font-size:24px;
    }

}

</style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

<div class="container nav-container">

<a href="index.html"
   class="logo">

<span class="logo-icon">
A
</span>

<span>
Avi<span>Print</span>
</span>

</a>


<nav class="nav-menu">

<a href="dashboard.html">
Dashboard
</a>

<a href="services.html">
Services
</a>

<a href="orders.html">
My Orders
</a>

<a href="profile.html"
   style="color:#2563eb;">
Profile
</a>

</nav>


<div class="nav-buttons">

<button
type="button"
id="logoutButton"
class="login-btn"
style="
border:none;
cursor:pointer;
background:transparent;
">

Logout

</button>

</div>

</div>

</header>



<!-- =========================
     PROFILE
========================= -->

<main class="profile-page">


<div class="profile-header">

<h1>
👤 My Profile
</h1>

<p>
Manage your AviPrint account information.
</p>

</div>


<div id="successMessage"
     class="message success">
</div>


<div id="errorMessage"
     class="message error">
</div>



<!-- PROFILE CARD -->

<div class="profile-card">


<div class="profile-top">

<div id="profileAvatar"
     class="profile-avatar">

A

</div>


<div>

<h2 id="profileName">
Loading...
</h2>

<p id="profileEmail">
Loading...
</p>

</div>

</div>



<!-- EDIT FORM -->

<form id="profileForm">


<div class="profile-grid">


<div class="form-group">

<label for="fullName">
Full Name
</label>

<input
type="text"
id="fullName"
placeholder="Enter your full name"
required>

</div>



<div class="form-group">

<label for="mobile">
Mobile Number
</label>

<input
type="tel"
id="mobile"
placeholder="Enter 10-digit mobile number"
maxlength="10"
inputmode="numeric">

</div>



<div class="form-group">

<label for="email">
Email Address
</label>

<input
type="email"
id="email"
disabled>

</div>



<div class="form-group">

<label for="role">
Account Role
</label>

<input
type="text"
id="role"
disabled>

</div>

</div>



<button
type="submit"
id="saveButton"
class="save-btn">

Save Changes

</button>


</form>

</div>



<!-- ACCOUNT INFORMATION -->

<div class="profile-card">

<h2 style="margin-bottom:18px;">
Account Information
</h2>


<div class="info-box">


<div class="info-row">

<span class="info-label">
Email
</span>

<span
id="infoEmail"
class="info-value">

-

</span>

</div>


<div class="info-row">

<span class="info-label">
Mobile
</span>

<span
id="infoMobile"
class="info-value">

-

</span>

</div>


<div class="info-row">

<span class="info-label">
Role
</span>

<span
id="infoRole"
class="info-value">

Customer

</span>

</div>


<div class="info-row">

<span class="info-label">
Account Created
</span>

<span
id="infoCreated"
class="info-value">

-

</span>

</div>


</div>

</div>


<a href="dashboard.html"
   class="back-btn">

← Back to Dashboard

</a>


</main>



<script>

document.addEventListener(
"DOMContentLoaded",
async function(){

    /* =========================
       SUPABASE CHECK
    ========================= */

    if(
        typeof window.supabase === "undefined" ||
        typeof supabaseClient === "undefined" ||
        !supabaseClient
    ){

        window.location.href =
        "login.html";

        return;

    }


    const fullName =
    document.getElementById(
        "fullName"
    );

    const mobile =
    document.getElementById(
        "mobile"
    );

    const email =
    document.getElementById(
        "email"
    );

    const role =
    document.getElementById(
        "role"
    );

    const profileName =
    document.getElementById(
        "profileName"
    );

    const profileEmail =
    document.getElementById(
        "profileEmail"
    );

    const profileAvatar =
    document.getElementById(
        "profileAvatar"
    );

    const infoEmail =
    document.getElementById(
        "infoEmail"
    );

    const infoMobile =
    document.getElementById(
        "infoMobile"
    );

    const infoRole =
    document.getElementById(
        "infoRole"
    );

    const infoCreated =
    document.getElementById(
        "infoCreated"
    );

    const profileForm =
    document.getElementById(
        "profileForm"
    );

    const saveButton =
    document.getElementById(
        "saveButton"
    );

    const logoutButton =
    document.getElementById(
        "logoutButton"
    );


    /* =========================
       SESSION
    ========================= */

    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .auth
        .getSession();


        if(error){

            throw error;

        }


        const session =
        data.session;


        if(
            !session ||
            !session.user
        ){

            window.location.href =
            "login.html";

            return;

        }


        const user =
        session.user;


        const userId =
        user.id;


        const userEmail =
        user.email || "";


        /* =========================
           GET PROFILE
        ========================= */

        let profileData = null;


        const {
            data:profile,
            error:profileError
        } =
        await supabaseClient
        .from("profiles")
        .select(
            `
            id,
            email,
            full_name,
            mobile,
            role,
            created_at
            `
        )
        .eq(
            "id",
            userId
        )
        .maybeSingle();


        if(profileError){

            console.error(
                "Profile fetch error:",
                profileError
            );

        }
        else{

            profileData =
            profile;

        }


        /* =========================
           NAME
        ========================= */

        const metadataName =
        user.user_metadata &&
        user.user_metadata.full_name
        ?
        user.user_metadata.full_name
        :
        "";


        const finalName =
        profileData &&
        profileData.full_name
        ?
        profileData.full_name
        :
        metadataName
        ?
        metadataName
        :
        userEmail.split("@")[0];


        const finalMobile =
        profileData &&
        profileData.mobile
        ?
        profileData.mobile
        :
        user.user_metadata &&
        user.user_metadata.mobile
        ?
        user.user_metadata.mobile
        :
        "";


        const finalRole =
        profileData &&
        profileData.role
        ?
        profileData.role
        :
        "customer";


        const createdAt =
        profileData &&
        profileData.created_at
        ?
        profileData.created_at
        :
        user.created_at;



        /* =========================
           DISPLAY
        ========================= */

        fullName.value =
        finalName;


        mobile.value =
        finalMobile;


        email.value =
        userEmail;


        role.value =
        finalRole;


        profileName.textContent =
        finalName;


        profileEmail.textContent =
        userEmail;


        profileAvatar.textContent =
        finalName
        .charAt(0)
        .toUpperCase();


        infoEmail.textContent =
        userEmail;


        infoMobile.textContent =
        finalMobile ||
        "Not added";


        infoRole.textContent =
        capitalize(finalRole);


        infoCreated.textContent =
        formatDate(createdAt);



        /* =========================
           SAVE PROFILE
        ========================= */

        profileForm.addEventListener(
        "submit",
        async function(event){

            event.preventDefault();


            const newName =
            fullName.value.trim();


            const newMobile =
            mobile.value.trim();


            if(!newName){

                showError(
                    "Please enter your full name."
                );

                return;

            }


            if(
                newMobile &&
                !/^[0-9]{10}$/.test(
                    newMobile
                )
            ){

                showError(
                    "Please enter a valid 10-digit mobile number."
                );

                return;

            }


            saveButton.disabled =
            true;

            saveButton.textContent =
            "Saving...";


            hideMessages();


            try{

                /* =========================
                   UPDATE PROFILES
                ========================= */

                const {
                    error:updateError
                } =
                await supabaseClient
                .from("profiles")
                .upsert({

                    id:userId,

                    email:userEmail,

                    full_name:newName,

                    mobile:newMobile,

                    role:finalRole

                });


                if(updateError){

                    throw updateError;

                }


                /* =========================
                   UPDATE AUTH METADATA
                ========================= */

                const {
                    error:authError
                } =
                await supabaseClient
                .auth
                .updateUser({

                    data:{

                        full_name:
                        newName,

                        mobile:
                        newMobile

                    }

                });


                if(authError){

                    console.warn(
                        "Auth metadata update warning:",
                        authError
                    );

                }


                /* =========================
                   UPDATE SCREEN
                ========================= */

                profileName.textContent =
                newName;


                profileAvatar.textContent =
                newName
                .charAt(0)
                .toUpperCase();


                infoMobile.textContent =
                newMobile ||
                "Not added";


                showSuccess(
                    "Profile updated successfully."
                );

            }

            catch(updateError){

                console.error(
                    "Profile update error:",
                    updateError
                );


                showError(
                    "Profile update failed: " +
                    (
                        updateError.message ||
                        updateError
                    )
                );

            }


            finally{

                saveButton.disabled =
                false;

                saveButton.textContent =
                "Save Changes";

            }

        });



        /* =========================
           LOGOUT
        ========================= */

        logoutButton.addEventListener(
        "click",
        async function(){

            await supabaseClient
            .auth
            .signOut();

            window.location.href =
            "login.html";

        });


    }

    catch(error){

        console.error(
            "Profile page error:",
            error
        );


        window.location.href =
        "login.html";

    }



    /* =========================
       FUNCTIONS
    ========================= */

    function capitalize(value){

        const text =
        String(value || "");

        return(
            text.charAt(0).toUpperCase() +
            text.slice(1).toLowerCase()
        );

    }


    function formatDate(value){

        if(!value){

            return "-";

        }


        const date =
        new Date(value);


        if(
            Number.isNaN(
                date.getTime()
            )
        ){

            return "-";

        }


        return date.toLocaleString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }


    function showSuccess(message){

        const box =
        document.getElementById(
            "successMessage"
        );

        box.textContent =
        message;

        box.style.display =
        "block";

    }


    function showError(message){

        const box =
        document.getElementById(
            "errorMessage"
        );

        box.textContent =
        message;

        box.style.display =
        "block";

    }


    function hideMessages(){

        document.getElementById(
            "successMessage"
        ).style.display =
        "none";


        document.getElementById(
            "errorMessage"
        ).style.display =
        "none";

    }

});

</script>

</body>

</html>
