<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AviPrint Admin Panel</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #111827;
        }

        .topbar {
            background: #111827;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .topbar h1 {
            font-size: 22px;
        }

        .admin-info {
            margin-top: 6px;
            font-size: 13px;
            opacity: .85;
        }

        .logout-btn,
        .refresh-btn {
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn {
            background: #ef4444;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .refresh-btn {
            background: #2563eb;
        }

        .refresh-btn:hover {
            background: #1d4ed8;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 25px auto;
        }

        .message {
            display: none;
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.07);
        }

        .card h3 {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
        }

        .blue { color: #2563eb; }
        .orange { color: #d97706; }
        .purple { color: #7c3aed; }
        .green { color: #16a34a; }

        .section {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 2px 10px rgba(0,0,0,.07);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .section-header h2 {
            font-size: 20px;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 1200px;
            border-collapse: collapse;
        }

        th {
            background: #f3f4f6;
            text-align: left;
            padding: 13px;
            font-size: 13px;
            white-space: nowrap;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 13px;
            vertical-align: middle;
        }

        tr:hover {
            background: #fafafa;
        }

        .order-id {
            color: #2563eb;
            font-weight: bold;
        }

        .customer-name {
            font-weight: bold;
        }

        .email {
            color: #374151;
            word-break: break-word;
        }

        .service {
            font-weight: 600;
        }

        .quantity {
            text-align: center;
        }

        .date {
            color: #6b7280;
            white-space: nowrap;
        }

        select {
            padding: 8px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            min-width: 130px;
        }

        select:disabled {
            opacity: .6;
            cursor: wait;
        }

        .status-pending {
            color: #c2410c;
            background: #fff7ed;
        }

        .status-processing {
            color: #6d28d9;
            background: #f5f3ff;
        }

        .status-printing {
            color: #1d4ed8;
            background: #eff6ff;
        }

        .status-ready {
            color: #0e7490;
            background: #ecfeff;
        }

        .status-completed {
            color: #15803d;
            background: #f0fdf4;
        }

        .status-cancelled {
            color: #b91c1c;
            background: #fef2f2;
        }

        .email-status {
            font-size: 11px;
            margin-top: 5px;
        }

        .email-sending {
            color: #d97706;
        }

        .email-success {
            color: #15803d;
        }

        .email-failed {
            color: #dc2626;
        }

        .loading,
        .empty {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        @media (max-width: 900px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .container {
                width: 94%;
            }

            .section {
                padding: 15px;
            }

        }

    </style>

</head>


<body>


<header class="topbar">

    <div>

        <h1>🖨️ AviPrint Admin Panel</h1>

        <div
            class="admin-info"
            id="adminInfo">
            Checking admin session...
        </div>

    </div>

    <button
        class="logout-btn"
        onclick="logout()">
        Logout
    </button>

</header>


<main class="container">


    <div
        id="successMessage"
        class="message success">
    </div>

    <div
        id="errorMessage"
        class="message error">
    </div>


    <div class="cards">

        <div class="card">

            <h3>Total Orders</h3>

            <div
                id="totalOrders"
                class="number blue">
                0
            </div>

        </div>


        <div class="card">

            <h3>Pending Orders</h3>

            <div
                id="pendingOrders"
                class="number orange">
                0
            </div>

        </div>


        <div class="card">

            <h3>Processing / Printing</h3>

            <div
                id="processingOrders"
                class="number purple">
                0
            </div>

        </div>


        <div class="card">

            <h3>Completed Orders</h3>

            <div
                id="completedOrders"
                class="number green">
                0
            </div>

        </div>

    </div>


    <section class="section">

        <div class="section-header">

            <h2>📦 Customer Orders</h2>

            <button
                class="refresh-btn"
                onclick="loadOrders()">
                🔄 Refresh
            </button>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Email</th>
                        <th>Service</th>
                        <th>Details</th>
                        <th>Quantity</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>File</th>
                        <th>Date</th>

                    </tr>

                </thead>


                <tbody id="ordersTableBody">

                    <tr>

                        <td
                            colspan="10"
                            class="loading">
                            Loading orders...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>


<script>


/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://pmqmewceqnxsvlhceeef.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_mWPszaFzSHbPp-OHlPGWjw_JdrMU6oQ";


/* =========================================================
   ADMIN
========================================================= */

const ADMIN_EMAIL =
    "aviinformatics@gmail.com";


/* =========================================================
   EDGE FUNCTION
========================================================= */

const EDGE_FUNCTION_NAME =
    "smart-service";


const EDGE_FUNCTION_URL =
    SUPABASE_URL +
    "/functions/v1/" +
    EDGE_FUNCTION_NAME;


/* =========================================================
   SUPABASE CLIENT
========================================================= */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        await checkAdmin();

    }
);


/* =========================================================
   CHECK ADMIN
========================================================= */

async function checkAdmin() {

    try {

        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getSession();


        if (error) {
            throw error;
        }


        const session =
            data.session;


        if (
            !session ||
            !session.user
        ) {

            window.location.href =
                "login.html";

            return;

        }


        const email =
            session.user.email || "";


        if (
            email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
        ) {

            alert(
                "Access denied. Admin account required."
            );

            await supabaseClient
                .auth
                .signOut();

            window.location.href =
                "login.html";

            return;

        }


        document.getElementById(
            "adminInfo"
        ).textContent =
            "Logged in as Admin: " + email;


        await loadOrders();

    }

    catch (error) {

        console.error(
            "Admin check error:",
            error
        );

        showError(
            error.message ||
            "Unable to verify admin."
        );

    }

}


/* =========================================================
   LOAD ORDERS
========================================================= */

async function loadOrders() {

    const tbody =
        document.getElementById(
            "ordersTableBody"
        );


    tbody.innerHTML = `
        <tr>
            <td colspan="10" class="loading">
                Loading orders...
            </td>
        </tr>
    `;


    hideMessages();


    try {

        const {
            data,
            error
        } =
        await supabaseClient
            .from("orders")
            .select(`
                id,
                order_number,
                user_id,
                service_name,
                service_details,
                order_date,
                status,
                amount,
                file_path,
                file_name,
                created_at,
                customer_email
            `)
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (error) {
            throw error;
        }


        const orders =
            data || [];


        updateCounters(orders);


        if (!orders.length) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="10" class="empty">
                        No orders found.
                    </td>
                </tr>
            `;

            return;

        }


        tbody.innerHTML = "";


        orders.forEach(
            function (order) {

                tbody.appendChild(
                    createOrderRow(order)
                );

            }
        );

    }

    catch (error) {

        console.error(
            "Load orders error:",
            error
        );


        tbody.innerHTML = `
            <tr>
                <td colspan="10" class="empty">
                    Failed to load orders.
                </td>
            </tr>
        `;


        showError(
            "Failed to load orders: " +
            (
                error.message ||
                error
            )
        );

    }

}


/* =========================================================
   CREATE ROW
========================================================= */

function createOrderRow(order) {

    const tr =
        document.createElement("tr");


    const orderId =
        order.id || "";


    const orderNumber =
        order.order_number ||
        orderId;


    const customerName =
        order.customer_name ||
        order.full_name ||
        order.name ||
        "Customer";


    const email =
        order.customer_email ||
        "-";


    const service =
        order.service_name ||
        "-";


    const details =
        order.service_details ||
        "-";


    const amount =
        order.amount !== null &&
        order.amount !== undefined
        ? "₹" + Number(order.amount).toFixed(2)
        : "-";


    const status =
        String(
            order.status ||
            "pending"
        ).toLowerCase();


    const createdAt =
        order.created_at ||
        order.order_date ||
        "";


    const fileName =
        order.file_name ||
        "";


    tr.dataset.orderId =
        orderId;

    tr.dataset.orderNumber =
        orderNumber;

    tr.dataset.customerName =
        customerName;

    tr.dataset.email =
        email;

    tr.dataset.service =
        service;

    tr.dataset.details =
        details;

    tr.dataset.amount =
        amount;

    tr.dataset.fileName =
        fileName;

    tr.dataset.filePath =
        order.file_path || "";


    tr.innerHTML = `

        <td>
            <span class="order-id">
                ${escapeHTML(orderNumber)}
            </span>
        </td>

        <td>
            <span class="customer-name">
                ${escapeHTML(customerName)}
            </span>
        </td>

        <td>

            <span class="email">
                ${escapeHTML(email)}
            </span>

            <div
                id="email-status-${escapeHTML(orderId)}"
                class="email-status">
            </div>

        </td>

        <td>
            <span class="service">
                ${escapeHTML(service)}
            </span>
        </td>

        <td>
            ${escapeHTML(details)}
        </td>

        <td class="quantity">
            1
        </td>

        <td>
            ${escapeHTML(amount)}
        </td>

        <td>

            <select
                class="${getStatusClass(status)}"
                data-old-status="${escapeHTML(status)}"
                onchange="changeOrderStatus(
                    '${escapeJS(orderId)}',
                    this.value,
                    this
                )">

                <option value="pending"
                    ${status === "pending" ? "selected" : ""}>
                    Pending
                </option>

                <option value="processing"
                    ${status === "processing" ? "selected" : ""}>
                    Processing
                </option>

                <option value="printing"
                    ${status === "printing" ? "selected" : ""}>
                    Printing
                </option>

                <option value="ready"
                    ${status === "ready" ? "selected" : ""}>
                    Ready
                </option>

                <option value="completed"
                    ${status === "completed" ? "selected" : ""}>
                    Completed
                </option>

                <option value="cancelled"
                    ${status === "cancelled" ? "selected" : ""}>
                    Cancelled
                </option>

            </select>

        </td>

        <td>

            ${
                fileName
                ?
                `
                <button
                    type="button"
                    onclick="downloadFile(
                        '${escapeJS(order.file_path || "")}',
                        '${escapeJS(fileName)}'
                    )"
                    style="
                        border:none;
                        background:#2563eb;
                        color:white;
                        padding:7px 10px;
                        border-radius:6px;
                        cursor:pointer;
                    ">
                    📥 Download
                </button>
                `
                :
                "No file"
            }

        </td>

        <td class="date">
            ${escapeHTML(formatDate(createdAt))}
        </td>

    `;


    return tr;

}


/* =========================================================
   CHANGE STATUS
========================================================= */

async function changeOrderStatus(
    orderId,
    newStatus,
    selectElement
) {

    const oldStatus =
        selectElement.dataset.oldStatus ||
        "pending";


    const row =
        selectElement.closest("tr");


    if (!row) {
        return;
    }


    const orderNumber =
        row.dataset.orderNumber ||
        orderId;


    const customerName =
        row.dataset.customerName ||
        "Customer";


    const customerEmail =
        row.dataset.email ||
        "";


    const service =
        row.dataset.service ||
        "-";


    const details =
        row.dataset.details ||
        "-";


    const amount =
        row.dataset.amount ||
        "₹0.00";


    const fileName =
        row.dataset.fileName ||
        "-";


    selectElement.disabled =
        true;


    hideMessages();


    try {


        /* =========================================
           UPDATE DATABASE
        ========================================= */

        const {
            error
        } =
        await supabaseClient
            .from("orders")
            .update({
                status: newStatus
            })
            .eq(
                "id",
                orderId
            );


        if (error) {
            throw error;
        }


        selectElement.dataset.oldStatus =
            newStatus;


        selectElement.className =
            getStatusClass(newStatus);


        showSuccess(
            "Order " +
            orderNumber +
            " updated to " +
            newStatus +
            "."
        );


        /* =========================================
           SEND EMAIL
        ========================================= */

        if (
            customerEmail &&
            customerEmail !== "-"
        ) {

            setEmailStatus(
                orderId,
                "Sending email...",
                "email-sending"
            );


            try {

                await sendOrderEmail({

                    email:
                        customerEmail,

                    orderNumber:
                        orderNumber,

                    service:
                        service,

                    details:
                        details,

                    amount:
                        amount,

                    status:
                        capitalizeStatus(
                            newStatus
                        ),

                    fileName:
                        fileName

                });


                setEmailStatus(
                    orderId,
                    "✓ Email sent",
                    "email-success"
                );


            }

            catch (emailError) {

                console.error(
                    "EMAIL ERROR:",
                    emailError
                );


                setEmailStatus(
                    orderId,
                    "✗ Email failed",
                    "email-failed"
                );


                showError(
                    "Order updated, but customer email failed: " +
                    (
                        emailError.message ||
                        "Email request failed."
                    )
                );

            }

        }

        else {

            setEmailStatus(
                orderId,
                "No email available",
                "email-failed"
            );

        }


        await loadCounters();

    }

    catch (error) {

        console.error(
            "Status update error:",
            error
        );


        selectElement.value =
            oldStatus;


        selectElement.className =
            getStatusClass(oldStatus);


        showError(
            "Failed to update order status: " +
            (
                error.message ||
                error
            )
        );

    }

    finally {

        selectElement.disabled =
            false;

    }

}


/* =========================================================
   SEND EMAIL USING DIRECT FETCH
========================================================= */

async function sendOrderEmail(data) {

    console.log(
        "Calling:",
        EDGE_FUNCTION_URL
    );


    const sessionResult =
        await supabaseClient
            .auth
            .getSession();


    const session =
        sessionResult.data.session;


    const accessToken =
        session &&
        session.access_token
        ?
        session.access_token
        :
        SUPABASE_ANON_KEY;


    const response =
        await fetch(
            EDGE_FUNCTION_URL,
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "apikey":
                        SUPABASE_ANON_KEY,

                    "Authorization":
                        "Bearer " +
                        accessToken

                },

                body:
                    JSON.stringify(data)

            }
        );


    const text =
        await response.text();


    console.log(
        "Function HTTP status:",
        response.status
    );


    console.log(
        "Function response:",
        text
    );


    let result;


    try {

        result =
            JSON.parse(text);

    }

    catch {

        result = {
            raw: text
        };

    }


    if (!response.ok) {

        throw new Error(
            result.error ||
            result.message ||
            result.raw ||
            "Edge Function returned HTTP " +
            response.status
        );

    }


    if (
        result.success === false
    ) {

        throw new Error(
            result.error ||
            result.message ||
            "Email sending failed."
        );

    }


    return result;

}


/* =========================================================
   DOWNLOAD FILE
========================================================= */

async function downloadFile(
    filePath,
    fileName
) {

    if (!filePath) {

        showError(
            "File path is missing."
        );

        return;

    }


    try {

        /*
         * Create signed URL.
         * This works for private bucket.
         */

        const {
            data,
            error
        } =
        await supabaseClient
            .storage
            .from("print-files")
            .createSignedUrl(
                filePath,
                300
            );


        if (error) {
            throw error;
        }


        if (
            !data ||
            !data.signedUrl
        ) {

            throw new Error(
                "Could not create file URL."
            );

        }


        const link =
            document.createElement("a");


        link.href =
            data.signedUrl;


        link.download =
            fileName ||
            "download";


        link.target =
            "_blank";


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


    }

    catch (error) {

        console.error(
            "Download error:",
            error
        );


        showError(
            "Unable to download file: " +
            (
                error.message ||
                error
            )
        );

    }

}


/* =========================================================
   COUNTERS
========================================================= */

async function loadCounters() {

    try {

        const {
            data,
            error
        } =
        await supabaseClient
            .from("orders")
            .select("status");


        if (error) {
            throw error;
        }


        updateCounters(
            data || []
        );

    }

    catch (error) {

        console.error(
            "Counter error:",
            error
        );

    }

}


function updateCounters(orders) {

    let pending = 0;

    let processing = 0;

    let completed = 0;


    orders.forEach(
        function (order) {

            const status =
                String(
                    order.status ||
                    ""
                ).toLowerCase();


            if (
                status === "pending"
            ) {

                pending++;

            }


            if (
                status === "processing" ||
                status === "printing" ||
                status === "ready"
            ) {

                processing++;

            }


            if (
                status === "completed"
            ) {

                completed++;

            }

        }
    );


    document.getElementById(
        "totalOrders"
    ).textContent =
        orders.length;


    document.getElementById(
        "pendingOrders"
    ).textContent =
        pending;


    document.getElementById(
        "processingOrders"
    ).textContent =
        processing;


    document.getElementById(
        "completedOrders"
    ).textContent =
        completed;

}


/* =========================================================
   HELPERS
========================================================= */

function capitalizeStatus(status) {

    return String(status)
        .charAt(0)
        .toUpperCase() +
        String(status)
            .slice(1);

}


function getStatusClass(status) {

    return "status-" +
        String(status)
            .toLowerCase();

}


function setEmailStatus(
    orderId,
    message,
    className
) {

    const element =
        document.getElementById(
            "email-status-" +
            orderId
        );


    if (!element) {
        return;
    }


    element.textContent =
        message;


    element.className =
        "email-status " +
        className;

}


function formatDate(value) {

    if (!value) {
        return "-";
    }


    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return String(value);

    }


    return date.toLocaleString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeJS(value) {

    return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "\\r");

}


function showSuccess(message) {

    const box =
        document.getElementById(
            "successMessage"
        );


    box.textContent =
        message;


    box.style.display =
        "block";


    setTimeout(
        function () {

            box.style.display =
                "none";

        },
        5000
    );

}


function showError(message) {

    const box =
        document.getElementById(
            "errorMessage"
        );


    box.textContent =
        message;


    box.style.display =
        "block";

}


function hideMessages() {

    document.getElementById(
        "successMessage"
    ).style.display =
        "none";


    document.getElementById(
        "errorMessage"
    ).style.display =
        "none";

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "login.html";

}


/* =========================================================
   AUTH LISTENER
========================================================= */

supabaseClient.auth.onAuthStateChange(
    function (
        event,
        session
    ) {

        if (
            event === "SIGNED_OUT"
        ) {

            window.location.href =
                "login.html";

        }

    }
);

</script>
