<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AviPrint Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
    color:#111827;
}

.topbar{
    background:#111827;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.topbar h1{
    font-size:22px;
}

.admin-info{
    margin-top:5px;
    font-size:13px;
    opacity:.85;
}

.logout-btn{
    background:#ef4444;
    color:white;
    border:0;
    padding:10px 18px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.logout-btn:hover{
    background:#dc2626;
}

.container{
    width:95%;
    max-width:1500px;
    margin:25px auto;
}

.message{
    display:none;
    padding:14px 18px;
    border-radius:8px;
    margin-bottom:20px;
    font-size:14px;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:22px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.card h3{
    font-size:14px;
    color:#6b7280;
    margin-bottom:10px;
}

.number{
    font-size:30px;
    font-weight:bold;
}

.blue{color:#2563eb}
.orange{color:#d97706}
.purple{color:#7c3aed}
.green{color:#16a34a}

.section{
    background:white;
    border-radius:12px;
    padding:22px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:20px;
}

.section-header h2{
    font-size:20px;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.search-box{
    flex:1;
    min-width:250px;
    height:44px;
    border:1px solid #d1d5db;
    border-radius:8px;
    padding:0 14px;
    outline:none;
    font-size:14px;
}

.search-box:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

.status-filter{
    height:44px;
    border:1px solid #d1d5db;
    border-radius:8px;
    padding:0 12px;
    background:white;
    min-width:150px;
}

.refresh-btn{
    background:#2563eb;
    border:0;
    color:white;
    padding:10px 17px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.refresh-btn:hover{
    background:#1d4ed8;
}

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1250px;
    border-collapse:collapse;
}

th{
    background:#f3f4f6;
    text-align:left;
    padding:13px;
    font-size:13px;
    white-space:nowrap;
}

td{
    padding:13px;
    border-bottom:1px solid #e5e7eb;
    font-size:13px;
    vertical-align:middle;
}

tr:hover{
    background:#fafafa;
}

.order-id{
    color:#2563eb;
    font-weight:bold;
}

.customer-name{
    font-weight:bold;
}

.email{
    color:#374151;
    word-break:break-word;
}

.service{
    font-weight:600;
}

.details{
    color:#6b7280;
    max-width:220px;
    line-height:1.4;
}

.quantity{
    text-align:center;
}

.date{
    color:#6b7280;
    white-space:nowrap;
}

select{
    padding:8px 10px;
    border:1px solid #d1d5db;
    border-radius:6px;
    background:white;
    cursor:pointer;
    min-width:130px;
}

select:disabled{
    opacity:.6;
    cursor:wait;
}

.status-pending{
    color:#c2410c;
    background:#fff7ed;
}

.status-processing{
    color:#6d28d9;
    background:#f5f3ff;
}

.status-printing{
    color:#1d4ed8;
    background:#eff6ff;
}

.status-ready{
    color:#0e7490;
    background:#ecfeff;
}

.status-completed{
    color:#15803d;
    background:#f0fdf4;
}

.status-cancelled{
    color:#b91c1c;
    background:#fef2f2;
}

.file-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.file-btn{
    border:0;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
}

.view-btn{
    background:#e0f2fe;
    color:#0369a1;
}

.download-btn{
    background:#dcfce7;
    color:#166534;
}

.file-btn:hover{
    opacity:.8;
}

.no-file{
    color:#9ca3af;
}

.email-status{
    font-size:11px;
    margin-top:5px;
}

.email-sending{
    color:#d97706;
}

.email-success{
    color:#15803d;
}

.email-failed{
    color:#dc2626;
}

.loading,
.empty{
    text-align:center;
    padding:40px;
    color:#6b7280;
}

.result-info{
    color:#6b7280;
    font-size:13px;
    margin-bottom:12px;
}

@media(max-width:900px){
    .cards{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .cards{
        grid-template-columns:1fr;
    }

    .container{
        width:94%;
    }

    .section{
        padding:15px;
    }

    .topbar{
        padding:15px;
    }

    .search-box{
        min-width:100%;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <div>
        <h1>🖨️ AviPrint Admin Panel</h1>

        <div
            class="admin-info"
            id="adminInfo">
            Checking admin session...
        </div>
    </div>

    <button
        class="logout-btn"
        onclick="logout()">
        Logout
    </button>

</header>


<main class="container">

    <div
        id="successMessage"
        class="message success">
    </div>

    <div
        id="errorMessage"
        class="message error">
    </div>


    <!-- =========================
         DASHBOARD CARDS
    ========================== -->

    <div class="cards">

        <div class="card">
            <h3>Total Orders</h3>
            <div
                id="totalOrders"
                class="number blue">
                0
            </div>
        </div>

        <div class="card">
            <h3>Pending Orders</h3>
            <div
                id="pendingOrders"
                class="number orange">
                0
            </div>
        </div>

        <div class="card">
            <h3>Processing / Printing</h3>
            <div
                id="processingOrders"
                class="number purple">
                0
            </div>
        </div>

        <div class="card">
            <h3>Completed Orders</h3>
            <div
                id="completedOrders"
                class="number green">
                0
            </div>
        </div>

    </div>


    <!-- =========================
         ORDERS
    ========================== -->

    <section class="section">

        <div class="section-header">

            <h2>📦 Customer Orders</h2>

            <button
                class="refresh-btn"
                onclick="loadOrders()">
                🔄 Refresh
            </button>

        </div>


        <!-- SEARCH -->

        <div class="controls">

            <input
                type="text"
                id="searchInput"
                class="search-box"
                placeholder="🔍 Search customer name, email or order ID...">

            <select
                id="statusFilter"
                class="status-filter">

                <option value="all">
                    All Status
                </option>

                <option value="pending">
                    Pending
                </option>

                <option value="processing">
                    Processing
                </option>

                <option value="printing">
                    Printing
                </option>

                <option value="ready">
                    Ready
                </option>

                <option value="completed">
                    Completed
                </option>

                <option value="cancelled">
                    Cancelled
                </option>

            </select>

        </div>


        <div
            id="resultInfo"
            class="result-info">
            Loading...
        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>Order ID</th>

                        <th>Customer</th>

                        <th>Email</th>

                        <th>Service</th>

                        <th>Details</th>

                        <th>Amount</th>

                        <th>File</th>

                        <th>Status</th>

                        <th>Date</th>

                    </tr>

                </thead>


                <tbody
                    id="ordersTableBody">

                    <tr>

                        <td
                            colspan="9"
                            class="loading">

                            Loading orders...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://pmqmewceqnxsvlhceeef.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_mWPszaFzSHbPp-OHlPGWjw_JdrMU6oQ";


/* =========================================================
   ADMIN
========================================================= */

const ADMIN_EMAIL =
    "aviinformatics@gmail.com";


/* =========================================================
   EDGE FUNCTION
========================================================= */

const EDGE_FUNCTION_NAME =
    "dynamic-function";


/* =========================================================
   CREATE SUPABASE CLIENT
========================================================= */

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   GLOBAL ORDERS
========================================================= */

let allOrders = [];


/* =========================================================
   PAGE START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        document
            .getElementById("searchInput")
            .addEventListener(
                "input",
                applyFilters
            );

        document
            .getElementById("statusFilter")
            .addEventListener(
                "change",
                applyFilters
            );

        await checkAdmin();

    }
);


/* =========================================================
   CHECK ADMIN
========================================================= */

async function checkAdmin(){

    try{

        const {
            data,
            error
        } =
            await supabaseClient
            .auth
            .getSession();


        if(error){

            throw error;

        }


        const session =
            data.session;


        if(
            !session ||
            !session.user
        ){

            window.location.href =
                "login.html";

            return;

        }


        const email =
            session.user.email || "";


        if(
            email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
        ){

            alert(
                "Access denied. Admin account required."
            );

            await supabaseClient
                .auth
                .signOut();

            window.location.href =
                "login.html";

            return;

        }


        document
            .getElementById("adminInfo")
            .textContent =
            "Logged in as Admin: " + email;


        await loadOrders();

    }

    catch(error){

        console.error(
            "Admin check error:",
            error
        );

        showError(
            error.message ||
            "Unable to verify admin."
        );

    }

}


/* =========================================================
   LOAD ORDERS
========================================================= */

async function loadOrders(){

    const tbody =
        document.getElementById(
            "ordersTableBody"
        );


    tbody.innerHTML = `
        <tr>
            <td
                colspan="9"
                class="loading">
                Loading orders...
            </td>
        </tr>
    `;


    try{

        const {
            data,
            error
        } =
            await supabaseClient
            .from("orders")
            .select(`
                id,
                order_number,
                user_id,
                service_name,
                service_details,
                order_date,
                status,
                amount,
                file_path,
                file_name,
                created_at,
                customer_email
            `)
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){

            throw error;

        }


        allOrders =
            data || [];


        /*
         * Get customer names.
         */

        await loadCustomerNames();


        updateCounters(
            allOrders
        );


        applyFilters();

    }

    catch(error){

        console.error(
            "Load orders error:",
            error
        );


        tbody.innerHTML = `
            <tr>
                <td
                    colspan="9"
                    class="empty">
                    Failed to load orders.
                </td>
            </tr>
        `;


        showError(
            "Failed to load orders: " +
            (
                error.message ||
                error
            )
        );

    }

}


/* =========================================================
   LOAD CUSTOMER NAMES
========================================================= */

async function loadCustomerNames(){

    /*
     * First try profiles table.
     */

    try{

        const {
            data,
            error
        } =
            await supabaseClient
            .from("profiles")
            .select("*");


        if(
            !error &&
            data &&
            data.length
        ){

            allOrders.forEach(
                function(order){

                    const profile =
                        data.find(
                            function(p){

                                return String(
                                    p.id ||
                                    p.user_id ||
                                    ""
                                ).toLowerCase()
                                ===
                                String(
                                    order.user_id ||
                                    ""
                                ).toLowerCase();

                            }
                        );


                    if(profile){

                        order.customer_name =
                            profile.full_name ||
                            profile.name ||
                            profile.username ||
                            profile.display_name ||
                            "";

                    }

                }
            );

        }

    }

    catch(error){

        console.log(
            "Profiles lookup skipped:",
            error
        );

    }


    /*
     * Fallback customer name.
     */

    allOrders.forEach(
        function(order){

            if(
                !order.customer_name
            ){

                order.customer_name =
                    getNameFromEmail(
                        order.customer_email
                    );

            }

        }
    );

}


/* =========================================================
   NAME FROM EMAIL
========================================================= */

function getNameFromEmail(email){

    if(!email){

        return "Customer";

    }


    const name =
        email
        .split("@")[0]
        .replace(/[._-]+/g," ")
        .trim();


    if(!name){

        return "Customer";

    }


    return name
        .split(" ")
        .map(
            function(word){

                return word
                    .charAt(0)
                    .toUpperCase() +
                    word
                    .slice(1);

            }
        )
        .join(" ");

}


/* =========================================================
   FILTER
========================================================= */

function applyFilters(){

    const search =
        document
        .getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    const statusFilter =
        document
        .getElementById(
            "statusFilter"
        )
        .value;


    const filtered =
        allOrders.filter(
            function(order){

                const orderNumber =
                    String(
                        order.order_number ||
                        ""
                    ).toLowerCase();


                const customer =
                    String(
                        order.customer_name ||
                        ""
                    ).toLowerCase();


                const email =
                    String(
                        order.customer_email ||
                        ""
                    ).toLowerCase();


                const status =
                    String(
                        order.status ||
                        "pending"
                    ).toLowerCase();


                const matchesSearch =
                    !search ||
                    orderNumber.includes(search) ||
                    customer.includes(search) ||
                    email.includes(search);


                const matchesStatus =
                    statusFilter === "all" ||
                    status === statusFilter;


                return (
                    matchesSearch &&
                    matchesStatus
                );

            }
        );


    renderOrders(
        filtered
    );


    document
        .getElementById(
            "resultInfo"
        )
        .textContent =
        "Showing " +
        filtered.length +
        " of " +
        allOrders.length +
        " orders";

}


/* =========================================================
   RENDER ORDERS
========================================================= */

function renderOrders(orders){

    const tbody =
        document.getElementById(
            "ordersTableBody"
        );


    if(!orders.length){

        tbody.innerHTML = `
            <tr>
                <td
                    colspan="9"
                    class="empty">
                    No matching orders found.
                </td>
            </tr>
        `;

        return;

    }


    tbody.innerHTML = "";


    orders.forEach(
        function(order){

            tbody.appendChild(
                createOrderRow(order)
            );

        }
    );

}


/* =========================================================
   CREATE ROW
========================================================= */

function createOrderRow(order){

    const tr =
        document.createElement(
            "tr"
        );


    const orderId =
        order.id || "";


    const orderNumber =
        order.order_number ||
        orderId;


    const customerName =
        order.customer_name ||
        getNameFromEmail(
            order.customer_email
        );


    const email =
        order.customer_email ||
        "-";


    const service =
        order.service_name ||
        "-";


    const details =
        order.service_details ||
        "-";


    const amount =
        order.amount !== null &&
        order.amount !== undefined
        ?
        "₹" +
        Number(
            order.amount
        ).toFixed(2)
        :
        "₹0.00";


    const status =
        String(
            order.status ||
            "pending"
        ).toLowerCase();


    const createdAt =
        order.order_date ||
        order.created_at ||
        "";


    tr.dataset.orderId =
        orderId;

    tr.dataset.orderNumber =
        orderNumber;

    tr.dataset.customerName =
        customerName;

    tr.dataset.email =
        email;

    tr.dataset.service =
        service;

    tr.dataset.details =
        details;

    tr.dataset.amount =
        amount;

    tr.dataset.fileName =
        order.file_name || "";

    tr.dataset.filePath =
        order.file_path || "";


    tr.innerHTML = `

        <td>
            <span class="order-id">
                ${escapeHTML(
                    orderNumber
                )}
            </span>
        </td>


        <td>
            <span class="customer-name">
                ${escapeHTML(
                    customerName
                )}
            </span>
        </td>


        <td>

            <span class="email">
                ${escapeHTML(
                    email
                )}
            </span>

            <div
                id="email-status-${escapeHTML(
                    orderId
                )}"
                class="email-status">
            </div>

        </td>


        <td>
            <span class="service">
                ${escapeHTML(
                    service
                )}
            </span>
        </td>


        <td>
            <div class="details">
                ${escapeHTML(
                    details
                )}
            </div>
        </td>


        <td>
            <strong>
                ${escapeHTML(
                    amount
                )}
            </strong>
        </td>


        <td>
            ${createFileButtons(
                order
            )}
        </td>


        <td>

            <select
                class="${getStatusClass(status)}"
                data-old-status="${escapeHTML(status)}"
                onchange="changeOrderStatus(
                    '${escapeJS(orderId)}',
                    this.value,
                    this
                )">

                <option
                    value="pending"
                    ${status === "pending" ? "selected" : ""}>
                    Pending
                </option>

                <option
                    value="processing"
                    ${status === "processing" ? "selected" : ""}>
                    Processing
                </option>

                <option
                    value="printing"
                    ${status === "printing" ? "selected" : ""}>
                    Printing
                </option>

                <option
                    value="ready"
                    ${status === "ready" ? "selected" : ""}>
                    Ready
                </option>

                <option
                    value="completed"
                    ${status === "completed" ? "selected" : ""}>
                    Completed
                </option>

                <option
                    value="cancelled"
                    ${status === "cancelled" ? "selected" : ""}>
                    Cancelled
                </option>

            </select>

        </td>


        <td class="date">
            ${escapeHTML(
                formatDate(createdAt)
            )}
        </td>

    `;


    return tr;

}


/* =========================================================
   FILE BUTTONS
========================================================= */

function createFileButtons(order){

    if(
        !order.file_path
    ){

        return `
            <span class="no-file">
                No file
            </span>
        `;

    }


    const encodedPath =
        encodeURIComponent(
            order.file_path
        );


    return `

        <div class="file-actions">

            <button
                class="file-btn view-btn"
                onclick="viewFile('${escapeJS(
                    order.file_path
                )}')">

                👁 View

            </button>


            <button
                class="file-btn download-btn"
                onclick="downloadFile(
                    '${escapeJS(order.file_path)}',
                    '${escapeJS(order.file_name || "file")}'
                )">

                ⬇ Download

            </button>

        </div>

    `;

}


/* =========================================================
   VIEW FILE
========================================================= */

async function viewFile(
    filePath
){

    if(!filePath){

        showError(
            "File path is missing."
        );

        return;

    }


    try{

        const {
            data,
            error
        } =
            await supabaseClient
            .storage
            .from("print-files")
            .createSignedUrl(
                filePath,
                3600
            );


        if(error){

            throw error;

        }


        if(
            !data ||
            !data.signedUrl
        ){

            throw new Error(
                "Unable to create file URL."
            );

        }


        window.open(
            data.signedUrl,
            "_blank"
        );

    }

    catch(error){

        console.error(
            "View file error:",
            error
        );

        showError(
            "Unable to view file: " +
            (
                error.message ||
                error
            )
        );

    }

}


/* =========================================================
   DOWNLOAD FILE
========================================================= */

async function downloadFile(
    filePath,
    fileName
){

    if(!filePath){

        showError(
            "File path is missing."
        );

        return;

    }


    try{

        const {
            data,
            error
        } =
            await supabaseClient
            .storage
            .from("print-files")
            .download(
                filePath
            );


        if(error){

            throw error;

        }


        if(!data){

            throw new Error(
                "File data was not returned."
            );

        }


        const url =
            URL.createObjectURL(
                data
            );


        const a =
            document.createElement(
                "a"
            );


        a.href =
            url;

        a.download =
            fileName ||
            "download";


        document.body.appendChild(
            a
        );

        a.click();

        a.remove();


        URL.revokeObjectURL(
            url
        );

    }

    catch(error){

        console.error(
            "Download error:",
            error
        );


        /*
         * Fallback to signed URL.
         */

        try{

            const {
                data,
                error:signedError
            } =
                await supabaseClient
                .storage
                .from("print-files")
                .createSignedUrl(
                    filePath,
                    3600,
                    {
                        download:
                            fileName ||
                            true
                    }
                );


            if(signedError){

                throw signedError;

            }


            if(
                data &&
                data.signedUrl
            ){

                const a =
                    document.createElement(
                        "a"
                    );

                a.href =
                    data.signedUrl;

                a.download =
                    fileName ||
                    "download";

                document.body.appendChild(
                    a
                );

                a.click();

                a.remove();

                return;

            }


            throw new Error(
                "Unable to create download link."
            );

        }

        catch(fallbackError){

            console.error(
                "Download fallback error:",
                fallbackError
            );

            showError(
                "Unable to download file: " +
                (
                    fallbackError.message ||
                    fallbackError
                )
            );

        }

    }

}


/* =========================================================
   CHANGE ORDER STATUS
========================================================= */

async function changeOrderStatus(
    orderId,
    newStatus,
    selectElement
){

    if(!orderId){

        showError(
            "Order ID is missing."
        );

        return;

    }


    const oldStatus =
        selectElement.dataset.oldStatus ||
        "pending";


    const row =
        selectElement.closest(
            "tr"
        );


    const orderNumber =
        row.dataset.orderNumber ||
        orderId;


    const customerName =
        row.dataset.customerName ||
        "Customer";


    const customerEmail =
        row.dataset.email ||
        "";


    const service =
        row.dataset.service ||
        "-";


    const details =
        row.dataset.details ||
        "-";


    const amount =
        row.dataset.amount ||
        "₹0.00";


    const fileName =
        row.dataset.fileName ||
        "-";


    selectElement.disabled =
        true;


    hideMessages();


    try{

        /* =====================================
           UPDATE DATABASE
        ===================================== */

        const {
            error
        } =
            await supabaseClient
            .from("orders")
            .update({
                status:newStatus
            })
            .eq(
                "id",
                orderId
            );


        if(error){

            throw error;

        }


        /*
         * Update local order.
         */

        const localOrder =
            allOrders.find(
                function(order){

                    return String(
                        order.id
                    ) ===
                    String(
                        orderId
                    );

                }
            );


        if(localOrder){

            localOrder.status =
                newStatus;

        }


        selectElement.dataset.oldStatus =
            newStatus;


        selectElement.className =
            getStatusClass(
                newStatus
            );


        updateCounters(
            allOrders
        );


        showSuccess(
            "Order " +
            orderNumber +
            " updated to " +
            newStatus +
            "."
        );


        /* =====================================
           SEND EMAIL
        ===================================== */

        if(
            customerEmail &&
            customerEmail !== "-"
        ){

            setEmailStatus(
                orderId,
                "Sending email...",
                "email-sending"
            );


            try{

                await sendOrderEmail({

                    email:
                        customerEmail,

                    customerEmail:
                        customerEmail,

                    orderId:
                        orderId,

                    orderNumber:
                        orderNumber,

                    customerName:
                        customerName,

                    service:
                        service,

                    service_name:
                        service,

                    details:
                        details,

                    service_details:
                        details,

                    amount:
                        amount,

                    fileName:
                        fileName,

                    file_name:
                        fileName,

                    status:
                        capitalizeStatus(
                            newStatus
                        )

                });


                setEmailStatus(
                    orderId,
                    "✓ Email sent",
                    "email-success"
                );

            }

            catch(emailError){

                console.error(
                    "Email failed:",
                    emailError
                );


                setEmailStatus(
                    orderId,
                    "✗ Email failed",
                    "email-failed"
                );


                showError(
                    "Order updated, but customer email failed: " +
                    (
                        emailError.message ||
                        "Email service error"
                    )
                );

            }

        }

        else{

            setEmailStatus(
                orderId,
                "No email available",
                "email-failed"
            );

        }


        /*
         * Re-render after status update.
         */

        applyFilters();

    }

    catch(error){

        console.error(
            "Status update error:",
            error
        );


        selectElement.value =
            oldStatus;


        selectElement.className =
            getStatusClass(
                oldStatus
            );


        showError(
            "Failed to update order status: " +
            (
                error.message ||
                error
            )
        );

    }

    finally{

        selectElement.disabled =
            false;

    }

}


/* =========================================================
   SEND EMAIL
========================================================= */

async function sendOrderEmail(data){

    console.log(
        "Calling Edge Function:",
        EDGE_FUNCTION_NAME
    );


    const {
        data:resultData,
        error
    } =
        await supabaseClient
        .functions
        .invoke(
            EDGE_FUNCTION_NAME,
            {
                body:data
            }
        );


    console.log(
        "Edge Function result:",
        resultData
    );


    if(error){

        console.error(
            "Edge Function error:",
            error
        );

        throw new Error(
            error.message ||
            "Failed to call Edge Function."
        );

    }


    if(
        resultData &&
        resultData.success === false
    ){

        throw new Error(
            resultData.error ||
            resultData.message ||
            "Email sending failed."
        );

    }


    return resultData;

}


/* =========================================================
   SET EMAIL STATUS
========================================================= */

function setEmailStatus(
    orderId,
    message,
    className
){

    const element =
        document.getElementById(
            "email-status-" +
            orderId
        );


    if(!element){

        console.warn(
            "Email status element not found:",
            orderId
        );

        return;

    }


    element.textContent =
        message;


    element.className =
        "email-status " +
        className;

}


/* =========================================================
   COUNTERS
========================================================= */

function updateCounters(
    orders
){

    let pending = 0;

    let processing = 0;

    let completed = 0;


    orders.forEach(
        function(order){

            const status =
                String(
                    order.status ||
                    "pending"
                ).toLowerCase();


            if(
                status === "pending"
            ){

                pending++;

            }


            if(
                status === "processing" ||
                status === "printing" ||
                status === "ready"
            ){

                processing++;

            }


            if(
                status === "completed"
            ){

                completed++;

            }

        }
    );


    document.getElementById(
        "totalOrders"
    ).textContent =
        orders.length;


    document.getElementById(
        "pendingOrders"
    ).textContent =
        pending;


    document.getElementById(
        "processingOrders"
    ).textContent =
        processing;


    document.getElementById(
        "completedOrders"
    ).textContent =
        completed;

}


/* =========================================================
   STATUS CLASS
========================================================= */

function getStatusClass(
    status
){

    return (
        "status-" +
        String(
            status
        ).toLowerCase()
    );

}


/* =========================================================
   CAPITALIZE STATUS
========================================================= */

function capitalizeStatus(
    status
){

    const value =
        String(
            status || ""
        );


    return value
        .charAt(0)
        .toUpperCase() +
        value.slice(1);

}


/* =========================================================
   DATE
========================================================= */

function formatDate(
    value
){

    if(!value){

        return "-";

    }


    const date =
        new Date(
            value
        );


    if(
        isNaN(
            date.getTime()
        )
    ){

        return String(
            value
        );

    }


    return date.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
){

    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   ESCAPE JS
========================================================= */

function escapeJS(
    value
){

    return String(
        value
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        '\\"'
    )
    .replace(
        /\n/g,
        "\\n"
    )
    .replace(
        /\r/g,
        "\\r"
    );

}


/* =========================================================
   SUCCESS
========================================================= */

function showSuccess(
    message
){

    const box =
        document.getElementById(
            "successMessage"
        );


    box.textContent =
        message;


    box.style.display =
        "block";


    setTimeout(
        function(){

            box.style.display =
                "none";

        },
        5000
    );

}


/* =========================================================
   ERROR
========================================================= */

function showError(
    message
){

    const box =
        document.getElementById(
            "errorMessage"
        );


    box.textContent =
        message;


    box.style.display =
        "block";

}


/* =========================================================
   HIDE MESSAGES
========================================================= */

function hideMessages(){

    document.getElementById(
        "successMessage"
    ).style.display =
        "none";


    document.getElementById(
        "errorMessage"
    ).style.display =
        "none";

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

    try{

        await supabaseClient
            .auth
            .signOut();

    }

    catch(error){

        console.error(
            "Logout error:",
            error
        );

    }


    window.location.href =
        "login.html";

}

   AUTH LISTENER
========================================================= */

supabaseClient
.auth
.onAuthStateChange(
    function(
        event,
        session
    ){

        if(
            event ===
            "SIGNED_OUT" ||
            !session
        ){

            window.location.href =
                "login.html";

        }

    }
);
