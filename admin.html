<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>AviPrint Admin Panel</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #111827;
        }

        #loadingScreen {

            position: fixed;
            inset: 0;

            background: #111827;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            flex-direction: column;

            z-index: 99999;
        }

        .loader {

            width: 42px;
            height: 42px;

            border: 4px solid #374151;
            border-top: 4px solid white;

            border-radius: 50%;

            animation: spin 1s linear infinite;

            margin-bottom: 15px;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

        #adminPanel {
            display: none;
        }

        .container {

            max-width: 1200px;

            margin: auto;

            padding: 30px 20px;
        }

        .header {

            background: #111827;

            color: white;

            padding: 22px;

            border-radius: 12px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
        }

        .header p {

            margin: 7px 0 0;

            color: #d1d5db;
        }

        .logout {

            background: #ef4444;

            color: white;

            border: none;

            padding: 10px 18px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: 600;
        }

        .logout:hover {
            background: #dc2626;
        }

        .admin-email {

            margin-top: 20px;

            padding: 13px 16px;

            background: #eff6ff;

            color: #1d4ed8;

            border-radius: 8px;

            font-size: 14px;
        }

        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;

            margin: 25px 0;
        }

        .card {

            background: white;

            padding: 22px;

            border-radius: 12px;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,.08);
        }

        .card h3 {

            margin:
                0 0 10px;

            color: #6b7280;

            font-size: 15px;
        }

        .card p {

            margin: 0;

            font-size: 28px;

            font-weight: bold;
        }

        .orders {

            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,.08);

            overflow-x: auto;
        }

        .orders-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 20px;
        }

        .orders-header h2 {
            margin: 0;
        }

        .refresh {

            border: none;

            background: #2563eb;

            color: white;

            padding: 9px 15px;

            border-radius: 7px;

            cursor: pointer;
        }

        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 800px;
        }

        th,
        td {

            padding: 13px;

            border-bottom:
                1px solid #e5e7eb;

            text-align: left;
        }

        th {

            background: #f9fafb;

            color: #374151;
        }

        .email {

            color: #2563eb;

            font-weight: 600;
        }

        select {

            padding: 7px 10px;

            border:
                1px solid #d1d5db;

            border-radius: 6px;

            background: white;

            cursor: pointer;
        }

        .message {

            background: #fee2e2;

            color: #991b1b;

            padding: 15px;

            border-radius: 8px;

            margin-top: 20px;

            display: none;
        }

        .empty {

            text-align: center;

            padding: 30px;

            color: #6b7280;
        }

        @media(max-width: 800px) {

            .stats {

                grid-template-columns:
                    repeat(2, 1fr);
            }

            .header {

                flex-direction: column;

                align-items: flex-start;
            }

        }

        @media(max-width: 500px) {

            .container {
                padding: 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .orders {
                padding: 18px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================
     LOADING SCREEN
===================================== -->

<div id="loadingScreen">

    <div class="loader"></div>

    <div>
        Checking admin authentication...
    </div>

</div>



<!-- =====================================
     ADMIN PANEL
===================================== -->

<div id="adminPanel">

    <div class="container">


        <!-- HEADER -->

        <div class="header">

            <div>

                <h1>
                    🖨️ AviPrint Admin Panel
                </h1>

                <p>
                    Manage orders and portal activity
                </p>

            </div>


            <button
                class="logout"
                id="logoutBtn">

                Logout

            </button>

        </div>



        <!-- ADMIN EMAIL -->

        <div class="admin-email">

            🔐 Logged in as Admin:

            <strong id="adminEmail">
                Loading...
            </strong>

        </div>



        <!-- ERROR -->

        <div
            id="errorMessage"
            class="message">
        </div>



        <!-- STATS -->

        <div class="stats">


            <div class="card">

                <h3>
                    Total Orders
                </h3>

                <p id="totalOrders">
                    0
                </p>

            </div>


            <div class="card">

                <h3>
                    Pending
                </h3>

                <p id="pendingOrders">
                    0
                </p>

            </div>


            <div class="card">

                <h3>
                    Completed
                </h3>

                <p id="completedOrders">
                    0
                </p>

            </div>


            <div class="card">

                <h3>
                    Total Users
                </h3>

                <p id="totalUsers">
                    0
                </p>

            </div>


        </div>



        <!-- ORDERS -->

        <div class="orders">


            <div class="orders-header">

                <h2>
                    📦 All Orders
                </h2>


                <button
                    class="refresh"
                    id="refreshBtn">

                    ↻ Refresh

                </button>

            </div>



            <table>

                <thead>

                    <tr>

                        <th>
                            Order ID
                        </th>

                        <th>
                            User Email
                        </th>

                        <th>
                            Service
                        </th>

                        <th>
                            Quantity
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Date
                        </th>

                    </tr>

                </thead>


                <tbody id="ordersTable">

                    <tr>

                        <td
                            colspan="6"
                            class="empty">

                            Loading orders...

                        </td>

                    </tr>

                </tbody>

            </table>


        </div>


    </div>

</div>



<!-- =====================================
     SUPABASE
===================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script>


/* =====================================
   SUPABASE CONFIG
===================================== */

const SUPABASE_URL =
    "https://pmqmewceqnxsvlhceeef.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_mWPszaFzSHbPp-OHlPGWjw_JdrMU6oQ";


const ADMIN_EMAIL =
    "aviinformatics@gmail.com";


const supabaseClient =
    window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_PUBLISHABLE_KEY

    );



/* =====================================
   ELEMENTS
===================================== */

const loadingScreen =
    document.getElementById(
        "loadingScreen"
    );


const adminPanel =
    document.getElementById(
        "adminPanel"
    );


const ordersTable =
    document.getElementById(
        "ordersTable"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );



/* =====================================
   LOGIN REDIRECT
===================================== */

function redirectToLogin() {

    window.location.replace(
        "login.html"
    );

}



/* =====================================
   SHOW ERROR
===================================== */

function showError(message) {

    errorMessage.textContent =
        message;

    errorMessage.style.display =
        "block";

}



/* =====================================
   SECURITY CHECK
===================================== */

async function securityCheck() {

    try {


        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getSession();


        if (error) {

            console.error(error);

            redirectToLogin();

            return;

        }


        const session =
            data.session;


        if (!session) {

            redirectToLogin();

            return;

        }


        const user =
            session.user;


        if (!user) {

            redirectToLogin();

            return;

        }


        /* ===============================
           ADMIN EMAIL
        =============================== */

        if (
            !user.email ||
            user.email.toLowerCase()
            !==
            ADMIN_EMAIL.toLowerCase()
        ) {

            alert(
                "Access denied. Admin only."
            );

            await supabaseClient
                .auth
                .signOut();

            redirectToLogin();

            return;

        }


        /* ===============================
           SHOW ADMIN
        =============================== */

        document.getElementById(
            "adminEmail"
        ).textContent =
            user.email;


        loadingScreen.style.display =
            "none";


        adminPanel.style.display =
            "block";


        /* ===============================
           LOAD DATA
        =============================== */

        await loadOrders();

        await loadUsers();

    }

    catch (error) {

        console.error(
            "Security error:",
            error
        );

        redirectToLogin();

    }

}



/* =====================================
   LOAD ORDERS
===================================== */

async function loadOrders() {


    const {
        data,
        error
    } =
    await supabaseClient

        .from("admin_orders")

        .select("*")

        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "Orders error:",
            error
        );

        showError(
            "Unable to load orders: "
            +
            error.message
        );

        return;

    }


    const orders =
        data || [];


    /* ===============================
       STATS
    =============================== */

    document.getElementById(
        "totalOrders"
    ).textContent =
        orders.length;


    document.getElementById(
        "pendingOrders"
    ).textContent =

        orders.filter(
            order =>
                order.status ===
                "pending"
        ).length;


    document.getElementById(
        "completedOrders"
    ).textContent =

        orders.filter(
            order =>
                order.status ===
                "completed"
        ).length;



    /* ===============================
       NO ORDERS
    =============================== */

    if (
        orders.length === 0
    ) {

        ordersTable.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty">

                    No orders found.

                </td>

            </tr>

        `;

        return;

    }



    /* ===============================
       TABLE
    =============================== */

    ordersTable.innerHTML = "";


    orders.forEach(
        order => {


            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>

                    ${order.order_id || "-"}

                </td>


                <td class="email">

                    ${order.user_email || "-"}

                </td>


                <td>

                    -

                </td>


                <td>

                    1

                </td>


                <td>

                    <select
                        class="statusSelect"
                        data-id="${order.order_id}"
                    >

                        <option
                            value="pending"
                            ${order.status === "pending"
                                ? "selected"
                                : ""}>

                            Pending

                        </option>


                        <option
                            value="processing"
                            ${order.status === "processing"
                                ? "selected"
                                : ""}>

                            Processing

                        </option>


                        <option
                            value="printing"
                            ${order.status === "printing"
                                ? "selected"
                                : ""}>

                            Printing

                        </option>


                        <option
                            value="completed"
                            ${order.status === "completed"
                                ? "selected"
                                : ""}>

                            Completed

                        </option>


                        <option
                            value="cancelled"
                            ${order.status === "cancelled"
                                ? "selected"
                                : ""}>

                            Cancelled

                        </option>

                    </select>

                </td>


                <td>

                    ${
                        order.created_at

                        ? new Date(
                            order.created_at
                        ).toLocaleString()

                        : "-"
                    }

                </td>

            `;


            /* =========================
               STATUS UPDATE
            ========================= */

            const select =
                row.querySelector(
                    ".statusSelect"
                );


            select.addEventListener(
                "change",
                async function () {


                    const newStatus =
                        this.value;


                    const {
                        error
                    } =
                    await supabaseClient

                        .from("orders")

                        .update({

                            status:
                                newStatus

                        })

                        .eq(

                            "id",

                            order.order_id

                        );


                    if (error) {

                        alert(
                            "Status update failed: "
                            +
                            error.message
                        );

                        return;

                    }


                    alert(
                        "Order status updated successfully."
                    );


                    await loadOrders();

                }
            );


            ordersTable.appendChild(
                row
            );

        }
    );

}



/* =====================================
   LOAD USERS
===================================== */

async function loadUsers() {


    /*
       Profiles table may contain
       registered users.
    */

    const {
        data,
        error
    } =
    await supabaseClient

        .from("profiles")

        .select("id");


    if (error) {

        document.getElementById(
            "totalUsers"
        ).textContent =
            "0";

        return;

    }


    document.getElementById(
        "totalUsers"
    ).textContent =

        data
            ? data.length
            : 0;

}



/* =====================================
   REFRESH
===================================== */

document.getElementById(
    "refreshBtn"
)
.addEventListener(
    "click",
    async function () {

        await loadOrders();

        await loadUsers();

    }
);



/* =====================================
   LOGOUT
===================================== */

document.getElementById(
    "logoutBtn"
)
.addEventListener(
    "click",
    async function () {


        const {
            error
        } =
        await supabaseClient
            .auth
            .signOut();


        if (error) {

            alert(
                "Logout failed: "
                +
                error.message
            );

            return;

        }


        window.location.replace(
            "login.html"
        );

    }
);



/* =====================================
   START
===================================== */

securityCheck();


</script>

</body>

</html>
