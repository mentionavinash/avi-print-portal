<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AviPrint Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
    color:#111827;
}

.topbar{
    background:#111827;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.topbar h1{
    font-size:22px;
}

.admin-info{
    margin-top:5px;
    font-size:13px;
    color:#d1d5db;
}

.logout-btn{
    background:#ef4444;
    color:white;
    border:0;
    padding:10px 18px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.logout-btn:hover{
    background:#dc2626;
}

.container{
    width:95%;
    max-width:1450px;
    margin:25px auto;
}

.message{
    display:none;
    padding:14px 18px;
    border-radius:8px;
    margin-bottom:20px;
    font-size:14px;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:22px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.card h3{
    color:#6b7280;
    font-size:14px;
    margin-bottom:10px;
}

.number{
    font-size:30px;
    font-weight:bold;
}

.blue{
    color:#2563eb;
}

.orange{
    color:#d97706;
}

.purple{
    color:#7c3aed;
}

.green{
    color:#16a34a;
}

.section{
    background:white;
    padding:22px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.section-header h2{
    font-size:20px;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.search-box{
    width:300px;
    max-width:100%;
    padding:10px 13px;
    border:1px solid #d1d5db;
    border-radius:7px;
    outline:none;
}

.search-box:focus{
    border-color:#2563eb;
}

.refresh-btn{
    background:#2563eb;
    color:white;
    border:0;
    padding:10px 17px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.refresh-btn:hover{
    background:#1d4ed8;
}

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1250px;
    border-collapse:collapse;
}

th{
    background:#f3f4f6;
    padding:13px;
    text-align:left;
    font-size:13px;
    white-space:nowrap;
}

td{
    padding:13px;
    border-bottom:1px solid #e5e7eb;
    font-size:13px;
    vertical-align:middle;
}

tr:hover{
    background:#fafafa;
}

.order-id{
    color:#2563eb;
    font-weight:bold;
}

.customer-name{
    font-weight:bold;
    display:block;
}

.customer-email{
    color:#6b7280;
    font-size:12px;
    margin-top:4px;
    word-break:break-word;
}

.service{
    font-weight:600;
}

.details{
    max-width:220px;
    line-height:1.5;
}

.quantity{
    text-align:center;
}

.amount{
    font-weight:bold;
}

.date{
    color:#6b7280;
    white-space:nowrap;
}

.status-select{
    padding:8px 10px;
    border:1px solid #d1d5db;
    border-radius:6px;
    background:white;
    min-width:130px;
    cursor:pointer;
}

.status-select:disabled{
    opacity:.6;
    cursor:wait;
}

.status-pending{
    color:#c2410c;
    background:#fff7ed;
}

.status-processing{
    color:#6d28d9;
    background:#f5f3ff;
}

.status-printing{
    color:#1d4ed8;
    background:#eff6ff;
}

.status-ready{
    color:#0e7490;
    background:#ecfeff;
}

.status-completed{
    color:#15803d;
    background:#f0fdf4;
}

.status-cancelled{
    color:#b91c1c;
    background:#fef2f2;
}

.file-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.file-btn{
    border:0;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
}

.view-btn{
    background:#e0e7ff;
    color:#3730a3;
}

.download-btn{
    background:#dcfce7;
    color:#166534;
}

.file-btn:hover{
    opacity:.85;
}

.no-file{
    color:#9ca3af;
}

.email-status{
    font-size:11px;
    margin-top:5px;
}

.email-sending{
    color:#d97706;
}

.email-success{
    color:#15803d;
}

.email-failed{
    color:#dc2626;
}

.loading,
.empty{
    text-align:center;
    padding:40px;
    color:#6b7280;
}

@media(max-width:1000px){

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .cards{
        grid-template-columns:1fr;
    }

    .container{
        width:94%;
    }

    .section{
        padding:15px;
    }

    .search-box{
        width:100%;
    }

}

</style>

</head>


<body>

<header class="topbar">

    <div>

        <h1>🖨️ AviPrint Admin Panel</h1>

        <div
            class="admin-info"
            id="adminInfo">
            Checking admin session...
        </div>

    </div>

    <button
        class="logout-btn"
        id="logoutButton">

        Logout

    </button>

</header>


<main class="container">


    <div
        id="successMessage"
        class="message success">
    </div>


    <div
        id="errorMessage"
        class="message error">
    </div>


    <!-- COUNTERS -->

    <div class="cards">

        <div class="card">

            <h3>Total Orders</h3>

            <div
                id="totalOrders"
                class="number blue">
                0
            </div>

        </div>


        <div class="card">

            <h3>Pending Orders</h3>

            <div
                id="pendingOrders"
                class="number orange">
                0
            </div>

        </div>


        <div class="card">

            <h3>Processing / Printing</h3>

            <div
                id="processingOrders"
                class="number purple">
                0
            </div>

        </div>


        <div class="card">

            <h3>Completed Orders</h3>

            <div
                id="completedOrders"
                class="number green">
                0
            </div>

        </div>

    </div>


    <!-- ORDERS -->

    <section class="section">

        <div class="section-header">

            <h2>
                📦 Customer Orders
            </h2>


            <div class="actions">

                <input
                    type="text"
                    id="searchInput"
                    class="search-box"
                    placeholder="Search name, email or order ID...">


                <button
                    class="refresh-btn"
                    id="refreshButton">

                    🔄 Refresh

                </button>

            </div>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>Order ID</th>

                        <th>Customer</th>

                        <th>Email</th>

                        <th>Service</th>

                        <th>Details</th>

                        <th>Quantity</th>

                        <th>Amount</th>

                        <th>File</th>

                        <th>Status</th>

                        <th>Date</th>

                    </tr>

                </thead>


                <tbody id="ordersTableBody">

                    <tr>

                        <td
                            colspan="10"
                            class="loading">

                            Loading orders...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>


<script>

/* =====================================================
   CONFIG
===================================================== */

const SUPABASE_URL =
    "https://pmqmewceqnxsvlhceeef.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_mWPszaFzSHbPp-OHlPGWjw_JdrMU6oQ";


const ADMIN_EMAIL =
    "aviinformatics@gmail.com";


const EDGE_FUNCTION_NAME =
    "smart-service";


const STORAGE_BUCKET =
    "print-files";


/* =====================================================
   SUPABASE CLIENT
===================================================== */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   GLOBAL ORDERS
===================================================== */

let allOrders = [];


/* =====================================================
   PAGE LOAD
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        document
            .getElementById("logoutButton")
            .addEventListener(
                "click",
                logout
            );


        document
            .getElementById("refreshButton")
            .addEventListener(
                "click",
                loadOrders
            );


        document
            .getElementById("searchInput")
            .addEventListener(
                "input",
                filterOrders
            );


        await checkAdmin();

    }
);


/* =====================================================
   CHECK ADMIN
===================================================== */

async function checkAdmin(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getSession();


        if(error){

            throw error;

        }


        const session =
            data.session;


        if(
            !session ||
            !session.user
        ){

            window.location.href =
                "login.html";

            return;

        }


        const email =
            session.user.email || "";


        if(
            email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
        ){

            alert(
                "Access denied. Admin account required."
            );


            await supabaseClient
                .auth
                .signOut();


            window.location.href =
                "login.html";

            return;

        }


        document
            .getElementById("adminInfo")
            .textContent =
                "Logged in as Admin: " + email;


        await loadOrders();

    }

    catch(error){

        console.error(
            "Admin check error:",
            error
        );


        showError(
            error.message ||
            "Unable to verify admin."
        );

    }

}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

    const tbody =
        document.getElementById(
            "ordersTableBody"
        );


    tbody.innerHTML = `
        <tr>
            <td colspan="10" class="loading">
                Loading orders...
            </td>
        </tr>
    `;


    hideMessages();


    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){

            throw error;

        }


        allOrders =
            data || [];


        updateCounters(
            allOrders
        );


        renderOrders(
            allOrders
        );

    }

    catch(error){

        console.error(
            "Load orders error:",
            error
        );


        tbody.innerHTML = `
            <tr>
                <td colspan="10" class="empty">
                    Failed to load orders.
                </td>
            </tr>
        `;


        showError(
            "Failed to load orders: " +
            (error.message || error)
        );

    }

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(
    orders
){

    const tbody =
        document.getElementById(
            "ordersTableBody"
        );


    if(
        !orders ||
        orders.length === 0
    ){

        tbody.innerHTML = `
            <tr>
                <td colspan="10" class="empty">
                    No orders found.
                </td>
            </tr>
        `;

        return;

    }


    tbody.innerHTML = "";


    orders.forEach(
        function(order){

            tbody.appendChild(
                createOrderRow(order)
            );

        }
    );

}


/* =====================================================
   CREATE ORDER ROW
===================================================== */

function createOrderRow(
    order
){

    const tr =
        document.createElement("tr");


    const orderId =
        String(order.id || "");


    const orderNumber =
        String(
            order.order_number ||
            order.id ||
            "-"
        );


    /*
       Your current orders table has customer_email,
       but no customer_name column.

       So we use the part before @ as a fallback name.
       Later, if customer_name is added, it will
       automatically be used.
    */

    const email =
        String(
            order.customer_email ||
            order.user_email ||
            order.email ||
            "-"
        );


    const customerName =
        String(
            order.customer_name ||
            order.full_name ||
            order.name ||
            getCustomerNameFromEmail(email)
        );


    const service =
        String(
            order.service_name ||
            order.service ||
            "-"
        );


    const details =
        String(
            order.service_details ||
            "-"
        );


    const quantity =
        String(
            order.quantity ||
            1
        );


    const amount =
        order.amount !== null &&
        order.amount !== undefined
            ? "₹" +
              Number(order.amount)
                .toFixed(2)
            : "-";


    const status =
        String(
            order.status ||
            "pending"
        ).toLowerCase();


    const filePath =
        String(
            order.file_path ||
            ""
        );


    const fileName =
        String(
            order.file_name ||
            ""
        );


    const createdAt =
        order.created_at ||
        order.order_date ||
        "";


    tr.innerHTML = `

        <td>

            <span class="order-id">
                ${escapeHTML(orderNumber)}
            </span>

        </td>


        <td>

            <span class="customer-name">
                ${escapeHTML(customerName)}
            </span>

        </td>


        <td>

            <span class="customer-email">
                ${escapeHTML(email)}
            </span>

            <div
                id="email-status-${escapeHTML(orderId)}"
                class="email-status">
            </div>

        </td>


        <td>

            <span class="service">
                ${escapeHTML(service)}
            </span>

        </td>


        <td>

            <div class="details">
                ${escapeHTML(details)}
            </div>

        </td>


        <td class="quantity">

            ${escapeHTML(quantity)}

        </td>


        <td class="amount">

            ${escapeHTML(amount)}

        </td>


        <td>

            ${
                filePath
                ?
                `
                <div class="file-actions">

                    <button
                        class="file-btn view-btn"
                        onclick="viewFile(
                            '${escapeJS(filePath)}'
                        )">

                        👁 View

                    </button>


                    <button
                        class="file-btn download-btn"
                        onclick="downloadFile(
                            '${escapeJS(filePath)}',
                            '${escapeJS(fileName || "file")}'
                        )">

                        ⬇ Download

                    </button>

                </div>
                `
                :
                `<span class="no-file">No file</span>`
            }

        </td>


        <td>

            <select
                class="status-select ${getStatusClass(status)}"
                data-old-status="${escapeHTML(status)}"
                onchange="changeOrderStatus(
                    '${escapeJS(orderId)}',
                    this.value,
                    this
                )">

                <option
                    value="pending"
                    ${status === "pending" ? "selected" : ""}>
                    Pending
                </option>

                <option
                    value="processing"
                    ${status === "processing" ? "selected" : ""}>
                    Processing
                </option>

                <option
                    value="printing"
                    ${status === "printing" ? "selected" : ""}>
                    Printing
                </option>

                <option
                    value="ready"
                    ${status === "ready" ? "selected" : ""}>
                    Ready
                </option>

                <option
                    value="completed"
                    ${status === "completed" ? "selected" : ""}>
                    Completed
                </option>

                <option
                    value="cancelled"
                    ${status === "cancelled" ? "selected" : ""}>
                    Cancelled
                </option>

            </select>

        </td>


        <td class="date">

            ${escapeHTML(
                formatDate(createdAt)
            )}

        </td>

    `;


    return tr;

}


/* =====================================================
   CUSTOMER NAME FROM EMAIL
===================================================== */

function getCustomerNameFromEmail(
    email
){

    if(
        !email ||
        email === "-"
    ){

        return "Customer";

    }


    const username =
        email.split("@")[0];


    return username
        .replace(/[._-]+/g," ")
        .replace(/\b\w/g,
            function(letter){
                return letter.toUpperCase();
            }
        );

}


/* =====================================================
   SEARCH
===================================================== */

function filterOrders(){

    const search =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();


    if(!search){

        renderOrders(
            allOrders
        );

        return;

    }


    const filtered =
        allOrders.filter(
            function(order){

                const email =
                    String(
                        order.customer_email ||
                        order.user_email ||
                        order.email ||
                        ""
                    ).toLowerCase();


                const name =
                    String(
                        order.customer_name ||
                        order.full_name ||
                        order.name ||
                        getCustomerNameFromEmail(email)
                    ).toLowerCase();


                const orderNumber =
                    String(
                        order.order_number ||
                        ""
                    ).toLowerCase();


                return (
                    name.includes(search) ||
                    email.includes(search) ||
                    orderNumber.includes(search)
                );

            }
        );


    renderOrders(
        filtered
    );

}


/* =====================================================
   CHANGE ORDER STATUS
===================================================== */

async function changeOrderStatus(
    orderId,
    newStatus,
    selectElement
){

    const oldStatus =
        selectElement.dataset.oldStatus ||
        "pending";


    const order =
        allOrders.find(
            function(item){
                return String(item.id) ===
                    String(orderId);
            }
        );


    if(!order){

        showError(
            "Order not found."
        );

        selectElement.value =
            oldStatus;

        return;

    }


    selectElement.disabled =
        true;


    hideMessages();


    try{

        /*
           STEP 1
           Update database
        */

        const {
            error
        } =
        await supabaseClient
            .from("orders")
            .update({
                status:newStatus
            })
            .eq(
                "id",
                orderId
            );


        if(error){

            throw error;

        }


        /*
           Update local order
        */

        order.status =
            newStatus;


        selectElement.dataset.oldStatus =
            newStatus;


        selectElement.className =
            "status-select " +
            getStatusClass(newStatus);


        showSuccess(
            "Order " +
            (
                order.order_number ||
                orderId
            ) +
            " updated to " +
            newStatus +
            "."
        );


        /*
           STEP 2
           Send customer email
        */

        const customerEmail =
            order.customer_email ||
            order.user_email ||
            order.email ||
            "";


        if(
            customerEmail &&
            customerEmail !== "-"
        ){

            setEmailStatus(
                orderId,
                "Sending email...",
                "email-sending"
            );


            try{

                await sendOrderEmail(
                    order,
                    newStatus
                );


                setEmailStatus(
                    orderId,
                    "✓ Email sent",
                    "email-success"
                );

            }

            catch(emailError){

                console.error(
                    "Email error:",
                    emailError
                );


                setEmailStatus(
                    orderId,
                    "✗ Email failed",
                    "email-failed"
                );


                showError(
                    "Order updated, but customer email failed: " +
                    (
                        emailError.message ||
                        "Email service error"
                    )
                );

            }

        }

        else{

            setEmailStatus(
                orderId,
                "No email available",
                "email-failed"
            );

        }


        updateCounters(
            allOrders
        );

    }

    catch(error){

        console.error(
            "Status update error:",
            error
        );


        selectElement.value =
            oldStatus;


        selectElement.className =
            "status-select " +
            getStatusClass(oldStatus);


        showError(
            "Failed to update order status: " +
            (
                error.message ||
                error
            )
        );

    }

    finally{

        selectElement.disabled =
            false;

    }

}


/* =====================================================
   SEND ORDER EMAIL
===================================================== */

async function sendOrderEmail(
    order,
    status
){

    const email =
        order.customer_email ||
        order.user_email ||
        order.email ||
        "";


    if(!email){

        throw new Error(
            "Customer email is missing."
        );

    }


    const payload = {

        email:email,

        orderNumber:
            order.order_number || "-",

        customerName:
            order.customer_name ||
            order.full_name ||
            order.name ||
            getCustomerNameFromEmail(email),

        service:
            order.service_name ||
            "-",

        details:
            order.service_details ||
            "-",

        amount:
            order.amount !== null &&
            order.amount !== undefined
                ? "₹" +
                  Number(order.amount)
                    .toFixed(2)
                : "₹0.00",

        status:
            capitalize(status),

        fileName:
            order.file_name ||
            "-"

    };


    console.log(
        "Calling Edge Function:",
        EDGE_FUNCTION_NAME,
        payload
    );


    const {
        data,
        error
    } =
    await supabaseClient
        .functions
        .invoke(
            EDGE_FUNCTION_NAME,
            {
                body:payload
            }
        );


    console.log(
        "Edge Function result:",
        data,
        error
    );


    if(error){

        let message =
            error.message ||
            "Failed to call Edge Function.";


        /*
           Try to read server error body
        */

        if(
            error.context &&
            typeof error.context.json ===
            "function"
        ){

            try{

                const serverError =
                    await error.context.json();


                if(
                    serverError.error
                ){

                    message =
                        serverError.error;

                }

                else if(
                    serverError.message
                ){

                    message =
                        serverError.message;

                }

            }

            catch(_){

                // Ignore JSON parsing error

            }

        }


        throw new Error(
            message
        );

    }


    if(
        data &&
        data.success === false
    ){

        throw new Error(
            data.error ||
            data.message ||
            "Email sending failed."
        );

    }


    return data;

}


/* =====================================================
   VIEW FILE
===================================================== */

async function viewFile(
    filePath
){

    if(!filePath){

        showError(
            "File path is missing."
        );

        return;

    }


    try{

        showSuccess(
            "Creating secure file link..."
        );


        const {
            data,
            error
        } =
        await supabaseClient
            .storage
            .from(STORAGE_BUCKET)
            .createSignedUrl(
                filePath,
                300
            );


        if(error){

            throw error;

        }


        if(
            !data ||
            !data.signedUrl
        ){

            throw new Error(
                "Could not create file URL."
            );

        }


        window.open(
            data.signedUrl,
            "_blank"
        );

    }

    catch(error){

        console.error(
            "View file error:",
            error
        );


        showError(
            "Unable to view file: " +
            (
                error.message ||
                error
            )
        );

    }

}


/* =====================================================
   DOWNLOAD FILE
===================================================== */

async function downloadFile(
    filePath,
    fileName
){

    if(!filePath){

        showError(
            "File path is missing."
        );

        return;

    }


    try{

        showSuccess(
            "Preparing download..."
        );


        const {
            data,
            error
        } =
        await supabaseClient
            .storage
            .from(STORAGE_BUCKET)
            .createSignedUrl(
                filePath,
                300,
                {
                    download:
                        fileName || true
                }
            );


        if(error){

            throw error;

        }


        if(
            !data ||
            !data.signedUrl
        ){

            throw new Error(
                "Could not create download URL."
            );

        }


        const link =
            document.createElement("a");


        link.href =
            data.signedUrl;


        link.target =
            "_blank";


        link.rel =
            "noopener";


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();

    }

    catch(error){

        console.error(
            "Download file error:",
            error
        );


        showError(
            "Unable to download file: " +
            (
                error.message ||
                error
            )
        );

    }

}


/* =====================================================
   COUNTERS
===================================================== */

function updateCounters(
    orders
){

    let pending = 0;

    let processing = 0;

    let completed = 0;


    orders.forEach(
        function(order){

            const status =
                String(
                    order.status || ""
                ).toLowerCase();


            if(
                status === "pending"
            ){

                pending++;

            }


            if(
                status === "processing" ||
                status === "printing" ||
                status === "ready"
            ){

                processing++;

            }


            if(
                status === "completed"
            ){

                completed++;

            }

        }
    );


    document
        .getElementById("totalOrders")
        .textContent =
            orders.length;


    document
        .getElementById("pendingOrders")
        .textContent =
            pending;


    document
        .getElementById("processingOrders")
        .textContent =
            processing;


    document
        .getElementById("completedOrders")
        .textContent =
            completed;

}


/* =====================================================
   EMAIL STATUS
===================================================== */

function setEmailStatus(
    orderId,
    message,
    className
){

    const element =
        document.getElementById(
            "email-status-" +
            orderId
        );

/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(
    status
){

    return (
        "status-" +
        String(status)
            .toLowerCase()
    );

}


/* =====================================================
   CAPITALIZE
===================================================== */

function capitalize(
    value
){

    const text =
        String(value || "");


    return text.charAt(0).toUpperCase() +
        text.slice(1);

}


/* =====================================================
   DATE
===================================================== */

function formatDate(
    value
){

    if(!value){

        return "-";

    }


    const date =
        new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return String(value);

    }


    return date.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(
    value
){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   JS ESCAPE
===================================================== */

function escapeJS(
    value
){

    return String(value)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,'\\"')
        .replace(/\n/g,"\\n")
        .replace(/\r/g,"\\r");

}


/* =====================================================
   MESSAGES
===================================================== */

function showSuccess(
    message
){

    const box =
        document.getElementById(
            "successMessage"
        );


    box.textContent =
        message;


    box.style.display =
        "block";


    setTimeout(
        function(){

            box.style.display =
                "none";

        },
        5000
    );

}


function showError(
    message
){

    const box =
        document.getElementById(
            "errorMessage"
        );


    box.textContent =
        message;


    box.style.display =
        "block";

}


function hideMessages(){

    document
        .getElementById("successMessage")
        .style.display =
            "none";


    document
        .getElementById("errorMessage")
        .style.display =
            "none";

}
