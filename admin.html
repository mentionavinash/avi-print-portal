<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AviPrint Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
    color:#111827;
}

/* =========================
   TOPBAR
========================= */

.topbar{
    background:#111827;
    color:white;
    padding:18px 25px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;
    flex-wrap:wrap;
}

.topbar h1{
    font-size:22px;
}

.admin-info{
    margin-top:5px;
    font-size:13px;
    color:#d1d5db;
}

.logout-btn{
    background:#ef4444;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.logout-btn:hover{
    background:#dc2626;
}

/* =========================
   CONTAINER
========================= */

.container{
    width:95%;
    max-width:1500px;
    margin:25px auto;
}

/* =========================
   MESSAGES
========================= */

.message{
    display:none;
    padding:14px 18px;
    border-radius:8px;
    margin-bottom:20px;
    font-size:14px;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

/* =========================
   CARDS
========================= */

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:22px;
    border-radius:12px;

    box-shadow:
    0 2px 10px rgba(0,0,0,.07);
}

.card h3{
    font-size:14px;
    color:#6b7280;
    margin-bottom:10px;
}

.number{
    font-size:30px;
    font-weight:bold;
}

.blue{
    color:#2563eb;
}

.orange{
    color:#d97706;
}

.purple{
    color:#7c3aed;
}

.green{
    color:#16a34a;
}

/* =========================
   SECTION
========================= */

.section{
    background:white;
    border-radius:12px;
    padding:22px;

    box-shadow:
    0 2px 10px rgba(0,0,0,.07);
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;

    margin-bottom:20px;
}

.section-header h2{
    font-size:20px;
}

.refresh-btn{
    background:#2563eb;
    color:white;
    border:none;

    padding:10px 17px;

    border-radius:7px;

    cursor:pointer;
    font-weight:bold;
}

.refresh-btn:hover{
    background:#1d4ed8;
}

/* =========================
   SEARCH
========================= */

.search-area{
    margin-bottom:20px;
}

.search-input{
    width:100%;
    height:48px;

    border:
    1px solid #d1d5db;

    border-radius:9px;

    padding:
    0 16px;

    font-size:14px;

    outline:none;
}

.search-input:focus{
    border-color:#2563eb;

    box-shadow:
    0 0 0 3px
    rgba(37,99,235,.1);
}

.search-info{
    margin-top:7px;
    color:#6b7280;
    font-size:12px;
}

/* =========================
   TABLE
========================= */

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1250px;
    border-collapse:collapse;
}

th{
    background:#f3f4f6;

    text-align:left;

    padding:13px;

    font-size:13px;

    white-space:nowrap;
}

td{
    padding:13px;

    border-bottom:
    1px solid #e5e7eb;

    font-size:13px;

    vertical-align:middle;
}

tr:hover{
    background:#fafafa;
}

/* =========================
   ORDER
========================= */

.order-id{
    color:#2563eb;
    font-weight:bold;
}

.customer-name{
    font-weight:bold;
    color:#111827;
}

.email{
    color:#374151;
    word-break:break-word;
}

.service{
    font-weight:600;
}

.details{
    color:#4b5563;
    max-width:220px;
    line-height:1.4;
}

.amount{
    font-weight:bold;
    color:#15803d;
    white-space:nowrap;
}

.file-name{
    max-width:200px;
    word-break:break-word;
    color:#374151;
}

.date{
    color:#6b7280;
    white-space:nowrap;
}

/* =========================
   STATUS
========================= */

select{
    padding:8px 10px;

    border:
    1px solid #d1d5db;

    border-radius:6px;

    background:white;

    cursor:pointer;

    min-width:130px;
}

select:disabled{
    opacity:.6;
    cursor:wait;
}

.status-pending{
    color:#c2410c;
    background:#fff7ed;
}

.status-processing{
    color:#6d28d9;
    background:#f5f3ff;
}

.status-printing{
    color:#1d4ed8;
    background:#eff6ff;
}

.status-ready{
    color:#0e7490;
    background:#ecfeff;
}

.status-completed{
    color:#15803d;
    background:#f0fdf4;
}

.status-cancelled{
    color:#b91c1c;
    background:#fef2f2;
}

/* =========================
   FILE BUTTONS
========================= */

.file-buttons{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.file-btn{
    border:none;
    border-radius:6px;

    padding:8px 10px;

    cursor:pointer;

    font-size:12px;
    font-weight:bold;

    white-space:nowrap;
}

.view-btn{
    background:#eff6ff;
    color:#1d4ed8;
}

.view-btn:hover{
    background:#dbeafe;
}

.download-btn{
    background:#f0fdf4;
    color:#15803d;
}

.download-btn:hover{
    background:#dcfce7;
}

.file-btn:disabled{
    opacity:.6;
    cursor:wait;
}

/* =========================
   EMAIL STATUS
========================= */

.email-status{
    font-size:11px;
    margin-top:5px;
}

.email-sending{
    color:#d97706;
}

.email-success{
    color:#15803d;
}

.email-failed{
    color:#dc2626;
}

/* =========================
   LOADING EMPTY
========================= */

.loading,
.empty{
    text-align:center;
    padding:40px;
    color:#6b7280;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px){

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .cards{
        grid-template-columns:1fr;
    }

    .container{
        width:94%;
    }

    .section{
        padding:15px;
    }

    .topbar{
        padding:15px;
    }

}

</style>

</head>

<!-- =========================

<!-- =========================

<section class="section">


<div class="section-header">

<div class="search-area">

    <input

    <div
        id="searchInfo"

<!-- TABLE -->

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>
Order ID
</th>

<th>
Customer Name
</th>

<th>
Email
</th>

<th>
Service
</th>

<th>
Details
</th>

<th>
Amount

<th>
File
</th>

<td
colspan="9"
class="loading">

</main>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://pmqmewceqnxsvlhceeef.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_mWPszaFzSHbPp-OHlPGWjw_JdrMU6oQ";


/* =========================================================
   ADMIN
========================================================= */

const ADMIN_EMAIL =
    "aviinformatics@gmail.com";


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_BUCKET =
    "print-files";


/* =========================================================
   EDGE FUNCTION
========================================================= */

const EDGE_FUNCTION_NAME =
    "dynamic-function";


/* =========================================================
   SUPABASE CLIENT
========================================================= */

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   GLOBAL ORDERS
========================================================= */

let allOrders = [];


/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        setupSearch();

        await checkAdmin();

    }
);


/* =========================================================
   CHECK ADMIN
========================================================= */

async function checkAdmin(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .auth
        .getSession();


        if(error){

            throw error;

        }


        const session =
            data.session;


        if(
            !session ||
            !session.user
        ){

            window.location.href =
                "login.html";

            return;

        }


        const email =
            session.user.email || "";


        if(
            email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
        ){

            alert(
                "Access denied. Admin account required."
            );


            await supabaseClient
                .auth
                .signOut();


            window.location.href =
                "login.html";

            return;

        }


        document.getElementById(
            "adminInfo"
        ).textContent =
            "Logged in as Admin: " + email;


        await loadOrders();

    }

    catch(error){

        console.error(
            "Admin check error:",
            error
        );


        showError(
            error.message ||
            "Unable to verify admin."
        );

    }

}


/* =========================================================
   LOAD ORDERS
========================================================= */

async function loadOrders(){

    const tbody =
        document.getElementById(
            "ordersTableBody"
        );


    tbody.innerHTML = `
        <tr>
            <td colspan="9" class="loading">
                Loading orders...
            </td>
        </tr>
    `;


    hideMessages();


    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .from("orders")
        .select(`
            id,
            order_number,
            user_id,
            customer_name,
            customer_email,
            service_name,
            service_details,
            order_date,
            status,
            amount,
            file_path,
            file_name,
            created_at
        `)
        .order(
            "created_at",
            {
                ascending:false
            }
        );


        if(error){

            throw error;

        }


        allOrders =
            data || [];


        updateCounters(
            allOrders
        );


        renderOrders(
            allOrders
        );

    }

    catch(error){

        console.error(
            "Load orders error:",
            error
        );


        tbody.innerHTML = `
            <tr>
                <td colspan="9" class="empty">
                    Failed to load orders.
                </td>
            </tr>
        `;


        showError(
            "Failed to load orders: " +
            (
                error.message ||
                error
            )
        );

    }

}


/* =========================================================
   RENDER ORDERS
========================================================= */

function renderOrders(
    orders
){

    const tbody =
        document.getElementById(
            "ordersTableBody"
        );


    if(!orders.length){

        tbody.innerHTML = `
            <tr>
                <td
                    colspan="9"
                    class="empty">

                    No orders found.

                </td>
            </tr>
        `;

        updateSearchInfo(0);

        return;

    }


    tbody.innerHTML = "";


    orders.forEach(
        function(order){

            tbody.appendChild(
                createOrderRow(order)
            );

        }
    );


    updateSearchInfo(
        orders.length
    );

}


/* =========================================================
   CREATE ORDER ROW
========================================================= */

function createOrderRow(
    order
){

    const tr =
        document.createElement("tr");


    const orderId =
        order.id || "";


    const orderNumber =
        order.order_number ||
        orderId ||
        "-";


    const customerName =
        order.customer_name ||
        "Customer";


    const email =
        order.customer_email ||
        "-";


    const service =
        order.service_name ||
        "-";


    const details =
        order.service_details ||
        "-";


    const amount =
        order.amount !== null &&
        order.amount !== undefined
            ? "₹" +
              Number(order.amount)
              .toFixed(2)
            : "₹0.00";


    const fileName =
        order.file_name ||
        "-";


    const filePath =
        order.file_path ||
        "";


    const status =
        String(
            order.status ||
            "pending"
        ).toLowerCase();


    const date =
        order.order_date ||
        order.created_at ||
        "";


    tr.dataset.orderId =
        orderId;


    tr.dataset.orderNumber =
        orderNumber;


    tr.dataset.customerName =
        customerName;


    tr.dataset.email =
        email;


    tr.dataset.service =
        service;


    tr.dataset.details =
        details;


    tr.dataset.amount =
        amount;


    tr.dataset.fileName =
        fileName;


    tr.dataset.filePath =
        filePath;


    tr.innerHTML = `

        <td>

            <span class="order-id">

                ${escapeHTML(
                    String(orderNumber)
                )}

            </span>

        </td>


        <td>

            <span class="customer-name">

                ${escapeHTML(
                    String(customerName)
                )}

            </span>

        </td>


        <td>

            <span class="email">

                ${escapeHTML(
                    String(email)
                )}

            </span>


            <div
                id="email-status-${escapeHTML(
                    String(orderId)
                )}"
                class="email-status">

            </div>

        </td>


        <td>

            <span class="service">

                ${escapeHTML(
                    String(service)
                )}

            </span>

        </td>


        <td>

            <div class="details">

                ${escapeHTML(
                    String(details)
                )}

            </div>

        </td>


        <td>

            <span class="amount">

                ${escapeHTML(
                    String(amount)
                )}

            </span>

        </td>


        <td>

            ${
                filePath
                ?
                `
                <div class="file-buttons">

                    <button
                        class="file-btn view-btn"
                        onclick="viewFile(
                            '${escapeJS(filePath)}',
                            this
                        )">

                        👁 View

                    </button>


                    <button
                        class="file-btn download-btn"
                        onclick="downloadFile(
                            '${escapeJS(filePath)}',
                            '${escapeJS(fileName)}',
                            this
                        )">

                        ⬇ Download

                    </button>

                </div>
                `
                :
                `
                <span
                    style="color:#9ca3af;">

                    No file

                </span>
                `
            }

        </td>


        <td>

            <select
                class="${getStatusClass(status)}"
                data-old-status="${escapeHTML(status)}"
                onchange="changeOrderStatus(
                    '${escapeJS(orderId)}',
                    this.value,
                    this
                )">

                <option
                    value="pending"
                    ${status === "pending" ? "selected" : ""}>
                    Pending
                </option>

                <option
                    value="processing"
                    ${status === "processing" ? "selected" : ""}>
                    Processing
                </option>

                <option
                    value="printing"
                    ${status === "printing" ? "selected" : ""}>
                    Printing
                </option>

                <option
                    value="ready"
                    ${status === "ready" ? "selected" : ""}>
                    Ready
                </option>

                <option
                    value="completed"
                    ${status === "completed" ? "selected" : ""}>
                    Completed
                </option>

                <option
                    value="cancelled"
                    ${status === "cancelled" ? "selected" : ""}>
                    Cancelled
                </option>

            </select>

        </td>


        <td class="date">

            ${escapeHTML(
                formatDate(date)
            )}

        </td>

    `;


    return tr;

}


/* =========================================================
   VIEW FILE
========================================================= */

async function viewFile(
    filePath,
    button
){

    if(!filePath){

        showError(
            "File path is missing."
        );

        return;

    }


    button.disabled =
        true;

    button.textContent =
        "Opening...";


    try{

        /*
         * Create signed URL.
         *
         * This works with a private bucket
         * when the logged-in user has the
         * required Storage permissions.
         */

        const {
            data,
            error
        } =
        await supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .createSignedUrl(
            filePath,
            3600
        );


        if(error){

            throw error;

        }


        if(
            !data ||
            !data.signedUrl
        ){

            throw new Error(
                "Unable to create file URL."
            );

        }


        window.open(
            data.signedUrl,
            "_blank"
        );

    }

    catch(error){

        console.error(
            "View file error:",
            error
        );


        showError(
            "Unable to view file: " +
            (
                error.message ||
                error
            )
        );

    }

    finally{

        button.disabled =
            false;

        button.textContent =
            "👁 View";

    }

}


/* =========================================================
   DOWNLOAD FILE
========================================================= */

async function downloadFile(
    filePath,
    fileName,
    button
){

    if(!filePath){

        showError(
            "File path is missing."
        );

        return;

    }


    button.disabled =
        true;

    button.textContent =
        "Downloading...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .download(
            filePath
        );


        if(error){

            throw error;

        }


        if(!data){

            throw new Error(
                "File could not be downloaded."
            );

        }


        const blobUrl =
            URL.createObjectURL(data);


        const a =
            document.createElement("a");


        a.href =
            blobUrl;


        a.download =
            fileName ||
            "AviPrint-file";


        document.body.appendChild(a);


        a.click();


        a.remove();


        setTimeout(
            function(){

                URL.revokeObjectURL(
                    blobUrl
                );

            },
            1000
        );


    }

    catch(error){

        console.error(
            "Download file error:",
            error
        );


        showError(
            "Unable to download file: " +
            (
                error.message ||
                error
            )
        );

    }

    finally{

        button.disabled =
            false;

        button.textContent =
            "⬇ Download";

    }

}


/* =========================================================
   CHANGE STATUS
========================================================= */

async function changeOrderStatus(
    orderId,
    newStatus,
    selectElement
){

    if(!orderId){

        showError(
            "Order ID is missing."
        );

        return;

    }


    const oldStatus =
        selectElement.dataset.oldStatus ||
        "pending";


    const row =
        selectElement.closest("tr");


    const orderNumber =
        row.dataset.orderNumber ||
        orderId;


    const customerName =
        row.dataset.customerName ||
        "Customer";


    const customerEmail =
        row.dataset.email ||
        "";


    const service =
        row.dataset.service ||
        "-";


    const details =
        row.dataset.details ||
        "-";


    const amount =
        row.dataset.amount ||
        "₹0.00";


    const fileName =
        row.dataset.fileName ||
        "-";


    selectElement.disabled =
        true;


    hideMessages();


    try{

        /* =========================
           UPDATE DATABASE
        ========================= */

        const {
            error
        } =
        await supabaseClient
        .from("orders")
        .update({
            status:newStatus
        })
        .eq(
            "id",
            orderId
        );


        if(error){

            throw error;

        }


        selectElement.dataset.oldStatus =
            newStatus;


        selectElement.className =
            getStatusClass(
                newStatus
            );


        showSuccess(
            "Order " +
            orderNumber +
            " updated to " +
            newStatus +
            "."
        );


        /* =========================
           SEND EMAIL
        ========================= */

        if(
            customerEmail &&
            customerEmail !== "-"
        ){

            setEmailStatus(
                orderId,
                "Sending email...",
                "email-sending"
            );


            try{

                await sendOrderEmail({

                    email:
                        customerEmail,

                    orderNumber:
                        orderNumber,

                    customerName:
                        customerName,

                    service:
                        service,

                    details:
                        details,

                    amount:
                        amount,

                    status:
                        capitalizeStatus(
                            newStatus
                        ),

                    fileName:
                        fileName,

                    orderId:
                        orderId

                });


                setEmailStatus(
                    orderId,
                    "✓ Email sent",
                    "email-success"
                );

            }

            catch(emailError){

                console.error(
                    "Email failed:",
                    emailError
                );


                setEmailStatus(
                    orderId,
                    "✗ Email failed",
                    "email-failed"
                );


                showError(
                    "Order updated, but customer email failed: " +
                    (
                        emailError.message ||
                        "Email service error"
                    )
                );

            }

        }

        else{

            setEmailStatus(
                orderId,
                "No email available",
                "email-failed"
            );

        }


        await loadCounters();

    }

    catch(error){

        console.error(
            "Status update error:",
            error
        );


        selectElement.value =
            oldStatus;


        selectElement.className =
            getStatusClass(
                oldStatus
            );


        showError(
            "Failed to update order status: " +
            (
                error.message ||
                error
            )
        );

    }

    finally{

        selectElement.disabled =
            false;

    }

}


/* =========================================================
   SEND ORDER EMAIL
========================================================= */

async function sendOrderEmail(
    orderData
){

    console.log(
        "Sending order email...",
        orderData
    );


    /*
     * Try the current dynamic-function first.
     */

    const {
        data,
        error
    } =
    await supabaseClient
    .functions
    .invoke(
        EDGE_FUNCTION_NAME,
        {
            body:orderData
        }
    );


    console.log(
        "Edge Function response:",
        data,
        error
    );


    if(error){

        throw new Error(
            error.message ||
            "Failed to send email."
        );

    }


    if(
        data &&
        data.success === false
    ){

        throw new Error(
            data.error ||
            data.message ||
            "Email sending failed."
        );

    }


    return data;

}


/* =========================================================
   LOAD COUNTERS
========================================================= */

async function loadCounters(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .from("orders")
        .select("status");


        if(error){

            console.error(
                error
            );

            return;

        }


        updateCounters(
            data || []
        );

    }

    catch(error){

        console.error(
            "Counter error:",
            error
        );

    }

}


/* =========================================================
   COUNTERS
========================================================= */

function updateCounters(
    orders
){

    let pending =
        0;

    let processing =
        0;

    let completed =
        0;


    orders.forEach(
        function(order){

            const status =
                String(
                    order.status ||
                    ""
                ).toLowerCase();


            if(
                status === "pending"
            ){

                pending++;

            }


            if(
                status === "processing" ||
                status === "printing" ||
                status === "ready"
            ){

                processing++;

            }


            if(
                status === "completed"
            ){

                completed++;

            }

        }
    );


    document.getElementById(
        "totalOrders"
    ).textContent =
        orders.length;


    document.getElementById(
        "pendingOrders"
    ).textContent =
        pending;


    document.getElementById(
        "processingOrders"
    ).textContent =
        processing;


    document.getElementById(
        "completedOrders"
    ).textContent =
        completed;

}


/* =========================================================
   SEARCH
========================================================= */

function setupSearch(){

    const searchInput =
        document.getElementById(
            "searchInput"
        );


    searchInput.addEventListener(
        "input",
        function(){

            const search =
                searchInput.value
                .trim()
                .toLowerCase();


            if(!search){

                renderOrders(
                    allOrders
                );

                return;

            }


            const filtered =
                allOrders.filter(
                    function(order){

                        const name =
                            String(
                                order.customer_name ||
                                ""
                            ).toLowerCase();


                        const email =
                            String(
                                order.customer_email ||
                                ""
                            ).toLowerCase();


                        const orderNumber =
                            String(
                                order.order_number ||
                                ""
                            ).toLowerCase();


                        return (
                            name.includes(search) ||
                            email.includes(search) ||
                            orderNumber.includes(search)
                        );

                    }
                );


            renderOrders(
                filtered
            );

        }
    );

}


/* =========================================================
   SEARCH INFO
========================================================= */

function updateSearchInfo(
    count
){

    const search =
        document.getElementById(
            "searchInput"
        ).value.trim();


    const info =
        document.getElementById(
            "searchInfo"
        );


    if(search){

        info.textContent =
            "Found " +
            count +
            " matching order(s)";

    }

    else{

        info.textContent =
            "Showing all " +
            allOrders.length +
            " order(s)";

    }

}


/* =========================================================
   STATUS CLASS
========================================================= */

function getStatusClass(
    status
){

    return (
        "status-" +
        String(status)
        .toLowerCase()
    );

}


/* =========================================================
   CAPITALIZE STATUS
========================================================= */

function capitalizeStatus(
    status
){

    const value =
        String(status || "");


    return value
        .charAt(0)
        .toUpperCase() +
        value.slice(1);

}


/* =========================================================
   DATE
========================================================= */

function formatDate(
    value
){

    if(!value){

        return "-";

    }


    const date =
        new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return String(value);

    }


    return date.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   EMAIL STATUS
========================================================= */

function setEmailStatus(
    orderId,
    message,
    className
){

    const element =
        document.getElementById(
            "email-status-" +
            orderId
        );


    if(!element){

        return;

    }


    element.textContent =
        message;


    element.className =
        "email-status " +
        className;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   ESCAPE JS
========================================================= */

function escapeJS(
    value
){

    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        )

        .replace(
            /\n/g,
            "\\n"
        )

        .replace(
            /\r/g,
            "\\r"
        );

}


/* =========================================================
   SUCCESS
========================================================= */

function showSuccess(
    message
){

    const box =
        document.getElementById(
            "successMessage"
        );


    box.textContent =
        message;


    box.style.display =
        "block";


    setTimeout(
        function(){

            box.style.display =
                "none";

        },
        5000
    );

}


/* =========================================================
   ERROR
========================================================= */

function showError(
    message
){

    const box =
        document.getElementById(
            "errorMessage"
        );


    box.textContent =
        message;


    box.style.display =
        "block";

}


/* =========================================================
   HIDE MESSAGES
========================================================= */

function hideMessages(){

    document.getElementById(
        "successMessage"
    ).style.display =
        "none";


    document.getElementById(
        "errorMessage"
    ).style.display =
        "none";

}
