<select
    class="statusSelect"
    data-id="${order.order_id}"
>

    <option
        value="Pending"
        ${order.status === "Pending" ? "selected" : ""}>
        Pending
    </option>

    <option
        value="Processing"
        ${order.status === "Processing" ? "selected" : ""}>
        Processing
    </option>

    <option
        value="Completed"
        ${order.status === "Completed" ? "selected" : ""}>
        Completed
    </option>

    <option
        value="Cancelled"
        ${order.status === "Cancelled" ? "selected" : ""}>
        Cancelled
    </option>

</select>
