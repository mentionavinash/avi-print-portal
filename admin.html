<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AviPrint Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
    color:#111827;
}

.topbar{
    background:#111827;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.topbar h1{
    font-size:22px;
}

.admin-info{
    margin-top:5px;
    font-size:13px;
    color:#d1d5db;
}

.logout-btn{
    background:#ef4444;
    border:0;
    color:white;
    padding:10px 18px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.logout-btn:hover{
    background:#dc2626;
}

.container{
    width:95%;
    max-width:1500px;
    margin:25px auto;
}

.message{
    display:none;
    padding:14px 18px;
    border-radius:8px;
    margin-bottom:20px;
    font-size:14px;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:22px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.card h3{
    font-size:14px;
    color:#6b7280;
    margin-bottom:10px;
}

.number{
    font-size:30px;
    font-weight:bold;
}

.blue{color:#2563eb}
.orange{color:#d97706}
.purple{color:#7c3aed}
.green{color:#16a34a}

.section{
    background:white;
    border-radius:12px;
    padding:22px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.section-header h2{
    font-size:20px;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.search-box{
    width:300px;
    max-width:100%;
    height:42px;
    padding:0 14px;
    border:1px solid #d1d5db;
    border-radius:8px;
    outline:none;
    font-size:14px;
}

.search-box:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

.refresh-btn{
    background:#2563eb;
    border:0;
    color:white;
    padding:10px 17px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.refresh-btn:hover{
    background:#1d4ed8;
}

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1250px;
    border-collapse:collapse;
}

th{
    background:#f3f4f6;
    text-align:left;
    padding:13px;
    font-size:13px;
    white-space:nowrap;
}

td{
    padding:13px;
    border-bottom:1px solid #e5e7eb;
    font-size:13px;
    vertical-align:middle;
}

tr:hover{
    background:#fafafa;
}

.order-id{
    color:#2563eb;
    font-weight:bold;
    white-space:nowrap;
}

.customer-name{
    font-weight:bold;
}

.email{
    color:#374151;
    word-break:break-word;
}

.service{
    font-weight:600;
}

.quantity{
    text-align:center;
}

.date{
    color:#6b7280;
    white-space:nowrap;
}

.file-buttons{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.file-btn{
    border:0;
    border-radius:6px;
    padding:7px 10px;
    cursor:pointer;
    color:white;
    font-size:12px;
    font-weight:bold;
}

.view-btn{
    background:#7c3aed;
}

.view-btn:hover{
    background:#6d28d9;
}

.download-btn{
    background:#059669;
}

.download-btn:hover{
    background:#047857;
}

.file-name{
    display:block;
    margin-top:6px;
    color:#6b7280;
    font-size:11px;
    max-width:230px;
    word-break:break-word;
}

.no-file{
    color:#9ca3af;
}

select{
    padding:8px 10px;
    border:1px solid #d1d5db;
    border-radius:6px;
    background:white;
    cursor:pointer;
    min-width:130px;
}

select:disabled{
    opacity:.6;
    cursor:wait;
}

.status-pending{
    color:#c2410c;
    background:#fff7ed;
}

.status-processing{
    color:#6d28d9;
    background:#f5f3ff;
}

.status-printing{
    color:#1d4ed8;
    background:#eff6ff;
}

.status-ready{
    color:#0e7490;
    background:#ecfeff;
}

.status-completed{
    color:#15803d;
    background:#f0fdf4;
}

.status-cancelled{
    color:#b91c1c;
    background:#fef2f2;
}

.email-status{
    font-size:11px;
    margin-top:5px;
}

.email-sending{
    color:#d97706;
}

.email-success{
    color:#15803d;
}

.email-failed{
    color:#dc2626;
}

.loading,
.empty{
    text-align:center;
    padding:40px;
    color:#6b7280;
}

.result-count{
    color:#6b7280;
    font-size:13px;
    margin-bottom:12px;
}

/* FILE MODAL */

.modal{
    display:none;
    position:fixed;
    z-index:9999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.75);
    padding:25px;
}

.modal-content{
    width:100%;
    height:100%;
    max-width:1100px;
    margin:auto;
    background:white;
    border-radius:12px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.modal-header{
    background:#111827;
    color:white;
    padding:14px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.modal-header h3{
    font-size:16px;
}

.close-modal{
    background:#ef4444;
    border:0;
    color:white;
    width:35px;
    height:35px;
    border-radius:6px;
    cursor:pointer;
    font-size:20px;
}

.modal-body{
    flex:1;
    background:#f3f4f6;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
    overflow:auto;
}

.modal-body img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
}

.modal-body iframe{
    width:100%;
    height:100%;
    border:0;
}

.modal-body embed{
    width:100%;
    height:100%;
}

.file-loading{
    color:#6b7280;
}

/* RESPONSIVE */

@media(max-width:1000px){
    .cards{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .cards{
        grid-template-columns:1fr;
    }

    .container{
        width:94%;
    }

    .section{
        padding:15px;
    }

    .topbar{
        padding:15px;
    }

    .search-box{
        width:100%;
    }

    .controls{
        width:100%;
    }

    .refresh-btn{
        width:100%;
    }

    .modal{
        padding:10px;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <div>
        <h1>🖨️ AviPrint Admin Panel</h1>

        <div class="admin-info" id="adminInfo">
            Checking admin session...
        </div>
    </div>

    <button class="logout-btn" onclick="logout()">
        Logout
    </button>

</header>


<main class="container">

    <div id="successMessage" class="message success"></div>
    <div id="errorMessage" class="message error"></div>


    <!-- DASHBOARD -->

    <div class="cards">

        <div class="card">
            <h3>Total Orders</h3>
            <div id="totalOrders" class="number blue">0</div>
        </div>

        <div class="card">
            <h3>Pending Orders</h3>
            <div id="pendingOrders" class="number orange">0</div>
        </div>

        <div class="card">
            <h3>Processing / Printing</h3>
            <div id="processingOrders" class="number purple">0</div>
        </div>

        <div class="card">
            <h3>Completed Orders</h3>
            <div id="completedOrders" class="number green">0</div>
        </div>

    </div>


    <!-- ORDERS -->

    <section class="section">

        <div class="section-header">

            <h2>📦 Customer Orders</h2>

            <div class="controls">

                <input
                    type="search"
                    id="searchInput"
                    class="search-box"
                    placeholder="🔎 Search order, name or email..."
                >

                <button
                    class="refresh-btn"
                    onclick="loadOrders()">
                    🔄 Refresh
                </button>

            </div>

        </div>


        <div
            id="resultCount"
            class="result-count">
            Loading...
        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>Order ID</th>

                        <th>Customer</th>

                        <th>Email</th>

                        <th>Service</th>

                        <th>Quantity</th>

                        <th>File</th>

                        <th>Status</th>

                        <th>Date</th>

                    </tr>

                </thead>

                <tbody id="ordersTableBody">

                    <tr>
                        <td colspan="8" class="loading">
                            Loading orders...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>


<!-- FILE VIEW MODAL -->

<div id="fileModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h3 id="modalTitle">
                File Preview
            </h3>

            <button
                class="close-modal"
                onclick="closeFileModal()">
                ×
            </button>

        </div>

        <div
            id="modalBody"
            class="modal-body">

            <div class="file-loading">
                Loading file...
            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://pmqmewceqnxsvlhceeef.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_mWPszaFzSHbPp-OHlPGWjw_JdrMU6oQ";


/* =========================================================
   ADMIN
========================================================= */

const ADMIN_EMAIL =
    "aviinformatics@gmail.com";


/* =========================================================
   STORAGE BUCKET
========================================================= */

const STORAGE_BUCKET =
    "print-files";


/* =========================================================
   EMAIL FUNCTION
========================================================= */

const EDGE_FUNCTION_NAME =
    "smart-service";


/* =========================================================
   CREATE SUPABASE CLIENT
========================================================= */

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   GLOBAL ORDERS
========================================================= */

let allOrders = [];


/* =========================================================
   PAGE START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        document
            .getElementById("searchInput")
            .addEventListener(
                "input",
                filterOrders
            );

        await checkAdmin();

    }
);


/* =========================================================
   CHECK ADMIN
========================================================= */

async function checkAdmin(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();


        if(error){

            throw error;

        }


        const session =
            data.session;


        if(
            !session ||
            !session.user
        ){

            window.location.href =
                "login.html";

            return;

        }


        const email =
            session.user.email || "";


        if(
            email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
        ){

            alert(
                "Access denied. Admin account required."
            );

            await supabaseClient.auth.signOut();

            window.location.href =
                "login.html";

            return;

        }


        document.getElementById(
            "adminInfo"
        ).textContent =
            "Logged in as Admin: " + email;


        await loadOrders();

    }

    catch(error){

        console.error(
            "Admin check error:",
            error
        );

        showError(
            error.message ||
            "Unable to verify admin."
        );

    }

}


/* =========================================================
   LOAD ORDERS
========================================================= */

async function loadOrders(){

    const tbody =
        document.getElementById(
            "ordersTableBody"
        );


    tbody.innerHTML = `
        <tr>
            <td colspan="8" class="loading">
                Loading orders...
            </td>
        </tr>
    `;


    hideMessages();


    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){

            throw error;

        }


        allOrders =
            data || [];


        updateCounters(
            allOrders
        );


        renderOrders(
            allOrders
        );

    }

    catch(error){

        console.error(
            "Load orders error:",
            error
        );


        tbody.innerHTML = `
            <tr>
                <td colspan="8" class="empty">
                    Failed to load orders.
                </td>
            </tr>
        `;


        showError(
            "Failed to load orders: " +
            (
                error.message ||
                error
            )
        );

    }

}


/* =========================================================
   RENDER ORDERS
========================================================= */

function renderOrders(
    orders
){

    const tbody =
        document.getElementById(
            "ordersTableBody"
        );


    document.getElementById(
        "resultCount"
    ).textContent =
        "Showing " +
        orders.length +
        " of " +
        allOrders.length +
        " orders";


    if(
        orders.length === 0
    ){

        tbody.innerHTML = `
            <tr>
                <td colspan="8" class="empty">
                    No matching orders found.
                </td>
            </tr>
        `;

        return;

    }


    tbody.innerHTML = "";


    orders.forEach(
        function(order){

            tbody.appendChild(
                createOrderRow(order)
            );

        }
    );

}


/* =========================================================
   CREATE ORDER ROW
========================================================= */

function createOrderRow(
    order
){

    const tr =
        document.createElement("tr");


    const orderId =
        order.id || "";


    const orderNumber =
        order.order_number ||
        orderId;


    /*
     * CUSTOMER NAME
     *
     * Your current orders table does not
     * have a customer_name column.
     *
     * So we use:
     * customer_name
     * full_name
     * name
     * or email username.
     */

    let customerName =
        order.customer_name ||
        order.full_name ||
        order.name ||
        "";


    const email =
        order.customer_email ||
        order.user_email ||
        order.email ||
        "-";


    if(!customerName){

        if(
            email &&
            email !== "-"
        ){

            customerName =
                email.split("@")[0];

        }
        else{

            customerName =
                "Customer";

        }

    }


    const service =
        order.service_name ||
        order.service ||
        order.service_type ||
        "-";


    const quantity =
        order.quantity ||
        1;


    const status =
        String(
            order.status ||
            "pending"
        ).toLowerCase();


    const createdAt =
        order.created_at ||
        order.order_date ||
        order.date ||
        "";


    const filePath =
        order.file_path ||
        "";


    const fileName =
        order.file_name ||
        "";


    tr.dataset.orderId =
        orderId;

    tr.dataset.orderNumber =
        orderNumber;

    tr.dataset.customerName =
        customerName;

    tr.dataset.email =
        email;

    tr.dataset.service =
        service;

    tr.dataset.filePath =
        filePath;

    tr.dataset.fileName =
        fileName;


    /* =====================================================
       ORDER ID
    ===================================================== */

    const tdOrder =
        document.createElement("td");

    tdOrder.innerHTML = `
        <span class="order-id">
            ${escapeHTML(
                String(orderNumber)
            )}
        </span>
    `;


    /* =====================================================
       CUSTOMER
    ===================================================== */

    const tdCustomer =
        document.createElement("td");

    tdCustomer.innerHTML = `
        <span class="customer-name">
            ${escapeHTML(
                String(customerName)
            )}
        </span>
    `;


    /* =====================================================
       EMAIL
    ===================================================== */

    const tdEmail =
        document.createElement("td");

    tdEmail.innerHTML = `
        <span class="email">
            ${escapeHTML(
                String(email)
            )}
        </span>

        <div
            id="email-status-${escapeHTML(
                String(orderId)
            )}"
            class="email-status">
        </div>
    `;


    /* =====================================================
       SERVICE
    ===================================================== */

    const tdService =
        document.createElement("td");

    tdService.innerHTML = `
        <span class="service">
            ${escapeHTML(
                String(service)
            )}
        </span>
    `;


    /* =====================================================
       QUANTITY
    ===================================================== */

    const tdQuantity =
        document.createElement("td");

    tdQuantity.className =
        "quantity";

    tdQuantity.textContent =
        String(quantity);


    /* =====================================================
       FILE
    ===================================================== */

    const tdFile =
        document.createElement("td");


    if(filePath){

        const buttons =
            document.createElement("div");

        buttons.className =
            "file-buttons";


        const viewButton =
            document.createElement("button");

        viewButton.className =
            "file-btn view-btn";

        viewButton.textContent =
            "👁 View";


        viewButton.onclick =
            function(){

                viewFile(
                    filePath,
                    fileName ||
                    "Order File"
                );

            };


        const downloadButton =
            document.createElement("button");

        downloadButton.className =
            "file-btn download-btn";

        downloadButton.textContent =
            "⬇ Download";


        downloadButton.onclick =
            function(){

                downloadFile(
                    filePath,
                    fileName
                );

            };


        buttons.appendChild(
            viewButton
        );

        buttons.appendChild(
            downloadButton
        );


        tdFile.appendChild(
            buttons
        );


        if(fileName){

            const name =
                document.createElement(
                    "span"
                );

            name.className =
                "file-name";

            name.textContent =
                fileName;

            tdFile.appendChild(
                name
            );

        }

    }
    else{

        tdFile.innerHTML = `
            <span class="no-file">
                No file
            </span>
        `;

    }


    /* =====================================================
       STATUS
    ===================================================== */

    const tdStatus =
        document.createElement("td");


    const select =
        document.createElement("select");


    select.className =
        getStatusClass(status);


    select.dataset.oldStatus =
        status;


    const statuses = [
        "pending",
        "processing",
        "printing",
        "ready",
        "completed",
        "cancelled"
    ];


    statuses.forEach(
        function(item){

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                item;

            option.textContent =
                capitalize(item);

            if(
                item === status
            ){

                option.selected =
                    true;

            }

            select.appendChild(
                option
            );

        }
    );


    select.addEventListener(
        "change",
        function(){

            changeOrderStatus(
                orderId,
                this.value,
                this
            );

        }
    );


    tdStatus.appendChild(
        select
    );


    /* =====================================================
       DATE
    ===================================================== */

    const tdDate =
        document.createElement("td");

    tdDate.className =
        "date";

    tdDate.textContent =
        formatDate(createdAt);


    /* =====================================================
       APPEND
    ===================================================== */

    tr.appendChild(tdOrder);
    tr.appendChild(tdCustomer);
    tr.appendChild(tdEmail);
    tr.appendChild(tdService);
    tr.appendChild(tdQuantity);
    tr.appendChild(tdFile);
    tr.appendChild(tdStatus);
    tr.appendChild(tdDate);


    return tr;

}


/* =========================================================
   SEARCH
========================================================= */

function filterOrders(){

    const search =
        document
        .getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    if(!search){

        renderOrders(
            allOrders
        );

        return;

    }


    const filtered =
        allOrders.filter(
            function(order){

                const orderNumber =
                    String(
                        order.order_number ||
                        ""
                    ).toLowerCase();


                const customerName =
                    String(
                        order.customer_name ||
                        order.full_name ||
                        order.name ||
                        ""
                    ).toLowerCase();


                const email =
                    String(
                        order.customer_email ||
                        order.user_email ||
                        order.email ||
                        ""
                    ).toLowerCase();


                return (
                    orderNumber.includes(search) ||
                    customerName.includes(search) ||
                    email.includes(search)
                );

            }
        );


    renderOrders(
        filtered
    );

}


/* =========================================================
   VIEW FILE
========================================================= */

async function viewFile(
    filePath,
    fileName
){

    if(!filePath){

        showError(
            "File path is missing."
        );

        return;

    }


    const modal =
        document.getElementById(
            "fileModal"
        );


    const body =
        document.getElementById(
            "modalBody"
        );


    const title =
        document.getElementById(
            "modalTitle"
        );


    title.textContent =
        "📄 " +
        (
            fileName ||
            "File Preview"
        );


    body.innerHTML = `
        <div class="file-loading">
            Loading file...
        </div>
    `;


    modal.style.display =
        "block";


    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .storage
            .from(STORAGE_BUCKET)
            .createSignedUrl(
                filePath,
                3600
            );


        if(error){

            throw error;

        }


        if(
            !data ||
            !data.signedUrl
        ){

            throw new Error(
                "Could not create file URL."
            );

        }


        const url =
            data.signedUrl;


        const extension =
            getExtension(
                fileName ||
                filePath
            );


        if(
            [
                "jpg",
                "jpeg",
                "png",
                "gif",
                "webp",
                "bmp"
            ].includes(extension)
        ){

            body.innerHTML = `
                <img
                    src="${escapeHTML(url)}"
                    alt="Order File"
                >
            `;

        }

        else if(
            extension === "pdf"
        ){

            body.innerHTML = `
                <iframe
                    src="${escapeHTML(url)}">
                </iframe>
            `;

        }

        else{

            body.innerHTML = `
                <div style="
                    text-align:center;
                    color:#374151;
                    padding:30px;
                ">

                    <h3>
                        Preview not available
                    </h3>

                    <p style="
                        margin-top:10px;
                        color:#6b7280;
                    ">
                        This file type cannot be
                        previewed here.
                    </p>

                    <br>

                    <button
                        class="file-btn download-btn"
                        onclick="downloadFile(
                            '${escapeJS(filePath)}',
                            '${escapeJS(fileName)}'
                        )">

                        ⬇ Download File

                    </button>

                </div>
            `;

        }

    }

    catch(error){

        console.error(
            "View file error:",
            error
        );


        body.innerHTML = `
            <div style="
                text-align:center;
                color:#b91c1c;
                padding:30px;
            ">
                Unable to view file.
                <br><br>
                ${escapeHTML(
                    error.message ||
                    "Unknown error"
                )}
            </div>
        `;

    }

}


/* =========================================================
   DOWNLOAD FILE
========================================================= */

async function downloadFile(
    filePath,
    fileName
){

    if(!filePath){

        showError(
            "File path is missing."
        );

        return;

    }


    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .storage
            .from(STORAGE_BUCKET)
            .download(
                filePath
            );


        if(error){

            throw error;

        }


        if(!data){

            throw new Error(
                "File could not be downloaded."
            );

        }


        const url =
            URL.createObjectURL(
                data
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            fileName ||
            getFileName(
                filePath
            );


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        setTimeout(
            function(){

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );


    }

    catch(error){

        console.error(
            "Download error:",
            error
        );


        showError(
            "Unable to download file: " +
            (
                error.message ||
                error
            )
        );

    }

}


/* =========================================================
   CLOSE FILE MODAL
========================================================= */

function closeFileModal(){

    document.getElementById(
        "fileModal"
    ).style.display =
        "none";


    document.getElementById(
        "modalBody"
    ).innerHTML = "";

}


/* =========================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
========================================================= */

document.getElementById(
    "fileModal"
).addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            this
        ){

            closeFileModal();

        }

    }
);


/* =========================================================
   STATUS UPDATE
========================================================= */

async function changeOrderStatus(
    orderId,
    newStatus,
    selectElement
){

    if(!orderId){

        showError(
            "Order ID is missing."
        );

        return;

    }


    const oldStatus =
        selectElement.dataset.oldStatus ||
        "pending";


    const row =
        selectElement.closest(
            "tr"
        );


    const orderNumber =
        row.dataset.orderNumber ||
        orderId;


    const customerName =
        row.dataset.customerName ||
        "Customer";


    const customerEmail =
        row.dataset.email ||
        "";


    const service =
        row.dataset.service ||
        "-";


    const fileName =
        row.dataset.fileName ||
        "-";


    selectElement.disabled =
        true;


    hideMessages();


    try{

        /* =============================================
           UPDATE DATABASE
        ============================================= */

        const {
            error
        } =
        await supabaseClient
            .from("orders")
            .update({
                status:newStatus
            })
            .eq(
                "id",
                orderId
            );


        if(error){

            throw error;

        }


        selectElement.dataset.oldStatus =
            newStatus;


        selectElement.className =
            getStatusClass(
                newStatus
            );


        showSuccess(
            "Order " +
            orderNumber +
            " updated to " +
            capitalize(newStatus) +
            "."
        );


        /* =============================================
           SEND EMAIL
        ============================================= */

        if(
            customerEmail &&
            customerEmail !== "-"
        ){

            setEmailStatus(
                orderId,
                "Sending email...",
                "email-sending"
            );


            try{

                await sendOrderEmail({

                    email:
                        customerEmail,

                    orderNumber:
                        orderNumber,

                    customerName:
                        customerName,

                    service:
                        service,

                    status:
                        capitalize(
                            newStatus
                        ),

                    fileName:
                        fileName

                });


                setEmailStatus(
                    orderId,
                    "✓ Email sent",
                    "email-success"
                );

            }

            catch(emailError){

                console.error(
                    "Email failed:",
                    emailError
                );


                setEmailStatus(
                    orderId,
                    "✗ Email failed",
                    "email-failed"
                );


                showError(
                    "Order updated, but customer email failed: " +
                    (
                        emailError.message ||
                        "Email service error"
                    )
                );

            }

        }
        else{

            setEmailStatus(
                orderId,
                "No email available",
                "email-failed"
            );

        }


        await loadCounters();

    }

    catch(error){

        console.error(
            "Status update error:",
            error
        );


        selectElement.value =
            oldStatus;


        selectElement.className =
            getStatusClass(
                oldStatus
            );


        showError(
            "Failed to update order status: " +
            (
                error.message ||
                error
            )
        );

    }

    finally{

        selectElement.disabled =
            false;

    }

}


/* =========================================================
   SEND EMAIL
========================================================= */

async function sendOrderEmail(
    data
){

    console.log(
        "Calling Edge Function:",
        EDGE_FUNCTION_NAME,
        data
    );


    const {
        data:resultData,
        error
    } =
    await supabaseClient.functions.invoke(
        EDGE_FUNCTION_NAME,
        {
            body:data
        }
    );


    console.log(
        "Edge Function result:",
        resultData,
        error
    );


    if(error){

        throw new Error(
            error.message ||
            "Failed to send a request to the Edge Function"
        );

    }


    if(
        resultData &&
        resultData.success === false
    ){

        throw new Error(
            resultData.error ||
            resultData.message ||
            "Email sending failed."
        );

    }


    return resultData;

}


/* =========================================================
   COUNTERS
========================================================= */

async function loadCounters(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from("orders")
            .select("status");


        if(error){

            console.error(
                error
            );

            return;

        }


        updateCounters(
            data || []
        );

    }

    catch(error){

        console.error(
            "Counter error:",
            error
        );

    }

}


/* =========================================================
   UPDATE COUNTERS
========================================================= */

function updateCounters(
    orders
){

    let pending = 0;
    let processing = 0;
    let completed = 0;


    orders.forEach(
        function(order){

            const status =
                String(
                    order.status ||
                    ""
                ).toLowerCase();


            if(
                status === "pending"
            ){

                pending++;

            }


            if(
                status === "processing" ||
                status === "printing" ||
                status === "ready"
            ){

                processing++;

            }


            if(
                status === "completed"
            ){

                completed++;

            }

        }
    );


    document.getElementById(
        "totalOrders"
    ).textContent =
        orders.length;


    document.getElementById(
        "pendingOrders"
    ).textContent =
        pending;


    document.getElementById(
        "processingOrders"
    ).textContent =
        processing;


    document.getElementById(
        "completedOrders"
    ).textContent =
        completed;

}


/* =========================================================
   STATUS CLASS
========================================================= */

function getStatusClass(
    status
){

    return (
        "status-" +
        String(status)
            .toLowerCase()
    );

}


/* =========================================================
   EMAIL STATUS
========================================================= */

function setEmailStatus(
    orderId,
    message,
    className
){

    const element =
        document.getElementById(
            "email-status-" +
            orderId
        );


    if(!element){

        return;

    }


    element.textContent =
        message;


    element.className =
        "email-status " +
        className;

}


/* =========================================================
   DATE
========================================================= */

function formatDate(
    value
){

    if(!value){

        return "-";

    }


    const date =
        new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return String(value);

    }


    return date.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   EXTENSION
========================================================= */

function getExtension(
    value
){

    const clean =
        String(value)
            .split("?")[0]
            .toLowerCase();


    const parts =
        clean.split(".");


    return parts.length > 1
        ? parts.pop()
        : "";

}


/* =========================================================
   FILE NAME
========================================================= */

function getFileName(
    path
){

    const parts =
        String(path)
            .split("/");


    return parts[
        parts.length - 1
    ] || "download";

}


/* =========================================================
   CAPITALIZE
========================================================= */

function capitalize(
    value
){

    const text =
        String(value);


    return text.charAt(0).toUpperCase() +
        text.slice(1);

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
){

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   ESCAPE JS
========================================================= */

function escapeJS(
    value
){

    return String(value)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /"/g,
            '\\"'
        )
        .replace(
            /\n/g,
            "\\n"
        )
        .replace(
            /\r/g,
            "\\r"
        );

}


/* =========================================================
   SUCCESS
========================================================= */

function showSuccess(
    message
){

    const box =
        document.getElementById(
            "successMessage"
        );


    box.textContent =
        message;


    box.style.display =
        "block";


    setTimeout(
        function(){

            box.style.display =
                "none";

        },
        5000
    );

}


/* =========================================================
   ERROR
========================================================= */

function showError(
    message
){

    const box =
        document.getElementById(
            "errorMessage"
        );


    box.textContent =
        message;


    box.style.display =
        "block";

}


/* =========================================================
   HIDE MESSAGES
========================================================= */

function hideMessages(){

    document.getElementById(
        "successMessage"
    ).style.display =
        "none";


    document.getElementById(
        "errorMessage"
    ).style.display =
        "none";

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

    try{

        await supabaseClient.auth.signOut();

    }

    catch(error){

        console.error(
            "Logout error:",
            error
        );

    }


    window.location.href =
        "login.html";

}

   AUTH LISTENER
========================================================= */

supabaseClient.auth.onAuthStateChange(
    function(
        event,
        session
    ){

        if(
            event === "SIGNED_OUT" ||
            !session
        ){

            window.location.href =
                "login.html";

        }

    }
);
