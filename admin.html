
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AviPrint Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f8fafc;
    color:#111827;
}

button,
select,
input{
    font-family:inherit;
}

/* NAVBAR */

.navbar{
    height:72px;
    background:#ffffff;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
}

.nav-container{
    width:min(1400px,94%);
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:21px;
    font-weight:800;
}

.logo-icon{
    width:38px;
    height:38px;
    border-radius:10px;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

.logo-text span{
    color:#2563eb;
}

.admin-badge{
    margin-left:8px;
    padding:5px 9px;
    background:#eff6ff;
    color:#2563eb;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
}

.logout-btn{
    border:1px solid #e5e7eb;
    background:white;
    color:#374151;
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
}

.logout-btn:hover{
    background:#f3f4f6;
}

/* PAGE */

.admin-page{
    width:min(1400px,94%);
    margin:auto;
    padding:35px 0 60px;
}

/* HEADER */

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    margin-bottom:28px;
}

.section-label{
    color:#2563eb;
    font-size:11px;
    font-weight:800;
    letter-spacing:1px;
}

.page-header h1{
    font-size:30px;
    margin:8px 0;
}

.page-header p{
    color:#6b7280;
    font-size:13px;
}

.admin-email{
    color:#6b7280;
    font-size:12px;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:20px;
}

.stat-card span{
    display:block;
    color:#6b7280;
    font-size:12px;
    margin-bottom:8px;
}

.stat-card strong{
    display:block;
    font-size:25px;
}

/* CARD */

.card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(15,23,42,.04);
}

/* TOOLBAR */

.toolbar{
    padding:18px;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.search-box{
    width:min(500px,100%);
}

.search-box input{
    width:100%;
    height:44px;
    border:1px solid #d1d5db;
    border-radius:9px;
    padding:0 14px;
    outline:none;
    font-size:13px;
}

.search-box input:focus{
    border-color:#2563eb;
}

.refresh-btn{
    border:1px solid #dbeafe;
    background:#eff6ff;
    color:#2563eb;
    padding:10px 15px;
    border-radius:8px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.refresh-btn:hover{
    background:#dbeafe;
}

/* TABLE */

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

.orders-table{
    width:100%;
    min-width:1250px;
    border-collapse:collapse;
}

.orders-table th{
    background:#f8fafc;
    color:#6b7280;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.6px;
    text-align:left;
    padding:16px;
    border-bottom:1px solid #e5e7eb;
}

.orders-table td{
    padding:16px;
    border-bottom:1px solid #f1f5f9;
    font-size:12px;
    vertical-align:middle;
}

.orders-table tr:hover{
    background:#f8fafc;
}

.order-number{
    color:#2563eb;
    font-weight:800;
}

.customer-name{
    font-weight:700;
    color:#111827;
    margin-bottom:4px;
}

.customer-email{
    color:#6b7280;
    font-size:11px;
}

.service-name{
    font-weight:700;
    color:#111827;
}

.service-details{
    color:#9ca3af;
    font-size:10px;
    margin-top:4px;
}

.amount{
    font-weight:800;
}

/* STATUS */

.status-select{
    height:36px;
    border:1px solid #d1d5db;
    border-radius:8px;
    padding:0 9px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
}

.status-select.pending{
    color:#92400e;
    background:#fef3c7;
}

.status-select.processing{
    color:#1d4ed8;
    background:#dbeafe;
}

.status-select.completed{
    color:#166534;
    background:#dcfce7;
}

.status-select.cancelled{
    color:#991b1b;
    background:#fee2e2;
}

/* ACTION BUTTONS */

.action-buttons{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.view-btn,
.download-btn{
    border:1px solid #dbeafe;
    background:#eff6ff;
    color:#2563eb;
    padding:8px 11px;
    border-radius:7px;
    cursor:pointer;
    font-size:10px;
    font-weight:700;
    white-space:nowrap;
}

.view-btn:hover,
.download-btn:hover{
    background:#dbeafe;
}

.download-btn{
    border-color:#dcfce7;
    background:#f0fdf4;
    color:#15803d;
}

.download-btn:hover{
    background:#dcfce7;
}

/* LOADING */

.loading,
.empty{
    padding:60px 20px;
    text-align:center;
    color:#6b7280;
    font-size:13px;
}

/* ERROR */

.error-box{
    padding:20px;
    margin:20px;
    border-radius:10px;
    background:#fef2f2;
    border:1px solid #fecaca;
    color:#b91c1c;
    font-size:12px;
    line-height:1.6;
}

.hidden{
    display:none !important;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:9999;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(600px,100%);
    max-height:90vh;
    overflow-y:auto;
    background:#fff;
    border-radius:18px;
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-header h2{
    font-size:20px;
}

.close-btn{
    width:34px;
    height:34px;
    border:0;
    background:#f3f4f6;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

.modal-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:13px 0;
    border-bottom:1px solid #f1f5f9;
    font-size:12px;
}

.modal-row span{
    color:#6b7280;
    flex-shrink:0;
}

.modal-row strong{
    text-align:right;
    max-width:70%;
    word-break:break-word;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-download{
    flex:1;
    border:0;
    background:#16a34a;
    color:white;
    padding:12px;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
}

.modal-close{
    flex:1;
    border:0;
    background:#f3f4f6;
    color:#374151;
    padding:12px;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:900px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .admin-page{
        width:92%;
        padding-top:25px;
    }

    .page-header{
        flex-direction:column;
        align-items:flex-start;
    }

    .page-header h1{
        font-size:25px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .toolbar{
        flex-direction:column;
        align-items:stretch;
    }

    .search-box{
        width:100%;
    }

    .refresh-btn{
        width:100%;
    }

    .modal-row{
        flex-direction:column;
        gap:5px;
    }

    .modal-row strong{
        max-width:100%;
        text-align:left;
    }

}

</style>

</head>

<body>

<header class="navbar">

<div class="nav-container">

<div class="logo">

<span class="logo-icon">
A
</span>

<span class="logo-text">
Avi<span>Print</span>
</span>

<span class="admin-badge">

</span>

</div>

type="button"

<div>

</span>

</h1>

<p>
Manage customer orders, print files and order status.

</div>

<div
class="admin-email"
id="adminEmail">

Checking admin session...

<div class="stats">

<span>Total Orders</span>

<strong id="totalOrders">

<span>Pending</span>

<strong id="pendingOrders">

<span>Processing</span>

<strong id="processingOrders">

</strong>

<!-- MODAL -->

<div

</div>

</div>


<script>

/* =========================================
   ADMIN CONFIG
========================================= */

const ADMIN_EMAIL =
"aviinformatics@gmail.com";


const PRINT_BUCKET =
"print-files";


/* =========================================
   ELEMENTS
========================================= */

const adminEmail =
document.getElementById("adminEmail");

const totalOrders =
document.getElementById("totalOrders");

const pendingOrders =
document.getElementById("pendingOrders");

const processingOrders =
document.getElementById("processingOrders");

const completedOrders =
document.getElementById("completedOrders");

const ordersBody =
document.getElementById("ordersBody");

const loading =
document.getElementById("loading");

const empty =
document.getElementById("empty");

const tableWrapper =
document.getElementById("tableWrapper");

const errorBox =
document.getElementById("errorBox");

const searchInput =
document.getElementById("searchInput");

const refreshButton =
document.getElementById("refreshButton");

const logoutButton =
document.getElementById("logoutButton");

const orderModal =
document.getElementById("orderModal");

const modalDetails =
document.getElementById("modalDetails");

const closeModal =
document.getElementById("closeModal");

const modalCloseButton =
document.getElementById("modalCloseButton");

const modalDownloadButton =
document.getElementById("modalDownloadButton");


let allOrders = [];

let selectedOrder = null;


/* =========================================
   SUPABASE CHECK
========================================= */

if(
typeof window.supabase === "undefined"
){

document.body.innerHTML =

"<div style='padding:40px;font-family:Arial'>" +
"<h2>Supabase library failed to load.</h2>" +
"<p>Please check your internet connection.</p>" +
"</div>";

throw new Error(
"Supabase library not loaded."
);

}


if(
typeof supabaseClient === "undefined" ||
!supabaseClient
){

document.body.innerHTML =

"<div style='padding:40px;font-family:Arial'>" +
"<h2>Supabase configuration error.</h2>" +
"<p>Check config.js.</p>" +
"</div>";

throw new Error(
"supabaseClient missing."
);

}


/* =========================================
   ADMIN SESSION
========================================= */

async function checkAdmin(){

try{

const result =
await supabaseClient.auth.getSession();


if(result.error){

throw result.error;

}


const session =
result.data.session;


if(
!session ||
!session.user
){

window.location.replace(
"login.html"
);

return false;

}


const email =
String(
session.user.email || ""
)
.trim()
.toLowerCase();


if(
email !==
ADMIN_EMAIL.toLowerCase()
){

alert(
"Access denied. Admin account required."
);

await supabaseClient.auth.signOut();

window.location.replace(
"login.html"
);

return false;

}


adminEmail.textContent =
"Logged in as Admin: " +
session.user.email;


return true;

}
catch(error){

console.error(
"ADMIN SESSION ERROR:",
error
);

adminEmail.textContent =
"Session error: " +
error.message;

return false;

}

}


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders(){

loading.classList.remove(
"hidden"
);

tableWrapper.classList.add(
"hidden"
);

empty.classList.add(
"hidden"
);

errorBox.classList.add(
"hidden"
);

ordersBody.innerHTML =
"";


try{

/*
 IMPORTANT

Do NOT select user_email.

Your orders table contains:

customer_email
customer_name
service_name
service_details
file_path
file_name
*/

const result =
await supabaseClient
.rpc(
"get_admin_orders"
);


if(result.error){

throw result.error;

}


allOrders =
Array.isArray(result.data)
?
result.data
:
[];


console.log(
"ADMIN ORDERS:",
allOrders
);


updateStats(
allOrders
);


loading.classList.add(
"hidden"
);


renderOrders(
allOrders
);

}
catch(error){

console.error(
"ORDER LOAD ERROR:",
error
);

loading.classList.add(
"hidden"
);

errorBox.innerHTML =
"Unable to load orders.<br><br>" +
escapeHTML(
error.message ||
"Unknown error"
);

errorBox.classList.remove(
"hidden"
);

}

}


/* =========================================
   UPDATE STATS
========================================= */

function updateStats(
orders
){

totalOrders.textContent =
orders.length;


pendingOrders.textContent =
orders.filter(
order =>
normalizeStatus(
order.status
) ===
"pending"
).length;


processingOrders.textContent =
orders.filter(
order =>
normalizeStatus(
order.status
) ===
"processing"
).length;


completedOrders.textContent =
orders.filter(
order =>
normalizeStatus(
order.status
) ===
"completed"
).length;

}


/* =========================================
   NORMALIZE STATUS
========================================= */

function normalizeStatus(
status
){

const value =
String(
status || "pending"
)
.trim()
.toLowerCase();


if(
[
"pending",
"processing",
"completed",
"cancelled"
].includes(value)
){

return value;

}


return "pending";

}


/* =========================================
   RENDER ORDERS
========================================= */

function renderOrders(
orders
){

ordersBody.innerHTML =
"";


if(
!orders ||
!orders.length
){

tableWrapper.classList.add(
"hidden"
);

empty.classList.remove(
"hidden"
);

return;

}


empty.classList.add(
"hidden"
);

tableWrapper.classList.remove(
"hidden"
);


orders.forEach(
function(order){

const row =
document.createElement("tr");


const orderNumber =
order.order_number ||
(
order.id
?
String(order.id).substring(
0,
8
)
:
"-"
);


const customerName =
order.customer_name ||
"Customer";


const customerEmail =
order.customer_email ||
"";


const service =
order.service_name ||
"Print Service";


const details =
order.service_details ||
"Printing order";


const status =
normalizeStatus(
order.status
);


const amount =
Number(
order.amount || 0
).toFixed(2);


const date =
formatDate(
order.order_date ||
order.created_at
);


const hasFile =
Boolean(
order.file_path
);


row.innerHTML = `

<td>

<span class="order-number">

#${escapeHTML(
orderNumber
)}

</span>

</td>


<td>

<div class="customer-name">

${escapeHTML(
customerName
)}

</div>

<div class="customer-email">

${escapeHTML(
customerEmail || "-"
)}

</div>

</td>


<td>

<div class="service-name">

${escapeHTML(
service
)}

</div>

<div class="service-details">

${escapeHTML(
details
)}

</div>

</td>


<td>

${escapeHTML(
date
)}

</td>


<td>

<span class="amount">

₹${amount}

</span>

</td>


<td>

<select
class="status-select ${status}"
data-order-id="${escapeHTML(
order.id
)}">

<option
value="pending"
${status === "pending" ? "selected" : ""}>

Pending

</option>

<option
value="processing"
${status === "processing" ? "selected" : ""}>

Processing

</option>

<option
value="completed"
${status === "completed" ? "selected" : ""}>

Completed

</option>

<option
value="cancelled"
${status === "cancelled" ? "selected" : ""}>

Cancelled

</option>

</select>

</td>


<td>

<div class="action-buttons">

<button
type="button"
class="view-btn"
data-order-id="${escapeHTML(
order.id
)}">

View

</button>


<button
type="button"
class="download-btn"
data-order-id="${escapeHTML(
order.id
)}"
${hasFile ? "" : "disabled"}>

${hasFile ? "⬇ Download" : "No File"}

</button>

</div>

</td>

`;


ordersBody.appendChild(
row
);

}
);


/* STATUS EVENTS */

ordersBody
.querySelectorAll(
".status-select"
)
.forEach(
function(select){

select.addEventListener(
"change",
async function(){

const orderId =
select.dataset.orderId;

const newStatus =
normalizeStatus(
select.value
);

await updateOrderStatus(
orderId,
newStatus
);

}
);

}
);


/* VIEW EVENTS */

ordersBody
.querySelectorAll(
".view-btn"
)
.forEach(
function(button){

button.addEventListener(
"click",
function(){

const orderId =
button.dataset.orderId;


const order =
allOrders.find(
item =>
item.id === orderId
);


if(order){

showOrderDetails(
order
);

}

}
);

}
);


/* DOWNLOAD EVENTS */

ordersBody
.querySelectorAll(
".download-btn"
)
.forEach(
function(button){

button.addEventListener(
"click",
async function(){

const orderId =
button.dataset.orderId;


const order =
allOrders.find(
item =>
item.id === orderId
);


if(!order){

alert(
"Order not found."
);

return;

}


await downloadPrintFile(
order
);

}
);

}
);

}


/* =========================================
   UPDATE ORDER STATUS
========================================= */

async function updateOrderStatus(
orderId,
newStatus
){

const allowedStatuses = [
"pending",
"processing",
"completed",
"cancelled"
];


const finalStatus =
String(
newStatus || ""
)
.trim()
.toLowerCase();


if(
!allowedStatuses.includes(
finalStatus
)
){

alert(
"Invalid order status."
);

await loadOrders();

return;

}


try{

console.log(
"Updating order:",
orderId
);

console.log(
"New status:",
finalStatus
);


const result =
await supabaseClient
.from("orders")
.update({

status:
finalStatus

})
.eq(
"id",
orderId
)
.select()
.single();


if(result.error){

throw result.error;

}


console.log(
"STATUS UPDATED:",
result.data
);


const index =
allOrders.findIndex(
order =>
order.id === orderId
);


if(index !== -1){

allOrders[index].status =
finalStatus;

}


updateStats(
allOrders
);


await loadOrders();


alert(
"Order status updated successfully."
);

}
catch(error){

console.error(
"STATUS UPDATE ERROR:",
error
);


await loadOrders();


alert(
"Failed to update order status:\n\n" +
(
error.message ||
"Unknown error"
)
);

}


/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(
"input",
function(){

const query =
String(
this.value || ""
)
.toLowerCase()
.trim();


if(!query){

renderOrders(
allOrders
);

return;

}


const filtered =
allOrders.filter(
function(order){

const orderNumber =
String(
order.order_number || ""
)
.toLowerCase();


const name =
String(
order.customer_name || ""
)

return (

/* =========================================
   DOWNLOAD PRINT FILE
========================================= */

async function downloadPrintFile(
order
){

if(
!order
){

alert(
"Order information missing."
);

return;

}


const filePath =
String(
order.file_path || ""
)
.trim();


if(
!filePath
){

alert(
"No print file is attached to this order."
);

return;

}


try{

console.log(
"Downloading file:"
);

console.log(
"Bucket:",
PRINT_BUCKET
);

console.log(
"Path:",
filePath
);


/*
 Supabase Storage download
*/

const result =
await supabaseClient
.storage
.from(
PRINT_BUCKET
)
.download(
filePath
);


if(result.error){

throw result.error;

}


const file =
result.data;


if(!file){

throw new Error(
"File was not returned by Supabase Storage."
);

}


/*
 Create temporary browser URL
*/

const url =
URL.createObjectURL(
file
);


const link =
document.createElement("a");


link.href =
url;


let filename =
order.file_name ||
"print-file";


filename =
String(
filename
)
.split("/")
.pop();


link.download =
filename;


document.body.appendChild(
link
);


link.click();


link.remove();


setTimeout(
function(){

URL.revokeObjectURL(
url
);

},
5000
);


console.log(
"FILE DOWNLOAD SUCCESS"
);

}
catch(error){

console.error(
"FILE DOWNLOAD ERROR:",
error
);


alert(
"Download failed:\n\n" +
(
error.message ||
"Unknown error"
) +
"\n\nBucket: " +
PRINT_BUCKET +
"\nPath: " +
filePath
);

}

}

/* =========================================
   DATE
========================================= */

function formatDate(
value
){

if(!value){

return "-";

}


const date =
new Date(
value
);


if(
Number.isNaN(
date.getTime()
)
){

return "-";

}


return date.toLocaleDateString(
"en-IN",
{
day:"2-digit",
month:"short",
year:"numeric"
}
);

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
value
){

return String(
value ?? ""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}
