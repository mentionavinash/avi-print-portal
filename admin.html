<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AviPrint Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
    color:#111827;
}

.topbar{
    background:#111827;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.topbar h1{
    font-size:22px;
}

.admin-info{
    margin-top:5px;
    font-size:13px;
    opacity:.85;
}

.logout-btn,
.refresh-btn{
    border:0;
    color:white;
    padding:10px 18px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.logout-btn{
    background:#ef4444;
}

.logout-btn:hover{
    background:#dc2626;
}

.refresh-btn{
    background:#2563eb;
}

.refresh-btn:hover{
    background:#1d4ed8;
}

.container{
    width:95%;
    max-width:1500px;
    margin:25px auto;
}

.message{
    display:none;
    padding:14px 18px;
    border-radius:8px;
    margin-bottom:20px;
    font-size:14px;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:22px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.card h3{
    font-size:14px;
    color:#6b7280;
    margin-bottom:10px;
}

.number{
    font-size:30px;
    font-weight:bold;
}

.blue{color:#2563eb;}
.orange{color:#d97706;}
.purple{color:#7c3aed;}
.green{color:#16a34a;}

.section{
    background:white;
    border-radius:12px;
    padding:22px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.section-header h2{
    font-size:20px;
}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.search-box{
    flex:1;
    min-width:250px;
    height:44px;
    border:1px solid #d1d5db;
    border-radius:8px;
    padding:0 14px;
    outline:none;
    font-size:14px;
}

.search-box:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1250px;
    border-collapse:collapse;
}

th{
    background:#f3f4f6;
    text-align:left;
    padding:13px;
    font-size:13px;
    white-space:nowrap;
}

td{
    padding:13px;
    border-bottom:1px solid #e5e7eb;
    font-size:13px;
    vertical-align:middle;
}

tr:hover{
    background:#fafafa;
}

.order-id{
    color:#2563eb;
    font-weight:bold;
    white-space:nowrap;
}

.customer-name{
    font-weight:bold;
    display:block;
    margin-bottom:4px;
}

.email{
    color:#374151;
    word-break:break-word;
}

.service{
    font-weight:600;
}

.quantity{
    text-align:center;
}

.date{
    color:#6b7280;
    white-space:nowrap;
}

.status-select{
    padding:8px 10px;
    border:1px solid #d1d5db;
    border-radius:6px;
    background:white;
    cursor:pointer;
    min-width:130px;
    font-weight:600;
}

.status-select:disabled{
    opacity:.6;
    cursor:wait;
}

.status-pending{
    color:#c2410c;
    background:#fff7ed;
}

.status-processing{
    color:#6d28d9;
    background:#f5f3ff;
}

.status-printing{
    color:#1d4ed8;
    background:#eff6ff;
}

.status-ready{
    color:#0e7490;
    background:#ecfeff;
}

.status-completed{
    color:#15803d;
    background:#f0fdf4;
}

.status-cancelled{
    color:#b91c1c;
    background:#fef2f2;
}

.file-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.file-btn{
    border:0;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
}

.view-btn{
    background:#dbeafe;
    color:#1d4ed8;
}

.download-btn{
    background:#dcfce7;
    color:#15803d;
}

.file-btn:hover{
    opacity:.8;
}

.no-file{
    color:#9ca3af;
}

.email-status{
    font-size:11px;
    margin-top:5px;
}

.email-sending{
    color:#d97706;
}

.email-success{
    color:#15803d;
}

.email-failed{
    color:#dc2626;
}

.loading,
.empty{
    text-align:center;
    padding:40px;
    color:#6b7280;
}

.result-count{
    color:#6b7280;
    font-size:13px;
    margin-top:8px;
}

@media(max-width:900px){

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .cards{
        grid-template-columns:1fr;
    }

    .container{
        width:94%;
    }

    .section{
        padding:15px;
    }

    .topbar{
        padding:15px;
    }

    .search-box{
        min-width:100%;
    }

}

</style>

</head>


<body>


<header class="topbar">

    <div>

        <h1>🖨️ AviPrint Admin Panel</h1>

        <div
            class="admin-info"
            id="adminInfo">

            Checking admin session...

        </div>

    </div>


    <button
        class="logout-btn"
        id="logoutButton">

        Logout

    </button>

</header>



<main class="container">


    <div
        id="successMessage"
        class="message success">
    </div>


    <div
        id="errorMessage"
        class="message error">
    </div>



    <!-- DASHBOARD CARDS -->

    <div class="cards">


        <div class="card">

            <h3>
                Total Orders
            </h3>

            <div
                id="totalOrders"
                class="number blue">

                0

            </div>

        </div>



        <div class="card">

            <h3>
                Pending Orders
            </h3>

            <div
                id="pendingOrders"
                class="number orange">

                0

            </div>

        </div>



        <div class="card">

            <h3>
                Processing / Printing
            </h3>

            <div
                id="processingOrders"
                class="number purple">

                0

            </div>

        </div>



        <div class="card">

            <h3>
                Completed Orders
            </h3>

            <div
                id="completedOrders"
                class="number green">

                0

            </div>

        </div>

    </div>



    <!-- ORDERS -->

    <section class="section">


        <div class="section-header">

            <div>

                <h2>
                    📦 Customer Orders
                </h2>

                <div
                    class="result-count"
                    id="resultCount">

                    0 orders

                </div>

            </div>


            <button
                class="refresh-btn"
                id="refreshButton">

                🔄 Refresh

            </button>

        </div>



        <!-- SEARCH -->

        <div class="toolbar">

            <input
                type="search"
                id="searchInput"
                class="search-box"
                placeholder="🔍 Search by customer name, email or order ID...">

        </div>



        <div class="table-wrapper">


            <table>


                <thead>

                    <tr>

                        <th>
                            Order ID
                        </th>

                        <th>
                            Customer
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Service
                        </th>

                        <th>
                            Quantity
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            File
                        </th>

                        <th>
                            Date
                        </th>

                    </tr>

                </thead>



                <tbody id="ordersTableBody">

                    <tr>

                        <td
                            colspan="8"
                            class="loading">

                            Loading orders...

                        </td>

                    </tr>

                </tbody>


            </table>

        </div>


    </section>


</main>



<script>


/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "https://pmqmewceqnxsvlhceeef.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_mWPszaFzSHbPp-OHlPGWjw_JdrMU6oQ";


/* =====================================================
   ADMIN
===================================================== */

const ADMIN_EMAIL =
    "aviinformatics@gmail.com";


/* =====================================================
   YOUR DEPLOYED EDGE FUNCTION
===================================================== */

const EDGE_FUNCTION_NAME =
    "smart-service";


/* =====================================================
   SUPABASE CLIENT
===================================================== */

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   GLOBAL ORDERS
===================================================== */

let allOrders = [];


/* =====================================================
   PAGE LOAD
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        document
            .getElementById("refreshButton")
            .addEventListener(
                "click",
                loadOrders
            );


        document
            .getElementById("logoutButton")
            .addEventListener(
                "click",
                logout
            );


        document
            .getElementById("searchInput")
            .addEventListener(
                "input",
                filterOrders
            );


        await checkAdmin();

    }
);


/* =====================================================
   CHECK ADMIN
===================================================== */

async function checkAdmin(){

    try{

        const result =
            await supabaseClient
                .auth
                .getSession();


        if(result.error){

            throw result.error;

        }


        const session =
            result.data.session;


        if(
            !session ||
            !session.user
        ){

            window.location.href =
                "login.html";

            return;

        }


        const email =
            session.user.email || "";


        if(
            email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
        ){

            alert(
                "Access denied. Admin account required."
            );


            await supabaseClient
                .auth
                .signOut();


            window.location.href =
                "login.html";

            return;

        }


        document
            .getElementById("adminInfo")
            .textContent =
            "Logged in as Admin: " + email;


        await loadOrders();

    }

    catch(error){

        console.error(
            "Admin check error:",
            error
        );


        showError(
            error.message ||
            "Unable to verify admin."
        );

    }

}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

    const tbody =
        document.getElementById(
            "ordersTableBody"
        );


    tbody.innerHTML = `
        <tr>
            <td colspan="8" class="loading">
                Loading orders...
            </td>
        </tr>
    `;


    hideMessages();


    try{

        const result =
            await supabaseClient
                .from("orders")
                .select(`
                    id,
                    order_number,
                    user_id,
                    service_name,
                    service_details,
                    order_date,
                    status,
                    amount,
                    file_path,
                    file_name,
                    created_at,
                    customer_email
                `)
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        if(result.error){

            throw result.error;

        }


        allOrders =
            result.data || [];


        updateCounters(
            allOrders
        );


        renderOrders(
            allOrders
        );

    }

    catch(error){

        console.error(
            "Load orders error:",
            error
        );


        tbody.innerHTML = `
            <tr>
                <td colspan="8" class="empty">
                    Failed to load orders.
                </td>
            </tr>
        `;


        showError(
            "Failed to load orders: " +
            (
                error.message ||
                error
            )
        );

    }

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(
    orders
){

    const tbody =
        document.getElementById(
            "ordersTableBody"
        );


    document
        .getElementById("resultCount")
        .textContent =
        orders.length +
        (
            orders.length === 1
            ? " order"
            : " orders"
        );


    if(orders.length === 0){

        tbody.innerHTML = `
            <tr>
                <td colspan="8" class="empty">
                    No matching orders found.
                </td>
            </tr>
        `;

        return;

    }


    tbody.innerHTML = "";


    orders.forEach(
        function(order){

            tbody.appendChild(
                createOrderRow(order)
            );

        }
    );

}


/* =====================================================
   CREATE ORDER ROW
===================================================== */

function createOrderRow(
    order
){

    const tr =
        document.createElement("tr");


    const orderId =
        order.id || "";


    const orderNumber =
        order.order_number ||
        orderId;


    /*
     * Your current orders table has
     * customer_email but no customer_name.
     *
     * So we use the available name fields
     * if they exist, otherwise "Customer".
     */

    const customerName =
        order.customer_name ||
        order.full_name ||
        order.name ||
        "Customer";


    const email =
        order.customer_email ||
        "-";


    const service =
        order.service_name ||
        "-";


    const quantity =
        extractQuantity(
            order.service_details
        );


    const status =
        String(
            order.status ||
            "pending"
        ).toLowerCase();


    const dateValue =
        order.created_at ||
        order.order_date ||
        "";


    tr.dataset.orderId =
        orderId;


    tr.dataset.orderNumber =
        orderNumber;


    tr.dataset.customerName =
        customerName;


    tr.dataset.email =
        email;


    tr.innerHTML = `

        <td>

            <span class="order-id">

                ${escapeHTML(
                    orderNumber
                )}

            </span>

        </td>


        <td>

            <span class="customer-name">

                ${escapeHTML(
                    customerName
                )}

            </span>

        </td>


        <td>

            <span class="email">

                ${escapeHTML(
                    email
                )}

            </span>


            <div
                id="email-status-${safeId(orderId)}"
                class="email-status">

            </div>

        </td>


        <td>

            <span class="service">

                ${escapeHTML(
                    service
                )}

            </span>

        </td>


        <td class="quantity">

            ${escapeHTML(
                quantity
            )}

        </td>


        <td>

            <select
                class="status-select ${getStatusClass(status)}"
                data-old-status="${escapeHTML(status)}">

                <option value="pending">
                    Pending
                </option>

                <option value="processing">
                    Processing
                </option>

                <option value="printing">
                    Printing
                </option>

                <option value="ready">
                    Ready
                </option>

                <option value="completed">
                    Completed
                </option>

                <option value="cancelled">
                    Cancelled
                </option>

            </select>

        </td>


        <td>

            ${createFileButtons(order)}

        </td>


        <td class="date">

            ${escapeHTML(
                formatDate(dateValue)
            )}

        </td>

    `;


    const select =
        tr.querySelector(
            ".status-select"
        );


    select.value =
        allowedStatus(status)
        ? status
        : "pending";


    select.addEventListener(
        "change",
        function(){

            changeOrderStatus(
                order,
                this.value,
                this
            );

        }
    );


    return tr;

}


/* =====================================================
   FILE BUTTONS
===================================================== */

function createFileButtons(
    order
){

    if(
        !order.file_path
    ){

        return `
            <span class="no-file">
                No file
            </span>
        `;

    }


    const encodedPath =
        encodeURIComponent(
            order.file_path
        );


    return `

        <div class="file-actions">

            <button
                type="button"
                class="file-btn view-btn"
                data-file-path="${encodedPath}">

                👁 View

            </button>


            <button
                type="button"
                class="file-btn download-btn"
                data-file-path="${encodedPath}"
                data-file-name="${escapeHTML(
                    order.file_name || "file"
                )}">

                ⬇ Download

            </button>

        </div>

    `;

}


/* =====================================================
   FILE BUTTON EVENT DELEGATION
===================================================== */

document.addEventListener(
    "click",
    async function(event){

        const viewButton =
            event.target.closest(
                ".view-btn"
            );


        if(viewButton){

            const path =
                decodeURIComponent(
                    viewButton.dataset.filePath
                );


            await viewFile(path);

            return;

        }


        const downloadButton =
            event.target.closest(
                ".download-btn"
            );


        if(downloadButton){

            const path =
                decodeURIComponent(
                    downloadButton.dataset.filePath
                );


            const fileName =
                downloadButton.dataset.fileName ||
                "file";


            await downloadFile(
                path,
                fileName
            );

        }

    }
);


/* =====================================================
   VIEW FILE
===================================================== */

async function viewFile(
    filePath
){

    try{

        const result =
            await supabaseClient
                .storage
                .from("print-files")
                .createSignedUrl(
                    filePath,
                    3600
                );


        if(result.error){

            throw result.error;

        }


        if(
            !result.data ||
            !result.data.signedUrl
        ){

            throw new Error(
                "Could not create file URL."
            );

        }


        window.open(
            result.data.signedUrl,
            "_blank"
        );

    }

    catch(error){

        console.error(
            "View file error:",
            error
        );


        showError(
            "Unable to view file: " +
            (
                error.message ||
                error
            )
        );

    }

}


/* =====================================================
   DOWNLOAD FILE
===================================================== */

async function downloadFile(
    filePath,
    fileName
){

    try{

        const result =
            await supabaseClient
                .storage
                .from("print-files")
                .download(
                    filePath
                );


        if(result.error){

            throw result.error;

        }


        const blob =
            result.data;


        if(!blob){

            throw new Error(
                "File data was not returned."
            );

        }


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement("a");


        a.href =
            url;


        a.download =
            fileName;


        document.body.appendChild(a);


        a.click();


        a.remove();


        setTimeout(
            function(){

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );


    }

    catch(error){

        console.error(
            "Download file error:",
            error
        );


        showError(
            "Unable to download file: " +
            (
                error.message ||
                error
            )
        );

    }

}


/* =====================================================
   CHANGE ORDER STATUS
===================================================== */

async function changeOrderStatus(
    order,
    newStatus,
    selectElement
){

    const orderId =
        order.id;


    const oldStatus =
        selectElement.dataset.oldStatus ||
        "pending";


    if(!orderId){

        showError(
            "Order ID is missing."
        );

        selectElement.value =
            oldStatus;

        return;

    }


    selectElement.disabled =
        true;


    hideMessages();


    try{

        /* ================================
           UPDATE DATABASE
        ================================= */

        const result =
            await supabaseClient
                .from("orders")
                .update({
                    status:newStatus
                })
                .eq(
                    "id",
                    orderId
                );


        if(result.error){

            throw result.error;

        }


        selectElement.dataset.oldStatus =
            newStatus;


        selectElement.className =
            "status-select " +
            getStatusClass(
                newStatus
            );


        order.status =
            newStatus;


        showSuccess(
            "Order " +
            (
                order.order_number ||
                orderId
            ) +
            " updated to " +
            newStatus +
            "."
        );


        /* ================================
           SEND EMAIL
        ================================= */

        const customerEmail =
            order.customer_email ||
            "";


        if(
            customerEmail &&
            customerEmail !== "-"
        ){

            setEmailStatus(
                orderId,
                "Sending email...",
                "email-sending"
            );


            try{

                await sendOrderEmail(
                    order,
                    newStatus
                );


                setEmailStatus(
                    orderId,
                    "✓ Email sent",
                    "email-success"
                );

            }

            catch(emailError){

                console.error(
                    "Email error:",
                    emailError
                );


                setEmailStatus(
                    orderId,
                    "✗ Email failed",
                    "email-failed"
                );


                showError(
                    "Order updated, but customer email failed: " +
                    (
                        emailError.message ||
                        "Email service error"
                    )
                );

            }

        }

        else{

            setEmailStatus(
                orderId,
                "No customer email",
                "email-failed"
            );

        }


        /* ================================
           UPDATE COUNTERS
        ================================= */

        updateCounters(
            allOrders
        );

    }

    catch(error){

        console.error(
            "Status update error:",
            error
        );


        selectElement.value =
            oldStatus;


        selectElement.dataset.oldStatus =
            oldStatus;


        selectElement.className =
            "status-select " +
            getStatusClass(
                oldStatus
            );


        showError(
            "Failed to update order status: " +
            (
                error.message ||
                error
            )
        );

    }

    finally{

        selectElement.disabled =
            false;

    }

}


/* =====================================================
   SEND ORDER EMAIL
===================================================== */

async function sendOrderEmail(
    order,
    status
){

    const email =
        order.customer_email ||
        "";


    if(!email){

        throw new Error(
            "Customer email is missing."
        );

    }


    /*
     * This matches the payload expected
     * by the Resend email Edge Function.
     */

    const payload = {

        email:
            email,

        orderNumber:
            order.order_number ||
            order.id ||
            "-",

        service:
            order.service_name ||
            "-",

        details:
            order.service_details ||
            "-",

        amount:
            order.amount != null
            ? "₹" +
              Number(
                  order.amount
              ).toFixed(2)
            : "₹0.00",

        status:
            capitalizeStatus(
                status
            ),

        fileName:
            order.file_name ||
            "-"

    };


    console.log(
        "Calling Edge Function:",
        EDGE_FUNCTION_NAME,
        payload
    );


    const result =
        await supabaseClient
            .functions
            .invoke(
                EDGE_FUNCTION_NAME,
                {
                    body:payload
                }
            );


    console.log(
        "Edge Function result:",
        result
    );


    if(result.error){

        throw new Error(
            result.error.message ||
            "Failed to send a request to the Edge Function."
        );

    }


    if(
        result.data &&
        result.data.success === false
    ){

        throw new Error(
            result.data.error ||
            result.data.message ||
            "Email sending failed."
        );

    }


    return result.data;

}


/* =====================================================
   SEARCH
===================================================== */

function filterOrders(){

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    if(!search){

        renderOrders(
            allOrders
        );

        return;

    }


    const filtered =
        allOrders.filter(
            function(order){

                const orderNumber =
                    String(
                        order.order_number ||
                        ""
                    ).toLowerCase();


                const email =
                    String(
                        order.customer_email ||
                        ""
                    ).toLowerCase();


                const name =
                    String(
                        order.customer_name ||
                        order.full_name ||
                        order.name ||
                        "customer"
                    ).toLowerCase();


                return (
                    orderNumber.includes(search) ||
                    email.includes(search) ||
                    name.includes(search)
                );

            }
        );


    renderOrders(
        filtered
    );

}


/* =====================================================
   COUNTERS
===================================================== */

function updateCounters(
    orders
){

    let pending = 0;

    let processing = 0;

    let completed = 0;


    orders.forEach(
        function(order){

            const status =
                String(
                    order.status ||
                    ""
                ).toLowerCase();


            if(
                status ===
                "pending"
            ){

                pending++;

            }


            if(
                status === "processing" ||
                status === "printing" ||
                status === "ready"
            ){

                processing++;

            }


            if(
                status ===
                "completed"
            ){

                completed++;

            }

        }
    );


    document
        .getElementById(
            "totalOrders"
        )
        .textContent =
        orders.length;


    document
        .getElementById(
            "pendingOrders"
        )
        .textContent =
        pending;


    document
        .getElementById(
            "processingOrders"
        )
        .textContent =
        processing;


    document
        .getElementById(
            "completedOrders"
        )
        .textContent =
        completed;

}


/* =====================================================
   STATUS HELPERS
===================================================== */

function allowedStatus(
    status
){

    return [
        "pending",
        "processing",
        "printing",
        "ready",
        "completed",
        "cancelled"
    ].includes(
        status
    );

}


function getStatusClass(
    status
){

    return (
        "status-" +
        String(
            status
        ).toLowerCase()
    );

}


function capitalizeStatus(
    status
){

    const text =
        String(
            status ||
            "pending"
        );


    return (
        text.charAt(0).toUpperCase() +
        text.slice(1)
    );

}


/* =====================================================
   QUANTITY
===================================================== */

function extractQuantity(
    details
){

    if(!details){

        return "1";

    }


    const text =
        String(details);


    const match =
        text.match(
            /quantity\s*[:=-]?\s*(\d+)/i
        );


    if(match){

        return match[1];

    }


    return "1";

}


/* =====================================================
   SAFE ID
===================================================== */

function safeId(
    value
){

    return String(
        value
    ).replace(
        /[^a-zA-Z0-9_-]/g,
        "_"
    );

}


/* =====================================================
   DATE
===================================================== */

function formatDate(
    value
){

    if(!value){

        return "-";

    }


    const date =
        new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return String(value);

    }


    return date.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
){

    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   EMAIL STATUS
===================================================== */

function setEmailStatus(
    orderId,
    message,
    className
){

    const element =
        document.getElementById(
            "email-status-" +
            safeId(orderId)
        );


    if(!element){

        return;

    }


    element.textContent =
        message;


    element.className =
        "email-status " +
        className;

}


/* =====================================================
   SUCCESS
===================================================== */

function showSuccess(
    message
){

    const box =
        document.getElementById(
            "successMessage"
        );


    box.textContent =
        message;


    box.style.display =
        "block";


    setTimeout(
        function(){

            box.style.display =
                "none";

        },
        5000
    );

}


/* =====================================================
   ERROR
===================================================== */

function showError(
    message
){

    const box =
        document.getElementById(
            "errorMessage"
        );


    box.textContent =
        message;


    box.style.display =
        "block";

}


/* =====================================================
   HIDE MESSAGES
===================================================== */

function hideMessages(){

    document
        .getElementById(
            "successMessage"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "errorMessage"
        )
        .style.display =
        "none";

}

        );

}
