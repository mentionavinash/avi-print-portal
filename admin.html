<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="AviPrint Admin Panel">

<title>Admin Panel | AviPrint</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>

/* =========================================
   RESET
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f8fafc;
    color:#111827;
}


/* =========================================
   NAVBAR
========================================= */

.navbar{
    height:72px;
    background:#ffffff;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
}

.nav-container{
    width:min(1400px,94%);
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:21px;
    font-weight:800;
    color:#111827;
}

.logo-icon{
    width:38px;
    height:38px;
    border-radius:10px;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

.logo span span{
    color:#2563eb;
}

.admin-badge{
    margin-left:8px;
    padding:5px 9px;
    background:#eff6ff;
    color:#2563eb;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
}

.logout-btn{
    border:1px solid #e5e7eb;
    background:white;
    color:#374151;
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
}

.logout-btn:hover{
    background:#f3f4f6;
}


/* =========================================
   PAGE
========================================= */

.admin-page{
    width:min(1400px,94%);
    margin:auto;
    padding:35px 0 60px;
}


/* =========================================
   HEADER
========================================= */

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    margin-bottom:28px;
}

.page-header h1{
    font-size:30px;
    margin:8px 0;
}

.page-header p{
    color:#6b7280;
    font-size:13px;
}

.admin-email{
    color:#6b7280;
    font-size:12px;
}

.section-label{
    color:#2563eb;
    font-size:11px;
    font-weight:800;
    letter-spacing:1px;
}


/* =========================================
   STATS
========================================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:20px;
}

.stat-card span{
    display:block;
    color:#6b7280;
    font-size:12px;
    margin-bottom:8px;
}

.stat-card strong{
    display:block;
    font-size:25px;
    color:#111827;
}


/* =========================================
   CARD
========================================= */

.card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(15,23,42,.04);
}


/* =========================================
   TOOLBAR
========================================= */

.toolbar{
    padding:18px;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.search-box{
    width:min(420px,100%);
}

.search-box input{
    width:100%;
    height:44px;
    border:1px solid #d1d5db;
    border-radius:9px;
    padding:0 14px;
    outline:none;
    font-size:13px;
}

.search-box input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,.08);
}

.refresh-btn{
    border:1px solid #dbeafe;
    background:#eff6ff;
    color:#2563eb;
    padding:10px 15px;
    border-radius:8px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.refresh-btn:hover{
    background:#dbeafe;
}


/* =========================================
   TABLE
========================================= */

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

.orders-table{
    width:100%;
    min-width:1050px;
    border-collapse:collapse;
}

.orders-table th{
    background:#f8fafc;
    color:#6b7280;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.6px;
    text-align:left;
    padding:16px;
    border-bottom:1px solid #e5e7eb;
}

.orders-table td{
    padding:16px;
    border-bottom:1px solid #f1f5f9;
    font-size:12px;
    vertical-align:middle;
}

.orders-table tr:hover{
    background:#f8fafc;
}

.order-number{
    color:#2563eb;
    font-weight:800;
}

.user-email{
    color:#374151;
}

.service-name{
    font-weight:700;
    color:#111827;
}

.service-details{
    color:#9ca3af;
    font-size:10px;
    margin-top:4px;
}

.amount{
    font-weight:800;
}


/* =========================================
   STATUS
========================================= */

.status-select{
    height:36px;
    border:1px solid #d1d5db;
    border-radius:8px;
    padding:0 9px;
    font-size:11px;
    font-weight:700;
    background:white;
    outline:none;
    cursor:pointer;
}

.status-select:focus{
    border-color:#2563eb;
}

.status-select.pending{
    color:#92400e;
    background:#fef3c7;
}

.status-select.processing{
    color:#1d4ed8;
    background:#dbeafe;
}

.status-select.completed{
    color:#166534;
    background:#dcfce7;
}

.status-select.cancelled{
    color:#991b1b;
    background:#fee2e2;
}


/* =========================================
   VIEW BUTTON
========================================= */

.view-btn{
    border:1px solid #dbeafe;
    background:#eff6ff;
    color:#2563eb;
    padding:7px 11px;
    border-radius:7px;
    cursor:pointer;
    font-size:10px;
    font-weight:700;
}

.view-btn:hover{
    background:#dbeafe;
}


/* =========================================
   LOADING
========================================= */

.loading{
    padding:60px 20px;
    text-align:center;
    color:#6b7280;
    font-size:13px;
}

.hidden{
    display:none !important;
}


/* =========================================
   EMPTY
========================================= */

.empty{
    padding:60px 20px;
    text-align:center;
    color:#6b7280;
    font-size:13px;
}


/* =========================================
   ERROR
========================================= */

.error-box{
    padding:20px;
    margin:20px;
    border-radius:10px;
    background:#fef2f2;
    border:1px solid #fecaca;
    color:#b91c1c;
    font-size:12px;
}


/* =========================================
   MODAL
========================================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:9999;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(520px,100%);
    background:white;
    border-radius:18px;
    padding:25px;
    box-shadow:0 25px 80px rgba(0,0,0,.2);
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-header h2{
    font-size:20px;
}

.close-btn{
    width:34px;
    height:34px;
    border:0;
    background:#f3f4f6;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

.modal-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:12px 0;
    border-bottom:1px solid #f1f5f9;
    font-size:12px;
}

.modal-row span{
    color:#6b7280;
}

.modal-row strong{
    text-align:right;
    color:#111827;
    max-width:65%;
    word-break:break-word;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:900px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .admin-page{
        width:92%;
        padding-top:25px;
    }

    .page-header{
        flex-direction:column;
        align-items:flex-start;
    }

    .page-header h1{
        font-size:25px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .toolbar{
        flex-direction:column;
        align-items:stretch;
    }

    .search-box{
        width:100%;
    }

    .refresh-btn{
        width:100%;
    }

}

</style>

</head>


<body>


<!-- =========================================
     NAVBAR
========================================= -->

<header class="navbar">

<div class="nav-container">

<div class="logo">

<span class="logo-icon">
A
</span>

<span>
Avi<span>Print</span>
</span>

</span>

</div>


<button
type="button"
class="logout-btn"
id="logoutButton">

Logout

</div>

<!-- =========================================

<main class="admin-page">


<div class="page-header">

<div>

<span class="section-label">

</span>

<p>
Manage customer orders and update their status.
</p>

</div>

<!-- =========================================

<div class="stats">


<div class="stat-card">

Total Orders
</span>

<strong id="totalOrders">

</strong>

<div class="stat-card">

</span>

<strong id="processingOrders">

</strong>

<div class="stat-card">

<span>
Completed
</span>

<strong id="completedOrders">
0
</strong>

</div>


</div>


<!-- =========================================
     ORDERS CARD
========================================= -->

<div class="card">


<div class="toolbar">

<!-- =========================================

========================================= -->

<div
class="modal"
id="orderModal">

<script>

/* =========================================
   SUPABASE
========================================= */

if(
typeof window.supabase === "undefined"
){

console.error(
"Supabase library not loaded."
);

}

if(
typeof supabaseClient === "undefined"
){

console.error(
"supabaseClient not found. Check config.js"
);

}


/* =========================================
   ADMIN EMAIL
========================================= */

const ADMIN_EMAIL =
"aviinformatics@gmail.com";


/* =========================================
   ELEMENTS
========================================= */

const adminEmail =
document.getElementById("adminEmail");

const totalOrders =
document.getElementById("totalOrders");

const pendingOrders =
document.getElementById("pendingOrders");

const processingOrders =
document.getElementById("processingOrders");

const completedOrders =
document.getElementById("completedOrders");

const ordersBody =
document.getElementById("ordersBody");

const loading =
document.getElementById("loading");

const empty =
document.getElementById("empty");

const tableWrapper =
document.getElementById("tableWrapper");

const errorBox =
document.getElementById("errorBox");

const searchInput =
document.getElementById("searchInput");

const refreshButton =
document.getElementById("refreshButton");

const logoutButton =
document.getElementById("logoutButton");

const orderModal =
document.getElementById("orderModal");

const modalDetails =
document.getElementById("modalDetails");

const closeModal =
document.getElementById("closeModal");


let allOrders = [];


/* =========================================
   CHECK SUPABASE
========================================= */

if(
typeof supabaseClient === "undefined" ||
!supabaseClient
){

adminEmail.textContent =
"Supabase client missing.";

throw new Error(
"supabaseClient is not available."
);

}


/* =========================================
   CHECK ADMIN SESSION
========================================= */

async function checkAdmin(){

try{

const {
data,
error
} =
await supabaseClient.auth.getSession();


if(error){

throw error;

}


const session =
data.session;


if(
!session ||
!session.user
){

window.location.replace(
"login.html"
);

return false;

}


const email =
(
session.user.email ||
""
).toLowerCase();


if(
email !==
ADMIN_EMAIL.toLowerCase()
){

alert(
"Access denied. Admin account required."
);

await supabaseClient.auth.signOut();

window.location.replace(
"login.html"
);

return false;

}


adminEmail.textContent =
"Logged in as Admin: " +
session.user.email;


return true;

}
catch(error){

console.error(
"Admin session error:",
error
);

adminEmail.textContent =
"Session error";

return false;

}

}


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders(){

loading.classList.remove(
"hidden"
);

tableWrapper.classList.add(
"hidden"
);

empty.classList.add(
"hidden"
);

errorBox.classList.add(
"hidden"
);

ordersBody.innerHTML =
"";


try{

const {
data,
error
} =
await supabaseClient
.from("orders")
.select(`
id,
order_number,
user_id,
user_email,
service_name,
service_details,
order_date,
status,
amount,
created_at
`)
.order(
"created_at",
{
ascending:false
}
);


if(error){

throw error;

}


allOrders =
data || [];


updateStats(
allOrders
);


loading.classList.add(
"hidden"
);


renderOrders(
allOrders
);

}
catch(error){

console.error(
"ORDER LOAD ERROR:",
error
);

loading.classList.add(
"hidden"
);

errorBox.textContent =
"Unable to load orders: " +
(
error.message ||
"Unknown error"
);

errorBox.classList.remove(
"hidden"
);

}

}


/* =========================================
   UPDATE STATS
========================================= */

function updateStats(
orders
){

totalOrders.textContent =
orders.length;


pendingOrders.textContent =
orders.filter(
order =>
normalizeStatus(order.status)
===
"pending"
).length;


processingOrders.textContent =
orders.filter(
order =>
normalizeStatus(order.status)
===
"processing"
).length;


completedOrders.textContent =
orders.filter(
order =>
normalizeStatus(order.status)
===
"completed"
).length;

}


/* =========================================
   NORMALIZE STATUS
========================================= */

function normalizeStatus(
status
){

const value =
String(
status ||
"pending"
)
.trim()
.toLowerCase();


if(
value === "pending"
){

return "pending";

}


if(
value === "processing"
){

return "processing";

}


if(
value === "completed"
){

return "completed";

}


if(
value === "cancelled"
){

return "cancelled";

}


/*
   Unknown status ko pending
   treat karenge.
*/

return "pending";

}


/* =========================================
   RENDER ORDERS
========================================= */

function renderOrders(
orders
){

ordersBody.innerHTML =
"";


if(!orders.length){

tableWrapper.classList.add(
"hidden"
);

empty.classList.remove(
"hidden"
);

return;

}


empty.classList.add(
"hidden"
);

tableWrapper.classList.remove(
"hidden"
);


orders.forEach(
function(order){

const row =
document.createElement("tr");


const orderNumber =
order.order_number ||
(
order.id ?
order.id.substring(
0,
8
) :
"-"
);


const email =
order.user_email ||
"-";


const service =
order.service_name ||
"Print Service";


const details =
order.service_details ||
"Printing order";


const status =
normalizeStatus(
order.status
);


const amount =
Number(
order.amount || 0
).toFixed(2);


const date =
formatDate(
order.order_date ||
order.created_at
);


row.innerHTML = `

<td>

<span class="order-number">

#${escapeHTML(
orderNumber
)}

</span>

</td>


<td>

<div class="user-email">

${escapeHTML(
email
)}

</div>

</td>


<td>

<div class="service-name">

${escapeHTML(
service
)}

</div>

<div class="service-details">

${escapeHTML(
details
)}

</div>

</td>


<td>

${escapeHTML(
date
)}

</td>


<td>

<span class="amount">

₹${amount}

</span>

</td>


<td>

<select
class="status-select ${status}"
data-order-id="${escapeHTML(
order.id
)}">

<option
value="pending"
${status === "pending" ? "selected" : ""}>

Pending

</option>

<option
value="processing"
${status === "processing" ? "selected" : ""}>

Processing

</option>

<option
value="completed"
${status === "completed" ? "selected" : ""}>

Completed

</option>

<option
value="cancelled"
${status === "cancelled" ? "selected" : ""}>

Cancelled

</option>

</select>

</td>


<td>

<button
type="button"
class="view-btn"
data-order-id="${escapeHTML(
order.id
)}">

View

</button>

</td>

`;


ordersBody.appendChild(
row
);

}
);


/* =========================================
   STATUS EVENTS
========================================= */

ordersBody
.querySelectorAll(
".status-select"
)
.forEach(
function(select){

select.addEventListener(
"change",
async function(){

const orderId =
select.getAttribute(
"data-order-id"
);


const newStatus =
select.value;


/*
 IMPORTANT:
 select ki value already
 lowercase hai.
*/

await updateOrderStatus(
orderId,
newStatus
);

}
);

}
);


/* =========================================
   VIEW EVENTS
========================================= */

ordersBody
.querySelectorAll(
".view-btn"
)
.forEach(
function(button){

button.addEventListener(
"click",
function(){

const orderId =
button.getAttribute(
"data-order-id"
);


const order =
allOrders.find(
item =>
item.id === orderId
);


if(order){

showOrderDetails(
order
);

}

}
);

}
);

}


/* =========================================
   UPDATE ORDER STATUS
========================================= */

async function updateOrderStatus(
orderId,
newStatus
){

try{

/*
 ========================================
 CRITICAL FIX
 ========================================

 Database only accepts:

 pending
 processing
 completed
 cancelled

 */

const statusMap = {

"Pending":
"pending",

"Processing":
"processing",

"Completed":
"completed",

"Cancelled":
"cancelled",

"pending":
"pending",

"processing":
"processing",

"completed":
"completed",

"cancelled":
"cancelled"

};


const finalStatus =
statusMap[
String(
newStatus
)
.trim()
] ||
"pending";


console.log(
"Updating order:",
orderId
);

console.log(
"New status:",
finalStatus
);


/* ========================================
   DATABASE UPDATE
======================================== */

const {
data,
error
} =
await supabaseClient
.from("orders")
.update({

status:
finalStatus

})
.eq(
"id",
orderId
)
.select()
.single();


if(error){

throw error;

}


console.log(
"Order updated:",
data
);


/* ========================================
   UPDATE LOCAL DATA
======================================== */

const index =
allOrders.findIndex(
order =>
order.id === orderId
);


if(index !== -1){

allOrders[index].status =
finalStatus;

}


updateStats(
allOrders
);


/* ========================================
   UPDATE SELECT UI
======================================== */

const select =
document.querySelector(
`.status-select[data-order-id="${CSS.escape(orderId)}"]`
);


if(select){

select.value =
finalStatus;

select.className =
"status-select " +
finalStatus;

}


/* ========================================
   SUCCESS
======================================== */

alert(
"Order status updated successfully."
);


/*
 Reload orders so that UI and database
 remain synchronized.
*/

await loadOrders();

}
catch(error){

console.error(
"Failed to update order status:",
error
);


/*
 Reload original value
 if update failed.
*/

await loadOrders();


alert(
"Failed to update order status: " +
(
error.message ||
"Unknown error"
)
);

}

}


/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(
"input",
function(){

const query =
this.value
.toLowerCase()
.trim();


if(!query){

renderOrders(
allOrders
);

return;

}


const filtered =
allOrders.filter(
function(order){

const orderNumber =
String(
order.order_number ||
""
)
.toLowerCase();


const email =
String(
order.user_email ||
""
)
.toLowerCase();


const service =
String(
order.service_name ||
""
)
.toLowerCase();


const details =
String(
order.service_details ||
""
)
.toLowerCase();


const status =
normalizeStatus(
order.status
);


return (

orderNumber.includes(
query
) ||

email.includes(
query
) ||

service.includes(
query
) ||

details.includes(
query
) ||

status.includes(
query
)

);

}
);


renderOrders(
filtered
);

}
);


/* =========================================
   REFRESH
========================================= */

refreshButton.addEventListener(
"click",
async function(){

refreshButton.disabled =
true;

/* =========================================
   DATE
========================================= */

function formatDate(
value
){

if(!value){

return "-";

}


const date =
new Date(
value
);


if(
Number.isNaN(
date.getTime()
)
){

return "-";

}


return date.toLocaleDateString(
"en-IN",
{
day:"2-digit",
month:"short",
year:"numeric"
}
);

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
value
){

return String(
value ?? ""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}
