<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AviPrint Admin Panel</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #111827;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        /* =========================
           TOPBAR
        ========================= */

        .topbar {
            background: #111827;
            color: white;
            padding: 18px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            flex-wrap: wrap;
            gap: 15px;
        }

        .topbar h1 {
            font-size: 22px;
        }

        .admin-info {
            margin-top: 5px;
            font-size: 13px;
            opacity: .85;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 95%;
            max-width: 1500px;
            margin: 25px auto;
        }

        /* =========================
           MESSAGES
        ========================= */

        .message {
            display: none;
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        /* =========================
           CARDS
        ========================= */

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;

            box-shadow:
                0 2px 10px rgba(0,0,0,.07);
        }

        .card h3 {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
        }

        .blue {
            color: #2563eb;
        }

        .orange {
            color: #d97706;
        }

        .purple {
            color: #7c3aed;
        }

        .green {
            color: #16a34a;
        }

        /* =========================
           SECTION
        ========================= */

        .section {
            background: white;
            border-radius: 12px;
            padding: 22px;

            box-shadow:
                0 2px 10px rgba(0,0,0,.07);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            flex-wrap: wrap;
            gap: 15px;

            margin-bottom: 20px;
        }

        .section-header h2 {
            font-size: 20px;
        }

        /* =========================
           SEARCH
        ========================= */

        .search-area {
            display: grid;
            grid-template-columns: 1fr 180px auto;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            height: 44px;
            border: 1px solid #d1d5db;
            border-radius: 8px;

            padding: 0 14px;
            outline: none;
            font-size: 14px;
        }

        .search-input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37,99,235,.1);
        }

        .search-select {
            height: 44px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 0 10px;
            background: white;
        }

        .search-btn,
        .clear-btn,
        .refresh-btn {
            height: 44px;
            border: none;
            border-radius: 8px;
            padding: 0 17px;
            cursor: pointer;
            font-weight: bold;
        }

        .search-btn {
            background: #2563eb;
            color: white;
        }

        .search-btn:hover {
            background: #1d4ed8;
        }

        .clear-btn {
            background: #e5e7eb;
            color: #374151;
        }

        .refresh-btn {
            background: #2563eb;
            color: white;
        }

        /* =========================
           TABLE
        ========================= */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 1350px;
            border-collapse: collapse;
        }

        th {
            background: #f3f4f6;
            padding: 13px;
            text-align: left;

            font-size: 13px;
            white-space: nowrap;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;

            font-size: 13px;
            vertical-align: middle;
        }

        tr:hover {
            background: #fafafa;
        }

        .order-id {
            color: #2563eb;
            font-weight: bold;
            white-space: nowrap;
        }

        .customer-name {
            font-weight: bold;
        }

        .email {
            color: #374151;
            word-break: break-word;
        }

        .service {
            font-weight: 600;
        }

        .quantity {
            text-align: center;
        }

        .date {
            color: #6b7280;
            white-space: nowrap;
        }

        /* =========================
           STATUS
        ========================= */

        select.status-select {
            padding: 8px 10px;

            border: 1px solid #d1d5db;
            border-radius: 6px;

            background: white;
            cursor: pointer;

            min-width: 130px;
            font-weight: 600;
        }

        select:disabled {
            opacity: .6;
            cursor: wait;
        }

        .status-pending {
            color: #c2410c;
            background: #fff7ed !important;
        }

        .status-processing {
            color: #6d28d9;
            background: #f5f3ff !important;
        }

        .status-printing {
            color: #1d4ed8;
            background: #eff6ff !important;
        }

        .status-ready {
            color: #0e7490;
            background: #ecfeff !important;
        }

        .status-completed {
            color: #15803d;
            background: #f0fdf4 !important;
        }

        .status-cancelled {
            color: #b91c1c;
            background: #fef2f2 !important;
        }

        /* =========================
           FILE BUTTONS
        ========================= */

        .file-name {
            display: block;
            max-width: 220px;
            word-break: break-word;

            color: #374151;
            margin-bottom: 7px;
        }

        .file-buttons {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .file-btn {
            border: none;
            border-radius: 6px;
            padding: 7px 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .view-btn {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .download-btn {
            background: #dcfce7;
            color: #15803d;
        }

        .file-btn:hover {
            opacity: .8;
        }

        /* =========================
           EMAIL STATUS
        ========================= */

        .email-status {
            font-size: 11px;
            margin-top: 5px;
        }

        .email-sending {
            color: #d97706;
        }

        .email-success {
            color: #15803d;
        }

        .email-failed {
            color: #dc2626;
        }

        /* =========================
           LOADING
        ========================= */

        .loading,
        .empty {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .results-count {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 12px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .search-area {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 600px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .container {
                width: 94%;
            }

            .section {
                padding: 15px;
            }

            .topbar {
                padding: 15px;
            }

        }

    </style>

</head>


<body>

<header class="topbar">

    <div>

        <h1>
            🖨️ AviPrint Admin Panel
        </h1>

        <div
            class="admin-info"
            id="adminInfo">

            Checking admin session...

        </div>

    </div>


    <button
        class="logout-btn"
        onclick="logout()">

        Logout

    </button>

</header>


<main class="container">


    <div
        id="successMessage"
        class="message success">
    </div>


    <div
        id="errorMessage"
        class="message error">
    </div>


    <!-- =========================
         DASHBOARD CARDS
    ========================= -->

    <div class="cards">

        <div class="card">

            <h3>
                Total Orders
            </h3>

            <div
                id="totalOrders"
                class="number blue">

                0

            </div>

        </div>


        <div class="card">

            <h3>
                Pending Orders
            </h3>

            <div
                id="pendingOrders"
                class="number orange">

                0

            </div>

        </div>


        <div class="card">

            <h3>
                Processing / Printing
            </h3>

            <div
                id="processingOrders"
                class="number purple">

                0

            </div>

        </div>


        <div class="card">

            <h3>
                Completed Orders
            </h3>

            <div
                id="completedOrders"
                class="number green">

                0

            </div>

        </div>

    </div>


    <!-- =========================
         ORDERS SECTION
    ========================= -->

    <section class="section">

        <div class="section-header">

            <h2>
                📦 Customer Orders
            </h2>

            <button
                class="refresh-btn"
                onclick="loadOrders()">

                🔄 Refresh

            </button>

        </div>


        <!-- SEARCH -->

        <div class="search-area">

            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="Search customer name, email or order number...">


            <select
                id="searchType"
                class="search-select">

                <option value="all">
                    Search All
                </option>

                <option value="name">
                    Customer Name
                </option>

                <option value="email">
                    Customer Email
                </option>

                <option value="order">
                    Order Number
                </option>

            </select>


            <div>

                <button
                    class="search-btn"
                    onclick="applySearch()">

                    🔍 Search

                </button>

                <button
                    class="clear-btn"
                    onclick="clearSearch()">

                    Clear

                </button>

            </div>

        </div>


        <div
            id="resultsCount"
            class="results-count">

            Loading orders...

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Order ID
                        </th>

                        <th>
                            Customer
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Service
                        </th>

                        <th>
                            Quantity
                        </th>

                        <th>
                            File
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Date
                        </th>

                    </tr>

                </thead>


                <tbody id="ordersTableBody">

                    <tr>

                        <td
                            colspan="8"
                            class="loading">

                            Loading orders...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://pmqmewceqnxsvlhceeef.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_mWPszaFzSHbPp-OHlPGWjw_JdrMU6oQ";


/* =========================================================
   ADMIN
========================================================= */

const ADMIN_EMAIL =
    "aviinformatics@gmail.com";


/* =========================================================
   EDGE FUNCTION
========================================================= */

const EDGE_FUNCTION_NAME =
    "smart-task";


/* =========================================================
   STORAGE BUCKET
========================================================= */

const STORAGE_BUCKET =
    "print-files";


/* =========================================================
   SUPABASE CLIENT
========================================================= */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   GLOBAL ORDERS
========================================================= */

let allOrders = [];


/* =========================================================
   PAGE START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        await checkAdmin();

    }
);


/* =========================================================
   CHECK ADMIN
========================================================= */

async function checkAdmin() {

    try {

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();


        if (error) {

            throw error;

        }


        const session =
            data.session;


        if (
            !session ||
            !session.user
        ) {

            window.location.href =
                "login.html";

            return;

        }


        const email =
            session.user.email || "";


        if (
            email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
        ) {

            alert(
                "Access denied. Admin account required."
            );


            await supabaseClient.auth.signOut();


            window.location.href =
                "login.html";


            return;

        }


        document.getElementById(
            "adminInfo"
        ).textContent =
            "Logged in as Admin: " + email;


        await loadOrders();

    }

    catch (error) {

        console.error(
            "Admin check error:",
            error
        );


        showError(
            "Unable to verify admin: " +
            (
                error.message ||
                error
            )
        );

    }

}


/* =========================================================
   LOAD ORDERS
========================================================= */

async function loadOrders() {

    const tbody =
        document.getElementById(
            "ordersTableBody"
        );


    tbody.innerHTML = `
        <tr>
            <td colspan="8" class="loading">
                Loading orders...
            </td>
        </tr>
    `;


    try {

        const {
            data,
            error
        } =
        await supabaseClient
            .from("orders")
            .select(`
                id,
                order_number,
                user_id,
                service_name,
                service_details,
                order_date,
                status,
                amount,
                file_path,
                file_name,
                created_at,
                customer_email
            `)
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (error) {

            throw error;

        }


        allOrders =
            data || [];


        updateCounters(
            allOrders
        );


        renderOrders(
            allOrders
        );

    }

    catch (error) {

        console.error(
            "Load orders error:",
            error
        );


        tbody.innerHTML = `
            <tr>
                <td colspan="8" class="empty">
                    Failed to load orders.
                </td>
            </tr>
        `;


        showError(
            "Failed to load orders: " +
            (
                error.message ||
                error
            )
        );

    }

}


/* =========================================================
   RENDER ORDERS
========================================================= */

function renderOrders(
    orders
) {

    const tbody =
        document.getElementById(
            "ordersTableBody"
        );


    document.getElementById(
        "resultsCount"
    ).textContent =
        orders.length +
        " order(s) found";


    if (
        !orders ||
        orders.length === 0
    ) {

        tbody.innerHTML = `
            <tr>
                <td colspan="8" class="empty">
                    No orders found.
                </td>
            </tr>
        `;

        return;

    }


    tbody.innerHTML = "";


    orders.forEach(
        function (order) {

            tbody.appendChild(
                createOrderRow(order)
            );

        }
    );

}


/* =========================================================
   CREATE ORDER ROW
========================================================= */

function createOrderRow(
    order
) {

    const tr =
        document.createElement("tr");


    const orderId =
        order.id || "";


    const orderNumber =
        order.order_number ||
        orderId;


    /*
     * Customer name is not present
     * in the orders table.
     *
     * We therefore show a safe
     * fallback based on email.
     */

    const customerEmail =
        order.customer_email ||
        "-";


    const customerName =
        getCustomerName(
            order
        );


    const service =
        order.service_name ||
        "-";


    const quantity =
        order.quantity ||
        1;


    const status =
        String(
            order.status ||
            "pending"
        ).toLowerCase();


    const createdAt =
        order.created_at ||
        order.order_date ||
        "";


    tr.dataset.orderId =
        orderId;


    tr.dataset.orderNumber =
        orderNumber;


    tr.dataset.customerName =
        customerName;


    tr.dataset.email =
        customerEmail;


    tr.innerHTML = `

        <td>

            <span class="order-id">

                ${escapeHTML(
                    orderNumber
                )}

            </span>

        </td>


        <td>

            <span class="customer-name">

                ${escapeHTML(
                    customerName
                )}

            </span>

        </td>


        <td>

            <span class="email">

                ${escapeHTML(
                    customerEmail
                )}

            </span>


            <div
                id="email-status-${escapeHTML(
                    orderId
                )}"
                class="email-status">

            </div>

        </td>


        <td>

            <span class="service">

                ${escapeHTML(
                    service
                )}

            </span>

        </td>


        <td class="quantity">

            ${escapeHTML(
                String(quantity)
            )}

        </td>


        <td>

            ${createFileButtons(
                order
            )}

        </td>


        <td>

            <select
                class="status-select ${getStatusClass(status)}"
                data-old-status="${escapeHTML(status)}"
                onchange="changeOrderStatus(
                    '${escapeJS(orderId)}',
                    this.value,
                    this
                )">

                <option
                    value="pending"
                    ${status === "pending" ? "selected" : ""}>

                    Pending

                </option>


                <option
                    value="processing"
                    ${status === "processing" ? "selected" : ""}>

                    Processing

                </option>


                <option
                    value="printing"
                    ${status === "printing" ? "selected" : ""}>

                    Printing

                </option>


                <option
                    value="ready"
                    ${status === "ready" ? "selected" : ""}>

                    Ready

                </option>


                <option
                    value="completed"
                    ${status === "completed" ? "selected" : ""}>

                    Completed

                </option>


                <option
                    value="cancelled"
                    ${status === "cancelled" ? "selected" : ""}>

                    Cancelled

                </option>

            </select>

        </td>


        <td class="date">

            ${escapeHTML(
                formatDate(createdAt)
            )}

        </td>

    `;


    return tr;

}


/* =========================================================
   CUSTOMER NAME
========================================================= */

function getCustomerName(
    order
) {

    /*
     * Your current orders table
     * does NOT contain customer_name.
     */

    if (
        order.customer_name
    ) {

        return order.customer_name;

    }


    if (
        order.full_name
    ) {

        return order.full_name;

    }


    if (
        order.name
    ) {

        return order.name;

    }


    /*
     * Temporary fallback.
     */

    if (
        order.customer_email &&
        order.customer_email !== "-"
    ) {

        return order.customer_email
            .split("@")[0];

    }


    return "Customer";

}


/* =========================================================
   FILE BUTTONS
========================================================= */

function createFileButtons(
    order
) {

    if (
        !order.file_path
    ) {

        return `
            <span class="file-name">
                No file
            </span>
        `;

    }


    const fileName =
        order.file_name ||
        "Document";


    return `

        <span class="file-name">

            ${escapeHTML(
                fileName
            )}

        </span>


        <div class="file-buttons">

            <button
                class="file-btn view-btn"
                onclick="viewFile(
                    '${escapeJS(
                        order.file_path
                    )}'
                )">

                👁 View

            </button>


            <button
                class="file-btn download-btn"
                onclick="downloadFile(
                    '${escapeJS(
                        order.file_path
                    )}',
                    '${escapeJS(
                        fileName
                    )}'
                )">

                ⬇ Download

            </button>

        </div>

    `;

}


/* =========================================================
   VIEW FILE
========================================================= */

async function viewFile(
    filePath
) {

    try {

        const {
            data,
            error
        } =
        await supabaseClient.storage
            .from(STORAGE_BUCKET)
            .createSignedUrl(
                filePath,
                300
            );


        if (error) {

            throw error;

        }


        if (
            !data ||
            !data.signedUrl
        ) {

            throw new Error(
                "Unable to create file URL."
            );

        }


        window.open(
            data.signedUrl,
            "_blank"
        );

    }

    catch (error) {

        console.error(
            "View file error:",
            error
        );


        showError(
            "Unable to view file: " +
            (
                error.message ||
                error
            )
        );

    }

}


/* =========================================================
   DOWNLOAD FILE
========================================================= */

async function downloadFile(
    filePath,
    fileName
) {

    try {

        const {
            data,
            error
        } =
        await supabaseClient.storage
            .from(STORAGE_BUCKET)
            .download(
                filePath
            );


        if (error) {

            throw error;

        }


        const blob =
            data;


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                "a"
            );


        a.href =
            url;


        a.download =
            fileName ||
            "download";


        document.body.appendChild(
            a
        );


        a.click();


        a.remove();


        URL.revokeObjectURL(
            url
        );

    }

    catch (error) {

        console.error(
            "Download error:",
            error
        );


        showError(
            "Unable to download file: " +
            (
                error.message ||
                error
            )
        );

    }

}


/* =========================================================
   CHANGE STATUS
========================================================= */

async function changeOrderStatus(
    orderId,
    newStatus,
    selectElement
) {

    if (!orderId) {

        showError(
            "Order ID is missing."
        );

        return;

    }


    const oldStatus =
        selectElement.dataset.oldStatus ||
        "pending";


    const row =
        selectElement.closest("tr");


    const orderNumber =
        row.dataset.orderNumber ||
        orderId;


    const customerName =
        row.dataset.customerName ||
        "Customer";


    const customerEmail =
        row.dataset.email ||
        "";


    selectElement.disabled =
        true;


    hideMessages();


    try {

        /* =========================
           UPDATE DATABASE
        ========================= */

        const {
            error
        } =
        await supabaseClient
            .from("orders")
            .update({
                status: newStatus
            })
            .eq(
                "id",
                orderId
            );


        if (error) {

            throw error;

        }


        selectElement.dataset.oldStatus =
            newStatus;


        selectElement.className =
            "status-select " +
            getStatusClass(
                newStatus
            );


        showSuccess(
            "Order " +
            orderNumber +
            " updated to " +
            newStatus +
            "."
        );


        /* =========================
           SEND EMAIL
        ========================= */

        if (
            customerEmail &&
            customerEmail !== "-"
        ) {

            setEmailStatus(
                orderId,
                "Sending email...",
                "email-sending"
            );


            try {

                await sendOrderEmail({

                    email:
                        customerEmail,

                    orderNumber:
                        orderNumber,

                    service:
                        getOrderService(
                            orderId
                        ),

                    details:
                        getOrderDetails(
                            orderId
                        ),

                    amount:
                        getOrderAmount(
                            orderId
                        ),

                    status:
                        formatStatus(
                            newStatus
                        ),

                    fileName:
                        getOrderFileName(
                            orderId
                        )

                });


                setEmailStatus(
                    orderId,
                    "✓ Email sent",
                    "email-success"
                );

            }

            catch (emailError) {

                console.error(
                    "Email failed:",
                    emailError
                );


                setEmailStatus(
                    orderId,
                    "✗ Email failed",
                    "email-failed"
                );


                showError(
                    "Order updated, but customer email failed: " +
                    (
                        emailError.message ||
                        "Email service error"
                    )
                );

            }

        }

        else {

            setEmailStatus(
                orderId,
                "No email available",
                "email-failed"
            );

        }


        await loadCounters();

    }

    catch (error) {

        console.error(
            "Status update error:",
            error
        );


        selectElement.value =
            oldStatus;


        selectElement.className =
            "status-select " +
            getStatusClass(
                oldStatus
            );


        showError(
            "Failed to update order status: " +
            (
                error.message ||
                error
            )
        );

    }

    finally {

        selectElement.disabled =
            false;

    }

}


/* =========================================================
   GET ORDER SERVICE
========================================================= */

function getOrderService(
    orderId
) {

    const order =
        allOrders.find(
            function (item) {

                return String(
                    item.id
                ) === String(
                    orderId
                );

            }
        );


    return order?.service_name ||
        "-";

}


/* =========================================================
   GET ORDER DETAILS
========================================================= */

function getOrderDetails(
    orderId
) {

    const order =
        allOrders.find(
            function (item) {

                return String(
                    item.id
                ) === String(
                    orderId
                );

            }
        );


    return order?.service_details ||
        "-";

}


/* =========================================================
   GET ORDER AMOUNT
========================================================= */

function getOrderAmount(
    orderId
) {

    const order =
        allOrders.find(
            function (item) {

                return String(
                    item.id
                ) === String(
                    orderId
                );

            }
        );


    if (
        order?.amount !== null &&
        order?.amount !== undefined
    ) {

        return "₹" +
            Number(
                order.amount
            ).toFixed(2);

    }


    return "₹0.00";

}


/* =========================================================
   GET FILE NAME
========================================================= */

function getOrderFileName(
    orderId
) {

    const order =
        allOrders.find(
            function (item) {

                return String(
                    item.id
                ) === String(
                    orderId
                );

            }
        );


    return order?.file_name ||
        "-";

}


/* =========================================================
   SEND ORDER EMAIL
========================================================= */

async function sendOrderEmail(
    data
) {

    console.log(
        "Calling Edge Function:",
        EDGE_FUNCTION_NAME
    );


    const {
        data: result,
        error
    } =
    await supabaseClient.functions.invoke(
        EDGE_FUNCTION_NAME,
        {
            body: data
        }
    );


    console.log(
        "Edge Function result:",
        result
    );


    if (error) {

        console.error(
            "Edge Function error:",
            error
        );


        throw new Error(
            error.message ||
            "Failed to call Edge Function."
        );

    }


    if (
        result &&
        result.success === false
    ) {

        throw new Error(
            result.error ||
            result.message ||
            "Email sending failed."
        );

    }


    return result;

}


/* =========================================================
   LOAD COUNTERS
========================================================= */

async function loadCounters() {

    try {

        const {
            data,
            error
        } =
        await supabaseClient
            .from("orders")
            .select("status");


        if (error) {

            console.error(
                error
            );

            return;

        }


        updateCounters(
            data || []
        );

    }

    catch (error) {

        console.error(
            "Counter error:",
            error
        );

    }

}


/* =========================================================
   UPDATE COUNTERS
========================================================= */

function updateCounters(
    orders
) {

    let pending = 0;

    let processing = 0;

    let completed = 0;


    orders.forEach(
        function (order) {

            const status =
                String(
                    order.status ||
                    ""
                ).toLowerCase();


            if (
                status ===
                "pending"
            ) {

                pending++;

            }


            if (
                status === "processing" ||
                status === "printing" ||
                status === "ready"
            ) {

                processing++;

            }


            if (
                status ===
                "completed"
            ) {

                completed++;

            }

        }
    );


    document.getElementById(
        "totalOrders"
    ).textContent =
        orders.length;


    document.getElementById(
        "pendingOrders"
    ).textContent =
        pending;


    document.getElementById(
        "processingOrders"
    ).textContent =
        processing;


    document.getElementById(
        "completedOrders"
    ).textContent =
        completed;

}


/* =========================================================
   SEARCH
========================================================= */

function applySearch() {

    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    const type =
        document.getElementById(
            "searchType"
        ).value;


    if (!search) {

        renderOrders(
            allOrders
        );

        return;

    }


    const filtered =
        allOrders.filter(
            function (order) {

                const name =
                    getCustomerName(
                        order
                    ).toLowerCase();


                const email =
                    String(
                        order.customer_email ||
                        ""
                    ).toLowerCase();


                const orderNumber =
                    String(
                        order.order_number ||
                        ""
                    ).toLowerCase();


                if (
                    type === "name"
                ) {

                    return name.includes(
                        search
                    );

                }


                if (
                    type === "email"
                ) {

                    return email.includes(
                        search
                    );

                }


                if (
                    type === "order"
                ) {

                    return orderNumber.includes(
                        search
                    );

                }


                return (
                    name.includes(search) ||
                    email.includes(search) ||
                    orderNumber.includes(search)
                );

            }
        );


    renderOrders(
        filtered
    );

}


/* =========================================================
   SEARCH ENTER KEY
========================================================= */

document.getElementById(
    "searchInput"
).addEventListener(
    "keydown",
    function (event) {

        if (
            event.key ===
            "Enter"
        ) {

            applySearch();

        }

    }
);


/* =========================================================
   CLEAR SEARCH
========================================================= */

function clearSearch() {

    document.getElementById(
        "searchInput"
    ).value = "";


    document.getElementById(
        "searchType"
    ).value =
        "all";


    renderOrders(
        allOrders
    );

}


/* =========================================================
   STATUS CLASS
========================================================= */

function getStatusClass(
    status
) {

    return (
        "status-" +
        String(status)
            .toLowerCase()
    );

}


/* =========================================================
   FORMAT STATUS
========================================================= */

function formatStatus(
    status
) {

    const value =
        String(
            status || ""
        ).toLowerCase();


    return value.charAt(0).toUpperCase() +
        value.slice(1);

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(
    value
) {

    if (!value) {

        return "-";

    }


    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return String(value);

    }


    return date.toLocaleString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   ESCAPE JS
========================================================= */

function escapeJS(
    value
) {

    return String(value)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /"/g,
            '\\"'
        )
        .replace(
            /\n/g,
            "\\n"
        )
        .replace(
            /\r/g,
            "\\r"
        );

}


/* =========================================================
   SUCCESS
========================================================= */

function showSuccess(
    message
) {

    const box =
        document.getElementById(
            "successMessage"
        );


    box.textContent =
        message;


    box.style.display =
        "block";


    setTimeout(
        function () {

            box.style.display =
                "none";

        },
        5000
    );

}


/* =========================================================
   ERROR
========================================================= */

function showError(
    message
) {

    const box =
        document.getElementById(
            "errorMessage"
        );


    box.textContent =
        message;


    box.style.display =
        "block";

}


/* =========================================================
   HIDE MESSAGES
========================================================= */

function hideMessages() {

    document.getElementById(
        "successMessage"
    ).style.display =
        "none";


    document.getElementById(
        "errorMessage"
    ).style.display =
        "none";

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

    try {

        await supabaseClient.auth.signOut();

    }

    catch (error) {

        console.error(
            "Logout error:",
            error
        );

    }


    window.location.href =
        "login.html";

}


/* =========================================================
   AUTH LISTENER
========================================================= */

supabaseClient.auth.onAuthStateChange(
    function (
        event,
        session
    ) {

        if (
            event ===
            "SIGNED_OUT"
        ) {

            window.location.href =
                "login.html";

        }

    }
);
