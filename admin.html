<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AviPrint Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
    color:#111827;
}

.topbar{
    background:#111827;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.topbar h1{
    font-size:22px;
}

.admin-info{
    margin-top:5px;
    font-size:13px;
    color:#d1d5db;
}

.logout-btn{
    background:#ef4444;
    border:none;
    color:white;
    padding:10px 18px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.logout-btn:hover{
    background:#dc2626;
}

.container{
    width:95%;
    max-width:1500px;
    margin:25px auto;
}

.message{
    display:none;
    padding:14px 18px;
    border-radius:8px;
    margin-bottom:20px;
    font-size:14px;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:22px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.card h3{
    font-size:14px;
    color:#6b7280;
    margin-bottom:10px;
}

.number{
    font-size:30px;
    font-weight:bold;
}

.blue{color:#2563eb;}
.orange{color:#d97706;}
.purple{color:#7c3aed;}
.green{color:#16a34a;}

.section{
    background:white;
    border-radius:12px;
    padding:22px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.section-header h2{
    font-size:20px;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.search-box{
    width:300px;
    max-width:100%;
    height:42px;
    border:1px solid #d1d5db;
    border-radius:8px;
    padding:0 13px;
    outline:none;
    font-size:14px;
}

.search-box:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

.refresh-btn{
    background:#2563eb;
    border:none;
    color:white;
    padding:10px 17px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.refresh-btn:hover{
    background:#1d4ed8;
}

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1250px;
    border-collapse:collapse;
}

th{
    background:#f3f4f6;
    text-align:left;
    padding:13px;
    font-size:13px;
    white-space:nowrap;
}

td{
    padding:13px;
    border-bottom:1px solid #e5e7eb;
    font-size:13px;
    vertical-align:middle;
}

tr:hover{
    background:#fafafa;
}

.order-id{
    color:#2563eb;
    font-weight:bold;
}

.customer-name{
    font-weight:bold;
}

.email{
    color:#374151;
    word-break:break-word;
}

.service{
    font-weight:600;
}

.quantity{
    text-align:center;
}

.details{
    color:#6b7280;
    max-width:220px;
}

.file-name{
    max-width:220px;
    word-break:break-word;
    color:#374151;
}

.date{
    color:#6b7280;
    white-space:nowrap;
}

select{
    padding:8px 10px;
    border:1px solid #d1d5db;
    border-radius:6px;
    background:white;
    cursor:pointer;
    min-width:130px;
    font-weight:600;
}

select:disabled{
    opacity:.6;
    cursor:wait;
}

.status-pending{
    color:#c2410c;
    background:#fff7ed;
}

.status-processing{
    color:#6d28d9;
    background:#f5f3ff;
}

.status-printing{
    color:#1d4ed8;
    background:#eff6ff;
}

.status-ready{
    color:#0e7490;
    background:#ecfeff;
}

.status-completed{
    color:#15803d;
    background:#f0fdf4;
}

.status-cancelled{
    color:#b91c1c;
    background:#fef2f2;
}

.file-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.file-btn{
    border:none;
    border-radius:6px;
    padding:7px 10px;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
}

.view-btn{
    background:#2563eb;
    color:white;
}

.download-btn{
    background:#16a34a;
    color:white;
}

.file-btn:hover{
    opacity:.85;
}

.email-status{
    font-size:11px;
    margin-top:5px;
}

.email-sending{
    color:#d97706;
}

.email-success{
    color:#15803d;
}

.email-failed{
    color:#dc2626;
}

.loading,
.empty{
    text-align:center;
    padding:40px;
    color:#6b7280;
}

.results-info{
    margin-bottom:12px;
    font-size:13px;
    color:#6b7280;
}

@media(max-width:900px){

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .cards{
        grid-template-columns:1fr;
    }

    .container{
        width:94%;
    }

    .section{
        padding:15px;
    }

    .topbar{
        padding:15px;
    }

    .search-box{
        width:100%;
    }

    .controls{
        width:100%;
    }

}

</style>

</head>


<body>


<header class="topbar">

<div>

<h1>🖨️ AviPrint Admin Panel</h1>

<div
id="adminInfo"
class="admin-info"
>
Checking admin session...

</div>

class="logout-btn"
onclick="logout()"

Logout

<main class="container">

id="successMessage"

id="errorMessage"
class="message error"

<!-- DASHBOARD -->

<div class="cards">

<div class="card">

<h3>Total Orders</h3>

<div
id="totalOrders"

>
0

id="pendingOrders"

>
0

<script>


/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://pmqmewceqnxsvlhceeef.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_mWPszaFzSHbPp-OHlPGWjw_JdrMU6oQ";


/* =====================================================
   ADMIN
===================================================== */

const ADMIN_EMAIL =
"aviinformatics@gmail.com";


/* =====================================================
   EMAIL EDGE FUNCTION
===================================================== */

const EDGE_FUNCTION_NAME =
"send-order-email";


/* =====================================================
   SUPABASE CLIENT
===================================================== */

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =====================================================
   GLOBAL ORDERS
===================================================== */

let allOrders = [];


/* =====================================================
   PAGE START
===================================================== */

document.addEventListener(
"DOMContentLoaded",
async function(){

    await checkAdmin();

});


/* =====================================================
   CHECK ADMIN
===================================================== */

async function checkAdmin(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .auth
        .getSession();


        if(error){

            throw error;

        }


        const session =
        data.session;


        if(
            !session ||
            !session.user
        ){

            window.location.href =
            "login.html";

            return;

        }


        const email =
        session.user.email || "";


        if(
            email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
        ){

            alert(
                "Access denied. Admin account required."
            );


            await supabaseClient
            .auth
            .signOut();


            window.location.href =
            "login.html";

            return;

        }


        document.getElementById(
            "adminInfo"
        ).textContent =
        "Logged in as Admin: " + email;


        await loadOrders();

    }

    catch(error){

        console.error(
            "Admin check error:",
            error
        );


        showError(
            error.message ||
            "Unable to verify admin."
        );

    }

}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

    const tbody =
    document.getElementById(
        "ordersTableBody"
    );


    tbody.innerHTML = `
        <tr>
            <td
                colspan="9"
                class="loading"
            >
                Loading orders...
            </td>
        </tr>
    `;


    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .from("orders")
        .select(`
            id,
            order_number,
            user_id,
            service_name,
            service_details,
            order_date,
            status,
            amount,
            file_path,
            file_name,
            created_at,
            customer_email
        `)
        .order(
            "created_at",
            {
                ascending:false
            }
        );


        if(error){

            throw error;

        }


        allOrders =
        data || [];


        updateCounters(
            allOrders
        );


        renderOrders(
            allOrders
        );

    }

    catch(error){

        console.error(
            "Load orders error:",
            error
        );


        tbody.innerHTML = `
            <tr>
                <td
                    colspan="9"
                    class="empty"
                >
                    Failed to load orders.
                </td>
            </tr>
        `;


        showError(
            "Failed to load orders: " +
            (
                error.message ||
                error
            )
        );

    }

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(orders){

    const tbody =
    document.getElementById(
        "ordersTableBody"
    );


    document.getElementById(
        "resultsInfo"
    ).textContent =
    orders.length +
    " order(s) found";


    if(
        !orders ||
        orders.length === 0
    ){

        tbody.innerHTML = `
            <tr>
                <td
                    colspan="9"
                    class="empty"
                >
                    No orders found.
                </td>
            </tr>
        `;

        return;

    }


    tbody.innerHTML = "";


    orders.forEach(
        function(order){

            tbody.appendChild(
                createOrderRow(order)
            );

        }
    );

}


/* =====================================================
   CREATE ORDER ROW
===================================================== */

function createOrderRow(order){

    const tr =
    document.createElement("tr");


    const orderId =
    order.id || "";


    const orderNumber =
    order.order_number ||
    orderId;


    /*
       CUSTOMER NAME

       Your current orders table does not have a
       customer_name column.

       So we first try any available name field.
       If none exists, we show "Customer".
    */

    const customerName =
    order.customer_name ||
    order.full_name ||
    order.name ||
    "Customer";


    const email =
    order.customer_email ||
    "-";


    const service =
    order.service_name ||
    "-";


    const details =
    order.service_details ||
    "-";


    const quantity =
    order.quantity ||
    1;


    const status =
    String(
        order.status ||
        "pending"
    ).toLowerCase();


    const fileName =
    order.file_name ||
    "";


    const filePath =
    order.file_path ||
    "";


    const createdAt =
    order.created_at ||
    order.order_date ||
    "";


    tr.dataset.orderId =
    orderId;


    tr.dataset.orderNumber =
    orderNumber;


    tr.dataset.customerName =
    customerName;


    tr.dataset.email =
    email;


    tr.dataset.service =
    service;


    tr.dataset.details =
    details;


    tr.dataset.fileName =
    fileName;


    tr.dataset.filePath =
    filePath;


    let fileHTML =
    `<span class="file-name">No file</span>`;


    if(filePath){

        fileHTML = `

        <div class="file-actions">

            <button
                class="file-btn view-btn"
                onclick="viewFile(
                    '${escapeJS(filePath)}'
                )"
            >
                👁 View
            </button>


            <button
                class="file-btn download-btn"
                onclick="downloadFile(
                    '${escapeJS(filePath)}',
                    '${escapeJS(fileName)}'
                )"
            >
                ⬇ Download
            </button>

        </div>

        <div
            class="file-name"
        >
            ${escapeHTML(fileName || "File")}
        </div>

        `;

    }


    tr.innerHTML = `

        <td>

            <span class="order-id">

                ${escapeHTML(
                    String(orderNumber)
                )}

            </span>

        </td>


        <td>

            <span class="customer-name">

                ${escapeHTML(
                    String(customerName)
                )}

            </span>

        </td>


        <td>

            <span class="email">

                ${escapeHTML(
                    String(email)
                )}

            </span>


            <div
                id="email-status-${escapeHTML(
                    String(orderId)
                )}"
                class="email-status"
            ></div>

        </td>


        <td>

            <span class="service">

                ${escapeHTML(
                    String(service)
                )}

            </span>

        </td>


        <td>

            <span class="details">

                ${escapeHTML(
                    String(details)
                )}

            </span>

        </td>


        <td class="quantity">

            ${escapeHTML(
                String(quantity)
            )}

        </td>


        <td>

            ${fileHTML}

        </td>


        <td>

            <select
                class="${getStatusClass(status)}"
                data-old-status="${escapeHTML(status)}"
                onchange="changeOrderStatus(
                    '${escapeJS(orderId)}',
                    this.value,
                    this
                )"
            >

                <option
                    value="pending"
                    ${status === "pending" ? "selected" : ""}
                >
                    Pending
                </option>


                <option
                    value="processing"
                    ${status === "processing" ? "selected" : ""}
                >
                    Processing
                </option>


                <option
                    value="printing"
                    ${status === "printing" ? "selected" : ""}
                >
                    Printing
                </option>


                <option
                    value="ready"
                    ${status === "ready" ? "selected" : ""}
                >
                    Ready
                </option>


                <option
                    value="completed"
                    ${status === "completed" ? "selected" : ""}
                >
                    Completed
                </option>


                <option
                    value="cancelled"
                    ${status === "cancelled" ? "selected" : ""}
                >
                    Cancelled
                </option>

            </select>

        </td>


        <td class="date">

            ${escapeHTML(
                formatDate(createdAt)
            )}

        </td>

    `;


    return tr;

}


/* =====================================================
   SEARCH
===================================================== */

function filterOrders(){

    const search =
    document
    .getElementById(
        "searchInput"
    )
    .value
    .trim()
    .toLowerCase();


    if(!search){

        renderOrders(
            allOrders
        );

        return;

    }


    const filtered =
    allOrders.filter(
        function(order){

            const orderNumber =
            String(
                order.order_number || ""
            ).toLowerCase();


            const email =
            String(
                order.customer_email || ""
            ).toLowerCase();


            const name =
            String(
                order.customer_name ||
                order.full_name ||
                order.name ||
                ""
            ).toLowerCase();


            return (
                orderNumber.includes(search) ||
                email.includes(search) ||
                name.includes(search)
            );

        }
    );


    renderOrders(
        filtered
    );

}


/* =====================================================
   STATUS UPDATE
===================================================== */

async function changeOrderStatus(
    orderId,
    newStatus,
    selectElement
){

    if(!orderId){

        showError(
            "Order ID is missing."
        );

        return;

    }


    const oldStatus =
    selectElement.dataset.oldStatus ||
    "pending";


    const row =
    selectElement.closest("tr");


    const orderNumber =
    row.dataset.orderNumber ||
    orderId;


    const customerName =
    row.dataset.customerName ||
    "Customer";


    const customerEmail =
    row.dataset.email ||
    "";


    const service =
    row.dataset.service ||
    "-";


    const details =
    row.dataset.details ||
    "-";


    const fileName =
    row.dataset.fileName ||
    "-";


    selectElement.disabled =
    true;


    hideMessages();


    try{


        /* =========================================
           DATABASE STATUS UPDATE
        ========================================= */

        const {
            error
        } =
        await supabaseClient
        .from("orders")
        .update({

            status:newStatus

        })
        .eq(
            "id",
            orderId
        );


        if(error){

            throw error;

        }


        selectElement.dataset.oldStatus =
        newStatus;


        selectElement.className =
        getStatusClass(
            newStatus
        );


        showSuccess(
            "Order " +
            orderNumber +
            " updated to " +
            newStatus +
            "."
        );


        /* =========================================
           SEND EMAIL
        ========================================= */

        if(
            customerEmail &&
            customerEmail !== "-"
        ){

            setEmailStatus(
                orderId,
                "Sending email...",
                "email-sending"
            );


            try{

                await sendOrderEmail({

                    email:
                    customerEmail,

                    orderId:
                    orderId,

                    orderNumber:
                    orderNumber,

                    customerName:
                    customerName,

                    service:
                    service,

                    details:
                    details,

                    fileName:
                    fileName,

                    status:
                    capitalizeStatus(
                        newStatus
                    )

                });


                setEmailStatus(
                    orderId,
                    "✓ Email sent",
                    "email-success"
                );

            }

            catch(emailError){

                console.error(
                    "Email failed:",
                    emailError
                );


                setEmailStatus(
                    orderId,
                    "✗ Email failed",
                    "email-failed"
                );


                showError(
                    "Order updated, but customer email failed: " +
                    (
                        emailError.message ||
                        "Email service error"
                    )
                );

            }

        }

        else{

            setEmailStatus(
                orderId,
                "No email available",
                "email-failed"
            );

        }


        await loadCounters();

    }

    catch(error){

        console.error(
            "Status update error:",
            error
        );


        selectElement.value =
        oldStatus;


        selectElement.className =
        getStatusClass(
            oldStatus
        );


        showError(
            "Failed to update order status: " +
            (
                error.message ||
                error
            )
        );

    }

    finally{

        selectElement.disabled =
        false;

    }

}


/* =====================================================
   SEND ORDER EMAIL
===================================================== */

async function sendOrderEmail(data){

    console.log(
        "Calling Edge Function:",
        EDGE_FUNCTION_NAME
    );


    const {
        data:resultData,
        error
    } =
    await supabaseClient
    .functions
    .invoke(
        EDGE_FUNCTION_NAME,
        {
            body:data
        }
    );


    console.log(
        "Edge Function result:",
        resultData,
        error
    );


    if(error){

        throw new Error(
            error.message ||
            "Failed to send a request to the Edge Function"
        );

    }


    if(
        resultData &&
        resultData.success === false
    ){

        throw new Error(
            resultData.error ||
            resultData.message ||
            "Email sending failed."
        );

    }


    return resultData;

}


/* =====================================================
   VIEW FILE
===================================================== */

async function viewFile(
    filePath
){

    if(!filePath){

        showError(
            "File path is missing."
        );

        return;

    }


    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .storage
        .from("print-files")
        .createSignedUrl(
            filePath,
            3600
        );


        if(error){

            throw error;

        }


        if(
            !data ||
            !data.signedUrl
        ){

            throw new Error(
                "Unable to create file URL."
            );

        }


        window.open(
            data.signedUrl,
            "_blank"
        );

    }

    catch(error){

        console.error(
            "View file error:",
            error
        );


        showError(
            "Unable to view file: " +
            (
                error.message ||
                error
            )
        );

    }

}


/* =====================================================
   DOWNLOAD FILE
===================================================== */

async function downloadFile(
    filePath,
    fileName
){

    if(!filePath){

        showError(
            "File path is missing."
        );

        return;

    }


    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .storage
        .from("print-files")
        .download(
            filePath
        );


        if(error){

            throw error;

        }


        if(!data){

            throw new Error(
                "File could not be downloaded."
            );

        }


        const url =
        URL.createObjectURL(
            data
        );


        const a =
        document.createElement("a");


        a.href =
        url;


        a.download =
        fileName ||
        "AviPrint-file";


        document.body.appendChild(a);


        a.click();


        a.remove();


        URL.revokeObjectURL(
            url
        );

    }

    catch(error){

        console.error(
            "Download file error:",
            error
        );


        showError(
            "Unable to download file: " +
            (
                error.message ||
                error
            )
        );

    }

}


/* =====================================================
   COUNTERS
===================================================== */

async function loadCounters(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .from("orders")
        .select("status");


        if(error){

            console.error(
                "Counter error:",
                error
            );

            return;

        }


        updateCounters(
            data || []
        );

    }

    catch(error){

        console.error(
            "Counter error:",
            error
        );

    }

}


/* =====================================================
   UPDATE COUNTERS
===================================================== */

function updateCounters(
    orders
){

    let pending = 0;

    let processing = 0;

    let completed = 0;


    orders.forEach(
        function(order){

            const status =
            String(
                order.status || ""
            ).toLowerCase();


            if(
                status ===
                "pending"
            ){

                pending++;

            }


            if(
                status === "processing" ||
                status === "printing" ||
                status === "ready"
            ){

                processing++;

            }


            if(
                status ===
                "completed"
            ){

                completed++;

            }

        }
    );


    document.getElementById(
        "totalOrders"
    ).textContent =
    orders.length;


    document.getElementById(
        "pendingOrders"
    ).textContent =
    pending;


    document.getElementById(
        "processingOrders"
    ).textContent =
    processing;


    document.getElementById(
        "completedOrders"
    ).textContent =
    completed;

}

/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(
    status
){

    return (
        "status-" +
        String(status)
        .toLowerCase()
    );

}


/* =====================================================
   CAPITALIZE STATUS
===================================================== */

function capitalizeStatus(
    status
){

    const text =
    String(status || "");


    return (
        text.charAt(0).toUpperCase() +
        text.slice(1)
    );

}


/* =====================================================
   DATE
===================================================== */

function formatDate(
    value
){

    if(!value){

        return "-";

    }


    const date =
    new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return String(value);

    }


    return date.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
){

    return String(value)
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   ESCAPE JS
===================================================== */

function escapeJS(
    value
){

    return String(value)
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        '\\"'
    )
    .replace(
        /\n/g,
        "\\n"
    )
    .replace(
        /\r/g,
        "\\r"
    );

}


/* =====================================================
   SUCCESS
===================================================== */

function showSuccess(
    message
){

    const box =
    document.getElementById(
        "successMessage"
    );


    box.textContent =
    message;


    box.style.display =
    "block";


    setTimeout(
        function(){

            box.style.display =
            "none";

        },
        5000
    );

}


/* =====================================================
   ERROR
===================================================== */

function showError(
    message
){

    const box =
    document.getElementById(
        "errorMessage"
    );


    box.textContent =
    message;


    box.style.display =
    "block";

}


/* =====================================================
   HIDE MESSAGES
===================================================== */

function hideMessages(){

    document.getElementById(
        "successMessage"
    ).style.display =
    "none";


    document.getElementById(
        "errorMessage"
    ).style.display =
    "none";

}
