<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel | AviPrint Portal</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .admin-container {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px;
        }

        .admin-header {
            background: #111827;
            color: white;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .admin-header h1 {
            margin: 0;
            font-size: 24px;
        }

        .logout-btn {
            background: #ef4444;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            margin: 0 0 10px;
            color: #6b7280;
            font-size: 15px;
        }

        .stat-card p {
            margin: 0;
            font-size: 28px;
            font-weight: bold;
            color: #111827;
        }

        .orders-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .orders-section h2 {
            margin-top: 0;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f9fafb;
            color: #374151;
        }

        .status-select {
            padding: 7px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        @media (max-width: 800px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .admin-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }

        @media (max-width: 500px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .admin-container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="admin-container">

    <div class="admin-header">
        <h1>🖨️ AviPrint Admin Panel</h1>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div id="errorMessage" class="error"></div>

    <div class="stats">

        <div class="stat-card">
            <h3>Total Orders</h3>
            <p id="totalOrders">0</p>
        </div>

        <div class="stat-card">
            <h3>Pending</h3>
            <p id="pendingOrders">0</p>
        </div>

        <div class="stat-card">
            <h3>Completed</h3>
            <p id="completedOrders">0</p>
        </div>

        <div class="stat-card">
            <h3>Total Users</h3>
            <p id="totalUsers">0</p>
        </div>

    </div>

    <div class="orders-section">

        <h2>📦 All Orders</h2>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>User</th>
                        <th>Service</th>
                        <th>Quantity</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>

                <tbody id="ordersTable">

                    <tr>
                        <td colspan="6" class="loading">
                            Loading orders...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


// ======================================
// SUPABASE CONFIG
// ======================================

const SUPABASE_URL = "YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";


const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


// ======================================
// CHECK ADMIN LOGIN
// ======================================

async function checkAdmin() {

    const {
        data: { user }
    } = await supabase.auth.getUser();

    if (!user) {

        window.location.href = "login.html";

        return;
    }

    /*
       IMPORTANT:
       Replace this email with your actual
       admin email.
    */

    const ADMIN_EMAIL = "YOUR_ADMIN_EMAIL";

    if (user.email !== ADMIN_EMAIL) {

        alert("Access denied. Admin only.");

        window.location.href = "dashboard.html";

        return;
    }

    loadDashboard();
}


// ======================================
// LOAD DASHBOARD
// ======================================

async function loadDashboard() {

    await loadOrders();

    await loadUsers();

}


// ======================================
// LOAD ORDERS
// ======================================

async function loadOrders() {

    const { data, error } = await supabase
        .from("orders")
        .select("*")
        .order("created_at", { ascending: false });


    if (error) {

        showError(error.message);

        return;
    }


    const orders = data || [];


    document.getElementById("totalOrders").textContent =
        orders.length;


    document.getElementById("pendingOrders").textContent =
        orders.filter(order =>
            order.status === "pending"
        ).length;


    document.getElementById("completedOrders").textContent =
        orders.filter(order =>
            order.status === "completed"
        ).length;


    const table =
        document.getElementById("ordersTable");


    if (orders.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="6" class="loading">
                    No orders found.
                </td>
            </tr>
        `;

        return;
    }


    table.innerHTML = "";


    orders.forEach(order => {

        const row = document.createElement("tr");


        row.innerHTML = `

            <td>
                ${order.id || "-"}
            </td>

            <td>
                ${order.user_id || "-"}
            </td>

            <td>
                ${order.service || "-"}
            </td>

            <td>
                ${order.quantity || 1}
            </td>

            <td>

                <select
                    class="status-select"
                    data-id="${order.id}"
                >

                    <option value="pending"
                        ${order.status === "pending" ? "selected" : ""}>
                        Pending
                    </option>

                    <option value="processing"
                        ${order.status === "processing" ? "selected" : ""}>
                        Processing
                    </option>

                    <option value="printing"
                        ${order.status === "printing" ? "selected" : ""}>
                        Printing
                    </option>

                    <option value="completed"
                        ${order.status === "completed" ? "selected" : ""}>
                        Completed
                    </option>

                    <option value="cancelled"
                        ${order.status === "cancelled" ? "selected" : ""}>
                        Cancelled
                    </option>

                </select>

            </td>

            <td>
                ${
                    order.created_at
                    ? new Date(order.created_at).toLocaleString()
                    : "-"
                }
            </td>
        `;


        const select =
            row.querySelector(".status-select");


        select.addEventListener(
            "change",
            async function () {

                await updateOrderStatus(
                    order.id,
                    this.value
                );

            }
        );


        table.appendChild(row);

    });

}


// ======================================
// UPDATE ORDER STATUS
// ======================================

async function updateOrderStatus(
    orderId,
    newStatus
) {

    const { error } = await supabase

        .from("orders")

        .update({
            status: newStatus
        })

        .eq("id", orderId);


    if (error) {

        alert(
            "Status update failed: " +
            error.message
        );

        return;
    }


    alert("Order status updated successfully.");

    loadOrders();

}


// ======================================
// LOAD USERS
// ======================================

async function loadUsers() {

    /*
       This requires a users/profile table
       accessible by the current user.

       If your portal currently uses another
       table name, we will change it later.
    */

    const { data, error } = await supabase
        .from("profiles")
        .select("id");


    if (error) {

        console.log(
            "Profiles table not available:",
            error.message
        );

        document.getElementById(
            "totalUsers"
        ).textContent = "0";

        return;
    }


    document.getElementById(
        "totalUsers"
    ).textContent =
        data ? data.length : 0;

}


// ======================================
// ERROR
// ======================================

function showError(message) {

    const box =
        document.getElementById("errorMessage");

    box.textContent = message;

    box.style.display = "block";

}


// ======================================
// LOGOUT
// ======================================

window.logout = async function () {

    await supabase.auth.signOut();

    window.location.href = "login.html";

};


// ======================================
// START
// ======================================

checkAdmin();

</script>

</body>
</html>
