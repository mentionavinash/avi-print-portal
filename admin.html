<script>

const ADMIN_EMAIL = "aviinformatics@gmail.com";
const STORAGE_BUCKET = "print-files";


/* =========================================
   ELEMENTS
========================================= */

const adminEmail = document.getElementById("adminEmail");

const totalOrders = document.getElementById("totalOrders");
const pendingOrders = document.getElementById("pendingOrders");
const processingOrders = document.getElementById("processingOrders");
const completedOrders = document.getElementById("completedOrders");

const ordersBody = document.getElementById("ordersBody");

const loading = document.getElementById("loading");
const empty = document.getElementById("empty");
const tableWrapper = document.getElementById("tableWrapper");
const errorBox = document.getElementById("errorBox");

const searchInput = document.getElementById("searchInput");
const refreshButton = document.getElementById("refreshButton");
const logoutButton = document.getElementById("logoutButton");

const orderModal = document.getElementById("orderModal");
const modalDetails = document.getElementById("modalDetails");
const closeModal = document.getElementById("closeModal");

let allOrders = [];


/* =========================================
   SUPABASE CHECK
========================================= */

if (
    typeof supabaseClient === "undefined" ||
    !supabaseClient
) {

    adminEmail.textContent = "Supabase client missing.";

    throw new Error(
        "supabaseClient missing. Check config.js"
    );

}


/* =========================================
   ADMIN SESSION
========================================= */

async function checkAdmin() {

    try {

        const result =
            await supabaseClient.auth.getSession();

        if (result.error) {
            throw result.error;
        }

        const session =
            result.data.session;

        if (
            !session ||
            !session.user
        ) {

            window.location.replace("login.html");

            return false;
        }

        const email =
            String(
                session.user.email || ""
            )
            .trim()
            .toLowerCase();

        if (
            email !==
            ADMIN_EMAIL.toLowerCase()
        ) {

            alert(
                "Access denied. Admin account required."
            );

            await supabaseClient.auth.signOut();

            window.location.replace("login.html");

            return false;
        }

        adminEmail.textContent =
            "Logged in as Admin: " +
            session.user.email;

        return true;

    }
    catch (error) {

        console.error(
            "Admin session error:",
            error
        );

        adminEmail.textContent =
            "Session error";

        return false;
    }

}


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders() {

    loading.classList.remove("hidden");

    tableWrapper.classList.add("hidden");

    empty.classList.add("hidden");

    errorBox.classList.add("hidden");

    ordersBody.innerHTML = "";

    try {

        const result =
            await supabaseClient
                .rpc("get_admin_orders");

        if (result.error) {
            throw result.error;
        }

        allOrders =
            result.data || [];

        console.log(
            "ADMIN ORDERS:",
            allOrders
        );

        updateStats(allOrders);

        loading.classList.add("hidden");

        renderOrders(allOrders);

    }
    catch (error) {

        console.error(
            "ORDER LOAD ERROR:",
            error
        );

        loading.classList.add("hidden");

        errorBox.innerHTML =
            "Unable to load orders.<br><br>" +
            escapeHTML(
                error.message ||
                "Unknown error"
            );

        errorBox.classList.remove("hidden");
    }

}


/* =========================================
   UPDATE STATS
========================================= */

function updateStats(orders) {

    totalOrders.textContent =
        orders.length;

    pendingOrders.textContent =
        orders.filter(
            order =>
                normalizeStatus(order.status) ===
                "pending"
        ).length;

    processingOrders.textContent =
        orders.filter(
            order =>
                normalizeStatus(order.status) ===
                "processing"
        ).length;

    completedOrders.textContent =
        orders.filter(
            order =>
                normalizeStatus(order.status) ===
                "completed"
        ).length;

}


/* =========================================
   NORMALIZE STATUS
========================================= */

function normalizeStatus(status) {

    const value =
        String(
            status || "pending"
        )
        .trim()
        .toLowerCase();

    if (
        value === "pending" ||
        value === "processing" ||
        value === "completed" ||
        value === "cancelled"
    ) {

        return value;

    }

    return "pending";

}


/* =========================================
   RENDER ORDERS
========================================= */

function renderOrders(orders) {

    ordersBody.innerHTML = "";

    if (!orders.length) {

        tableWrapper.classList.add("hidden");

        empty.classList.remove("hidden");

        return;
    }

    empty.classList.add("hidden");

    tableWrapper.classList.remove("hidden");


    orders.forEach(function(order) {

        const row =
            document.createElement("tr");


        const orderNumber =
            order.order_number ||
            (
                order.id
                ?
                order.id.substring(0, 8)
                :
                "-"
            );


        const customerName =
            order.customer_name ||
            "Customer";


        const customerEmail =
            order.customer_email ||
            "";


        const service =
            order.service_name ||
            "Print Service";


        const details =
            order.service_details ||
            "Printing order";


        const status =
            normalizeStatus(
                order.status
            );


        const amount =
            Number(
                order.amount || 0
            ).toFixed(2);


        const date =
            formatDate(
                order.order_date ||
                order.created_at
            );


        row.innerHTML = `

        <td>

            <span class="order-number">

                #${escapeHTML(orderNumber)}

            </span>

        </td>


        <td>

            <div class="customer-name">

                ${escapeHTML(customerName)}

            </div>

            <div class="customer-email">

                ${escapeHTML(
                    customerEmail || "-"
                )}

            </div>

        </td>


        <td>

            <div class="service-name">

                ${escapeHTML(service)}

            </div>

            <div class="service-details">

                ${escapeHTML(details)}

            </div>

        </td>


        <td>

            ${escapeHTML(date)}

        </td>


        <td>

            <span class="amount">

                ₹${amount}

            </span>

        </td>


        <td>

            <select
                class="status-select ${status}"
                data-order-id="${escapeHTML(order.id)}"
            >

                <option
                    value="pending"
                    ${status === "pending" ? "selected" : ""}
                >
                    Pending
                </option>

                <option
                    value="processing"
                    ${status === "processing" ? "selected" : ""}
                >
                    Processing
                </option>

                <option
                    value="completed"
                    ${status === "completed" ? "selected" : ""}
                >
                    Completed
                </option>

                <option
                    value="cancelled"
                    ${status === "cancelled" ? "selected" : ""}
                >
                    Cancelled
                </option>

            </select>

        </td>


        <td>

            <button
                type="button"
                class="view-btn"
                data-order-id="${escapeHTML(order.id)}"
            >

                View

            </button>

        </td>

        `;


        ordersBody.appendChild(row);

    });


    /* =========================================
       STATUS EVENTS
    ========================================= */

    ordersBody
        .querySelectorAll(".status-select")
        .forEach(function(select) {

            select.addEventListener(
                "change",
                async function() {

                    const orderId =
                        select.getAttribute(
                            "data-order-id"
                        );

                    const newStatus =
                        normalizeStatus(
                            select.value
                        );

                    await updateOrderStatus(
                        orderId,
                        newStatus
                    );

                }
            );

        });


    /* =========================================
       VIEW EVENTS
    ========================================= */

    ordersBody
        .querySelectorAll(".view-btn")
        .forEach(function(button) {

            button.addEventListener(
                "click",
                function() {

                    const orderId =
                        button.getAttribute(
                            "data-order-id"
                        );

                    const order =
                        allOrders.find(
                            function(item) {

                                return (
                                    item.id ===
                                    orderId
                                );

                            }
                        );

                    if (order) {

                        showOrderDetails(order);

                    }

                }
            );

        });

}


/* =========================================
   UPDATE STATUS
========================================= */

async function updateOrderStatus(
    orderId,
    newStatus
) {

    const allowedStatuses = [
        "pending",
        "processing",
        "completed",
        "cancelled"
    ];


    const finalStatus =
        String(
            newStatus || ""
        )
        .trim()
        .toLowerCase();


    if (
        !allowedStatuses.includes(
            finalStatus
        )
    ) {

        alert(
            "Invalid order status."
        );

        await loadOrders();

        return;
    }


    try {

        console.log(
            "Updating order:",
            orderId
        );

        console.log(
            "New status:",
            finalStatus
        );


        const result =
            await supabaseClient
                .from("orders")
                .update({
                    status: finalStatus
                })
                .eq(
                    "id",
                    orderId
                )
                .select()
                .single();


        if (result.error) {

            throw result.error;

        }


        console.log(
            "STATUS UPDATED:",
            result.data
        );


        alert(
            "Order status updated successfully."
        );


        await loadOrders();

    }
    catch (error) {

        console.error(
            "STATUS UPDATE ERROR:",
            error
        );

        await loadOrders();

        alert(
            "Failed to update order status: " +
            (
                error.message ||
                "Unknown error"
            )
        );

    }

}


/* =========================================
   SHOW ORDER DETAILS
========================================= */

function showOrderDetails(order) {

    const status =
        normalizeStatus(
            order.status
        );


    const amount =
        Number(
            order.amount || 0
        ).toFixed(2);


    const filePath =
        String(
            order.file_path || ""
        ).trim();


    const fileName =
        order.file_name ||
        "Print File";


    modalDetails.innerHTML = `

        <div class="modal-row">

            <span>
                Order Number
            </span>

            <strong>
                #${escapeHTML(
                    order.order_number ||
                    order.id ||
                    "-"
                )}
            </strong>

        </div>


        <div class="modal-row">

            <span>
                Customer Name
            </span>

            <strong>
                ${escapeHTML(
                    order.customer_name ||
                    "-"
                )}
            </strong>

        </div>


        <div class="modal-row">

            <span>
                Customer Email
            </span>

            <strong>
                ${escapeHTML(
                    order.customer_email ||
                    "-"
                )}
            </strong>

        </div>


        <div class="modal-row">

            <span>
                Service
            </span>

            <strong>
                ${escapeHTML(
                    order.service_name ||
                    "-"
                )}
            </strong>

        </div>


        <div class="modal-row">

            <span>
                Details
            </span>

            <strong>
                ${escapeHTML(
                    order.service_details ||
                    "-"
                )}
            </strong>

        </div>


        <div class="modal-row">

            <span>
                Date
            </span>

            <strong>
                ${escapeHTML(
                    formatDate(
                        order.order_date ||
                        order.created_at
                    )
                )}
            </strong>

        </div>


        <div class="modal-row">

            <span>
                Status
            </span>

            <strong>
                ${escapeHTML(status)}
            </strong>

        </div>


        <div class="modal-row">

            <span>
                Amount
            </span>

            <strong>
                ₹${amount}
            </strong>

        </div>


        <div class="modal-row">

            <span>
                File Name
            </span>

            <strong>
                ${escapeHTML(fileName)}
            </strong>

        </div>


        <div class="modal-row">

            <span>
                File Path
            </span>

            <strong>
                ${escapeHTML(
                    filePath || "-"
                )}
            </strong>

        </div>


        <div
            style="
                margin-top:20px;
                display:flex;
                gap:10px;
                flex-wrap:wrap;
            "
        >

            <button
                type="button"
                id="viewFileButton"
                style="
                    border:1px solid #dbeafe;
                    background:#eff6ff;
                    color:#2563eb;
                    padding:10px 15px;
                    border-radius:8px;
                    cursor:pointer;
                    font-size:12px;
                    font-weight:700;
                "
            >
                View File
            </button>


            <button
                type="button"
                id="downloadFileButton"
                style="
                    border:1px solid #dcfce7;
                    background:#f0fdf4;
                    color:#166534;
                    padding:10px 15px;
                    border-radius:8px;
                    cursor:pointer;
                    font-size:12px;
                    font-weight:700;
                "
            >
                Download File
            </button>

        </div>


        <div
            id="fileMessage"
            style="
                margin-top:14px;
                font-size:12px;
                color:#6b7280;
            "
        ></div>

    `;


    orderModal.classList.add("show");


    const viewFileButton =
        document.getElementById(
            "viewFileButton"
        );


    const downloadFileButton =
        document.getElementById(
            "downloadFileButton"
        );


    const fileMessage =
        document.getElementById(
            "fileMessage"
        );


    if (!filePath) {

        viewFileButton.disabled = true;

        downloadFileButton.disabled = true;

        fileMessage.textContent =
            "No file path saved for this order.";

        return;
    }


    /* =========================================
       VIEW FILE
    ========================================= */

    viewFileButton.addEventListener(
        "click",
        async function() {

            viewFileButton.disabled = true;

            viewFileButton.textContent =
                "Opening...";

            fileMessage.textContent =
                "Creating secure file link...";


            try {

                const signedUrl =
                    await createFileUrl(
                        filePath
                    );


                if (!signedUrl) {

                    throw new Error(
                        "Could not create file URL."
                    );

                }


                window.open(
                    signedUrl,
                    "_blank",
                    "noopener,noreferrer"
                );


                fileMessage.textContent =
                    "File opened successfully.";

            }
            catch (error) {

                console.error(
                    "VIEW FILE ERROR:",
                    error
                );

                fileMessage.textContent =
                    "File could not be opened: " +
                    error.message;

            }
            finally {

                viewFileButton.disabled =
                    false;

                viewFileButton.textContent =
                    "View File";

            }

        }
    );


    /* =========================================
       DOWNLOAD FILE
    ========================================= */

    downloadFileButton.addEventListener(
        "click",
        async function() {

            downloadFileButton.disabled = true;

            downloadFileButton.textContent =
                "Preparing...";

            fileMessage.textContent =
                "Creating secure download link...";


            try {

                const signedUrl =
                    await createFileUrl(
                        filePath
                    );


                if (!signedUrl) {

                    throw new Error(
                        "Could not create file URL."
                    );

                }


                const link =
                    document.createElement("a");


                link.href =
                    signedUrl;


                link.download =
                    fileName;


                link.target =
                    "_blank";


                link.rel =
                    "noopener";


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();


                fileMessage.textContent =
                    "Download started.";

            }
            catch (error) {

                console.error(
                    "DOWNLOAD FILE ERROR:",
                    error
                );

                fileMessage.textContent =
                    "File could not be downloaded: " +
                    error.message;

            }
            finally {

                downloadFileButton.disabled =
                    false;

                downloadFileButton.textContent =
                    "Download File";

            }

        }
    );

}


/* =========================================
   CREATE SIGNED FILE URL
========================================= */

async function createFileUrl(filePath) {

    const cleanPath =
        String(filePath || "")
            .trim()
            .replace(/^\/+/, "");


    if (!cleanPath) {

        throw new Error(
            "File path is empty."
        );

    }


    console.log(
        "Storage bucket:",
        STORAGE_BUCKET
    );

    console.log(
        "Storage file path:",
        cleanPath
    );


    /*
       Private bucket ke liye signed URL.
       1 hour validity.
    */

    const result =
        await supabaseClient
            .storage
            .from(STORAGE_BUCKET)
            .createSignedUrl(
                cleanPath,
                3600
            );


    if (result.error) {

        console.error(
            "SUPABASE STORAGE ERROR:",
            result.error
        );

        throw new Error(
            result.error.message ||
            "Object not found"
        );

    }


    if (
        !result.data ||
        !result.data.signedUrl
    ) {

        throw new Error(
            "Signed URL was not generated."
        );

    }


    return result.data.signedUrl;

}


/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(
    "input",
    function() {

        const query =
            String(
                this.value || ""
            )
            .toLowerCase()
            .trim();


        if (!query) {

            renderOrders(
                allOrders
            );

            return;
        }


        const filtered =
            allOrders.filter(
                function(order) {

                    const orderNumber =
                        String(
                            order.order_number ||
                            ""
                        )
                        .toLowerCase();


                    const name =
                        String(
                            order.customer_name ||
                            ""
                        )
                        .toLowerCase();


                    const email =
                        String(
                            order.customer_email ||
                            ""
                        )
                        .toLowerCase();


                    const service =
                        String(
                            order.service_name ||
                            ""
                        )
                        .toLowerCase();


                    const details =
                        String(
                            order.service_details ||
                            ""
                        )
                        .toLowerCase();


                    const status =
                        normalizeStatus(
                            order.status
                        );


                    return (

                        orderNumber.includes(query) ||

                        name.includes(query) ||

                        email.includes(query) ||

                        service.includes(query) ||

                        details.includes(query) ||

                        status.includes(query)

                    );

                }
            );


        renderOrders(
            filtered
        );

    }
);


/* =========================================
   REFRESH
========================================= */

refreshButton.addEventListener(
    "click",
    async function() {

        refreshButton.disabled = true;

        refreshButton.textContent =
            "Loading...";


        await loadOrders();


        refreshButton.disabled = false;

        refreshButton.textContent =
            "↻ Refresh Orders";

    }
);


/* =========================================
   CLOSE MODAL
========================================= */

closeModal.addEventListener(
    "click",
    function() {

        orderModal.classList.remove(
            "show"
        );

    }
);


orderModal.addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            orderModal
        ) {

            orderModal.classList.remove(
                "show"
            );

        }

    }
);


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            orderModal.classList.remove(
                "show"
            );

        }

    }
);


/* =========================================
   LOGOUT
========================================= */

logoutButton.addEventListener(
    "click",
    async function() {

        logoutButton.disabled = true;

        logoutButton.textContent =
            "Logging out...";


        try {

            const result =
                await supabaseClient.auth.signOut();


            if (result.error) {

                throw result.error;

            }


            window.location.replace(
                "login.html"
            );

        }
        catch (error) {

            console.error(
                "Logout error:",
                error
            );

            alert(
                "Logout failed. Please try again."
            );


            logoutButton.disabled =
                false;

            logoutButton.textContent =
                "Logout";

        }

    }
);


/* =========================================
   DATE
========================================= */

function formatDate(value) {

    if (!value) {
        return "-";
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "-";
    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================
   START
========================================= */

(async function() {

    const isAdmin =
        await checkAdmin();


    if (!isAdmin) {
        return;
    }


    await loadOrders();

})();

</script>
