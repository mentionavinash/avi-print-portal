<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login Required | AviPrint Portal</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        #loadingScreen {
            position: fixed;
            inset: 0;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 99999;
        }

        #adminPanel {
            display: none;
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #374151;
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px;
        }

        .header {
            background: #111827;
            color: white;
            padding: 22px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
        }

        button {
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        .logout {
            background: #ef4444;
            color: white;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin: 25px 0;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
        }

        .card h3 {
            margin: 0 0 10px;
            color: #6b7280;
        }

        .card p {
            margin: 0;
            font-size: 28px;
            font-weight: bold;
        }

        .orders {
            background: white;
            padding: 25px;
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f9fafb;
        }

        select {
            padding: 7px;
            border-radius: 6px;
        }

        @media(max-width:700px) {

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

<!-- ================================= -->
<!-- LOADING SCREEN -->
<!-- ================================= -->

<div id="loadingScreen">

    <div class="loader"></div>

    <div>
        Checking authentication...
    </div>

</div>


<!-- ================================= -->
<!-- ADMIN PANEL -->
<!-- ================================= -->

<div id="adminPanel">

    <div class="container">

        <div class="header">

            <div>

                <h1>
                    🖨️ AviPrint Admin Panel
                </h1>

                <p>
                    Administrator Dashboard
                </p>

            </div>

            <button
                class="logout"
                id="logoutBtn">

                Logout

            </button>

        </div>


        <!-- STATS -->

        <div class="stats">

            <div class="card">

                <h3>
                    Total Orders
                </h3>

                <p id="totalOrders">
                    0
                </p>

            </div>


            <div class="card">

                <h3>
                    Pending
                </h3>

                <p id="pendingOrders">
                    0
                </p>

            </div>


            <div class="card">

                <h3>
                    Completed
                </h3>

                <p id="completedOrders">
                    0
                </p>

            </div>


            <div class="card">

                <h3>
                    Total Users
                </h3>

                <p id="totalUsers">
                    0
                </p>

            </div>

        </div>


        <!-- ORDERS -->

        <div class="orders">

            <h2>
                📦 All Orders
            </h2>

            <table>

                <thead>

                    <tr>

                        <th>
                            Order ID
                        </th>

                        <th>
                            User ID
                        </th>

                        <th>
                            Service
                        </th>

                        <th>
                            Quantity
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Date
                        </th>

                    </tr>

                </thead>


                <tbody id="ordersTable">

                    <tr>

                        <td colspan="6">
                            Loading...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script type="module">

import {
    createClient
} from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


// ==========================================
// SUPABASE CONFIG
// ==========================================

const SUPABASE_URL =
"https://pmqmewceqnxsvlhceeef.supabase.co";


const SUPABASE_KEY =
"sb_publishable_mWPszaFzSHbPp-OHlPGWjw_JdrMU6oQ";


const ADMIN_EMAIL =
"aviinformatics@gmail.com";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ==========================================
// ELEMENTS
// ==========================================

const loadingScreen =
document.getElementById(
    "loadingScreen"
);

const adminPanel =
document.getElementById(
    "adminPanel"
);


// ==========================================
// REDIRECT LOGIN
// ==========================================

function redirectToLogin() {

    window.location.replace(
        "login.html"
    );

}


// ==========================================
// SECURITY CHECK
// ==========================================

async function securityCheck() {

    try {

        // Get current session

        const {
            data: {
                session
            }
        } =
        await supabase.auth.getSession();


        // NO SESSION

        if (!session) {

            redirectToLogin();

            return;

        }


        const user =
        session.user;


        // NO USER

        if (!user) {

            redirectToLogin();

            return;

        }


        // CHECK EMAIL

        if (
            !user.email ||
            user.email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
        ) {

            alert(
                "Access denied. Admin only."
            );

            await supabase.auth.signOut();

            redirectToLogin();

            return;

        }


        // =================================
        // CHECK ADMIN ROLE
        // =================================

        const {
            data: profile,
            error
        } =
        await supabase

        .from("profiles")

        .select("role")

        .eq(
            "id",
            user.id
        )

        .maybeSingle();


        if (error) {

            console.error(
                error
            );

            alert(
                "Admin verification failed."
            );

            await supabase.auth.signOut();

            redirectToLogin();

            return;

        }


        // ROLE NOT ADMIN

        if (
            !profile ||
            profile.role !==
            "admin"
        ) {

            alert(
                "You are not an administrator."
            );

            await supabase.auth.signOut();

            redirectToLogin();

            return;

        }


        // =================================
        // EVERYTHING VERIFIED
        // =================================

        loadingScreen.style.display =
            "none";

        adminPanel.style.display =
            "block";


        loadOrders();

        loadUsers();


    } catch (error) {

        console.error(
            error
        );

        redirectToLogin();

    }

}


// ==========================================
// LOAD ORDERS
// ==========================================

async function loadOrders() {

    const {
        data,
        error
    } =
    await supabase

    .from("orders")

    .select("*")

    .order(
        "created_at",
        {
            ascending: false
        }
    );


    if (error) {

        console.error(
            error
        );

        document.getElementById(
            "ordersTable"
        ).innerHTML = `

            <tr>

                <td colspan="6">

                    Unable to load orders:
                    ${error.message}

                </td>

            </tr>

        `;

        return;

    }


    const orders =
    data || [];


    document.getElementById(
        "totalOrders"
    ).textContent =
    orders.length;


    document.getElementById(
        "pendingOrders"
    ).textContent =

    orders.filter(
        order =>
        order.status ===
        "pending"
    ).length;


    document.getElementById(
        "completedOrders"
    ).textContent =

    orders.filter(
        order =>
        order.status ===
        "completed"
    ).length;


    const table =
    document.getElementById(
        "ordersTable"
    );


    if (
        orders.length === 0
    ) {

        table.innerHTML = `

            <tr>

                <td colspan="6">

                    No orders found.

                </td>

            </tr>

        `;

        return;

    }


    table.innerHTML = "";


    orders.forEach(
        order => {

            const row =
            document.createElement(
                "tr"
            );


            row.innerHTML = `

                <td>
                    ${order.id || "-"}
                </td>

                <td>
                    ${order.user_id || "-"}
                </td>

                <td>
                    ${order.service || "-"}
                </td>

                <td>
                    ${order.quantity || 1}
                </td>

                <td>

                    <select
                        class="status"
                        data-id="${order.id}"
                    >

                        <option value="pending"
                            ${order.status === "pending" ? "selected" : ""}>
                            Pending
                        </option>

                        <option value="processing"
                            ${order.status === "processing" ? "selected" : ""}>
                            Processing
                        </option>

                        <option value="printing"
                            ${order.status === "printing" ? "selected" : ""}>
                            Printing
                        </option>

                        <option value="completed"
                            ${order.status === "completed" ? "selected" : ""}>
                            Completed
                        </option>

                        <option value="cancelled"
                            ${order.status === "cancelled" ? "selected" : ""}>
                            Cancelled
                        </option>

                    </select>

                </td>

                <td>

                    ${
                        order.created_at
                        ? new Date(
                            order.created_at
                        ).toLocaleString()
                        : "-"
                    }

                </td>

            `;


            const select =
            row.querySelector(
                ".status"
            );


            select.addEventListener(
                "change",
                async function() {

                    const {
                        error
                    } =
                    await supabase

                    .from("orders")

                    .update({
                        status:
                        this.value
                    })

                    .eq(
                        "id",
                        order.id
                    );


                    if (error) {

                        alert(
                            "Update failed: " +
                            error.message
                        );

                        return;

                    }


                    alert(
                        "Order status updated."
                    );

                    loadOrders();

                }
            );


            table.appendChild(
                row
            );

        }
    );

}


// ==========================================
// LOAD USERS
// ==========================================

async function loadUsers() {

    const {
        data,
        error
    } =
    await supabase

    .from("profiles")

    .select("id");


    if (error) {

        document.getElementById(
            "totalUsers"
        ).textContent =
        "—";

        return;

    }


    document.getElementById(
        "totalUsers"
    ).textContent =
    data
    ? data.length
    : 0;

}


// ==========================================
// LOGOUT
// ==========================================

document
.getElementById(
    "logoutBtn"
)
.addEventListener(
    "click",
    async function() {

        await supabase.auth.signOut();

        redirectToLogin();

    }
);


// ==========================================
// START SECURITY CHECK
// ==========================================

securityCheck();

</script>

</body>
</html>
